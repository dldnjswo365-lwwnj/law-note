 시행지역은 축척계수를 제외한 이동ㆍ회전 변환계수만 산출하여 변환한다.","blanks":[]},{"lvl":0,"label":"②","text":"제1항의 공통점을 이용한 변환방법이 변환구역 변환에 적합하지 않는 경우에는 평균편차조정방법, 현형변환방법 및 좌표재계산방법으로 변환 할 수 있다.","blanks":[]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-14","no":"제14조","title":"평균편차조정방법","lines":[{"lvl":0,"label":"①","text":"평균편차조정방법은 제13조제1항의 공통점을 이용한 방법으로 변환된 성과가 지역측지계 지적측량 성과와 들어맞지 않아 조정이 필요한 지역에 적용한다.","blanks":[]},{"lvl":0,"label":"②","text":"평균편차조정방법의 적용은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"변환구역 단위로 선정된 공통점을 이용하여 2차원 헬머트(Helmert)변환 모델에 의해 변환계수를 산출한다.","blanks":[]},{"lvl":1,"label":"2.","text":"산출된 변환계수로 조정이 필요한 변환구역 단위 공통점들의 편차량을 구한다.","blanks":[]},{"lvl":1,"label":"3.","text":"조정이 필요한 변환구역 단위 공통점들의 편차량을 지역측지계 지적측량성과와 들어맞도록 평균값을 구하여 조정한다.","blanks":[]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-15","no":"제15조","title":"현형변환방법","lines":[{"lvl":0,"label":"①","text":"현형변환방법은 지역측지계에서 현형법으로 지적측량성과를 결정하는 지역에 적용한다.","blanks":[{"s":16,"e":19,"t":"term"}]},{"lvl":0,"label":"②","text":"현형변환방법의 적용은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"해당 변환구역의 지적측량성과 자료를 확보한다. 다만, 자료를 확보할 수 없는 경우에는 지적측량을 실시하여야 한다.","blanks":[]},{"lvl":1,"label":"2.","text":"지역측지계 지적측량성과에 의해 결정된 경계점, 측판점 및 가감된 지적기준점 등을 공통점으로 선정한다.","blanks":[{"s":36,"e":41,"t":"term"}]},{"lvl":1,"label":"3.","text":"제10조제2항에 의해 결정된 변환구역 내에서는 지역적 특성에 따라 현형성과 이동량을 조정한다.","blanks":[]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-16","no":"제16조","title":"좌표재계산방법","lines":[{"lvl":0,"label":"①","text":"좌표재계산방법은 경계점좌표등록부 시행 지역에서 지적확정측량 당시의 관측부 및 계산부가 보존되어 있는 경우에 적용한다.","blanks":[{"s":26,"e":32,"t":"term"}]},{"lvl":0,"label":"②","text":"좌표재계산방법은 다음 각 호의 순서에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적확정측량 당시에 사용된 지적기준점의 세계측지계 성과를 산출한다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":15,"e":20,"t":"term"}]},{"lvl":1,"label":"2.","text":"제1호에 따라 산출한 세계측지계 성과를 기준으로 지적확정측량 당시의 계산부상 각과 거리를 이용하여 필지경계를 재계산한다.","blanks":[{"s":27,"e":33,"t":"term"}]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-17","no":"제17조","title":"변환성과 검증","lines":[{"lvl":0,"label":"①","text":"변환성과 검증은 위치 검증과 면적 검증으로 구분하여 실시한다.","blanks":[]},{"lvl":0,"label":"②","text":"검증필지는 변환구역 내 모든 필지를 대상으로 하며, 부득이한 경우 지적소관청이 정하는 기준으로 할 수 있다.","blanks":[{"s":37,"e":42,"t":"org"}]},{"lvl":0,"label":"③","text":"위치 검증성과는 필지별 2개 이상의 경계점을 대상으로 공통점의 지역측지계 성과에서 변환 전 필지의 도상좌표까지 각과 거리를 계산하고 이 값을 사용하여 공통점의 세계측지계 성과를 기준으로 좌표를 산출한다.","blanks":[{"s":13,"e":15,"t":"num"}]},{"lvl":0,"label":"④","text":"변환성과의 위치 검증은 제3항에 따라 산출한 성과와 비교하여 검증하며, 위치 검증결과 차이가 다음 각 호의 범위 이내인 경우에는 변환성과를 최종성과로 결정한다.","blanks":[]},{"lvl":1,"label":"1.","text":"경계점좌표등록부 시행지역 : 5cm","blanks":[{"s":16,"e":19,"t":"num"}]},{"lvl":1,"label":"2.","text":"그 밖의 지역 : 10cm","blanks":[{"s":10,"e":14,"t":"num"}]},{"lvl":0,"label":"⑤","text":"변환성과의 면적 검증은 다음 각 호에 의하여 검증한다.","blanks":[]},{"lvl":1,"label":"1.","text":"필지의 산출면적은 좌표면적계산법에 의하며, 1천분의 1제곱미터까지 계산하여 정한다.","blanks":[{"s":10,"e":17,"t":"term"},{"s":24,"e":34,"t":"num"}]},{"lvl":1,"label":"2.","text":"면적의 비교는 필지의 변환 전과 후의 산출면적을 비교하여 검증한다.","blanks":[]},{"lvl":1,"label":"3.","text":"제2호에 따른 허용면적 공차는 변환 전 산출면적 × 1/10,000㎡ 이내로 한다.","blanks":[{"s":29,"e":38,"t":"num"}],"patch":"img","patchSrc":["원문 이미지를 보고 글자로 옮겼어요(두 번 판독해 일치). 숫자는 아래 ‘원문 이미지’와 대조해 주세요."]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-18","no":"제18조","title":"성과물 작성","lines":[{"lvl":0,"label":"①","text":"시행자는 세계측지계 변환이 완료된 때에는 다음 각 호의 성과물을 별지 제1호 서식부터 제8호 서식에 따라 작성한다.","blanks":[]},{"lvl":1,"label":"1.","text":"변환 결과부","blanks":[]},{"lvl":1,"label":"2.","text":"공통점 배치도","blanks":[]},{"lvl":1,"label":"3.","text":"변환계수 산출부","blanks":[]},{"lvl":1,"label":"4.","text":"공통점측량 관측표(정지측량)","blanks":[{"s":10,"e":14,"t":"term"}]},{"lvl":1,"label":"5.","text":"공통점측량 관측부(정지측량)","blanks":[{"s":10,"e":14,"t":"term"}]},{"lvl":1,"label":"6.","text":"공통점측량 관측부(단일기준국ㆍ다중기준국실시간이동측량)","blanks":[{"s":10,"e":15,"t":"term"},{"s":21,"e":28,"t":"term"}]},{"lvl":1,"label":"7.","text":"위치검증 계산부","blanks":[]},{"lvl":1,"label":"8.","text":"면적검증 계산부","blanks":[]},{"lvl":0,"label":"②","text":"기존에 확보된 공통점의 경우, 제1항 제4호 내지 제6호 서식의 작성을 제외한다.","blanks":[]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-19","no":"제19조","title":"성과검사의 방법 등","lines":[{"lvl":0,"label":"①","text":"공통점의 성과검사는 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"「지적재조사에 관한 특별법 시행규칙」제6조제4항에 따른다.","blanks":[]},{"lvl":1,"label":"2.","text":"지적소관청은 성과검사가 완료된 공통점을 법 제8조에 따라 기준점 표지로 관리하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"세계측지계 변환 성과검사는 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"대행자가 세계측지계로 변환한 성과는 지적소관청이 검사하고, 지적소관청이 변환한 성과는 시ㆍ도지사가 검사하되 효율적 업무 추진을 위하여 부득이한 경우 지적소관청으로 위임할 수 있으며, 이 경우 변환수행자와 검사자를 달리하여 검사하여야 한다.","blanks":[{"s":20,"e":25,"t":"org"},{"s":33,"e":38,"t":"org"},{"s":48,"e":53,"t":"org"},{"s":83,"e":88,"t":"org"}]},{"lvl":1,"label":"2.","text":"제17조에 따른 변환성과 검증 결과가 허용범위를 초과하는 경우에는 그 원인을 조사하여 변환작업을 재수행하여야 한다. 다만, 허용범위를 초과하는 필지수가 변환구역 전체 필지수의 100분의 5 이하이거나, 지적소관청이 변환구역 전체의 변환성과에 지장이 없다고 판단하는 경우에는 그러하지 아니하다.","blanks":[{"s":98,"e":105,"t":"num"},{"s":113,"e":118,"t":"org"}]},{"lvl":1,"label":"3.","text":"제2호에 따라 변환작업을 재수행한 결과가 제17조제4항에 따른 범위를 초과하는 경우에는 변환성과 검증자료와 현장조사, 기존 지적측량 결과도, 수치지도, 정사영상 등을 종합적으로 검토하여 최종 지적불부합지로 결정한다.","blanks":[]},{"lvl":0,"label":"③","text":"세계측지계 변환성과 검사항목은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"공통점 선정 및 변환계수 산출의 적정성","blanks":[]},{"lvl":1,"label":"2.","text":"공통점 측량의 적정성 및 결과물 점검(기존에 확보된 공통점은 제외)","blanks":[]},{"lvl":1,"label":"3.","text":"변환방법의 적정성","blanks":[]},{"lvl":1,"label":"4.","text":"변환성과 검증 결과","blanks":[]},{"lvl":1,"label":"5.","text":"변환 성과물 점검","blanks":[]}],"chap":"제3장 세계측지계 변환"},{"id":"wgs-20","no":"제20조","title":"지적공부 등록","lines":[{"lvl":0,"label":"①","text":"지적소관청은 제19조의 규정에 따라 성과검사를 완료한 세계측지계 변환성과는 법 제2조제19호의 지적공부로 등록하여야 한다. 이 경우 기존 지적도, 임야도 및 경계점좌표등록부는 폐쇄하고 별도로 영구 보관하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"지적소관청은 제1항에 따라 세계측지계 변환성과를 지적공부로 등록한 경우에는 지체 없이 다음 각 호의 사항을 일간신문에 게재하거나 해당 시ㆍ군ㆍ구의 게시판 또는 인터넷 홈페이지에 20일 이상 공고하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":99,"e":102,"t":"per"}]},{"lvl":1,"label":"1.","text":"지적공부 세계측지계 변환의 관련근거, 목적 및 주요 내용","blanks":[{"s":0,"e":19,"t":"item"},{"s":21,"e":31,"t":"item"}]},{"lvl":1,"label":"2.","text":"지적공부 등록 대상 및 시행일자","blanks":[{"s":0,"e":17,"t":"item"}]},{"lvl":1,"label":"3.","text":"그 밖에 필요한 사항","blanks":[]}],"chap":"제4장 변환 후 성과관리 등"},{"id":"wgs-21","no":"제21조","title":"도면정비","lines":[{"lvl":0,"label":"①","text":"지적소관청은 세계측지계 변환 사업의 원활한 추진을 위하여 필요한 경우 지적(임야)도의 행정구역ㆍ축척ㆍ도곽별로 등록된 필지의 경계 간 이격ㆍ공백ㆍ중복 등의 오류 정비를 병행하여 추진한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"제1항에 따른 도면정비는「지적도ㆍ임야도 정비지침」(지적기획과-1555, 2011.6.28.)에 따른다.","blanks":[]}],"chap":"제4장 변환 후 성과관리 등"},{"id":"wgs-22","no":"제22조","title":"지적불부합지 정리","lines":[{"lvl":0,"label":"","text":"지적소관청은 제19조제2항제3호에 따라 추출된 지적불부합지는「지적재조사에 관한 특별법」제7조에 따른 지적재조사사업으로 정리하거나 법 제84조에 따른 등록사항의 정정으로 정리할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제4장 변환 후 성과관리 등"},{"id":"wgs-23","no":"제23조","title":"재검토기한","lines":[{"lvl":0,"label":"","text":"국토교통부장관은 이 훈령에 대하여 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 2021년 7월 1일 기준으로 매3년이 되는 시점(매 3년째의 6월 30일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":67,"e":68,"t":"num"},{"s":79,"e":80,"t":"num"}]}],"chap":"제5장 보 칙"}]},"wondo":{"id":"wondo","name":"지적원도 데이터베이스 구축 작업기준","kind":"국토교통부예규","effective":"2020-08-10","promulgated":"2020-08-10","url":"https://www.law.go.kr/행정규칙/지적원도 데이터베이스 구축 작업기준","short":"지적원도 DB 작업기준","annex":["[별표 1] 작업 파일명 부여기준","[별표 2] 레이어 부여기준","[별표 3] 지적측량기준점코드 부여기준","[별표 4] 원점코드 부여기준","[별표 5] 지목코드 부여기준","[별표 6] 행정코드 부여기준","[별표 7] 성과계획수립 참고 (KS X ISO 19113 지리정보-품질원칙)","[별표 8] 메타데이터 항목 (KS X ISO 19115 지리정보-메타데이터)","[별지 1] 장비 점검일지","[별지 2] 지적원도 처리방안 기록부","[별지 3] 예외사항 처리대장","[별지 4] 지적원도 수치파일 검사대장","[별지 5] 연속지적원도 처리방안 기록부"],"rule":true,"articles":[{"id":"wondo-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 기준은 지적원도를 데이터베이스로 구축하기 위한 세부적인 작업방법과 절차 등을 정하고, 성과물의 표준화로 지적원도 데이터베이스의 정확도 및 호환성을 확보함을 목적으로 한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"wondo-2","no":"제2조","title":"용어의 정의","lines":[{"lvl":0,"label":"","text":"이 기준에서 사용하는 용어의 정의는 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"지적원도”란 토지·임야조사사업 당시 지적·임야도를 제작하기 위해 세부측량을 완료한 결과도면으로서, 현재 국가기록원 등에 보관중인 세부측량원도를 말한다.","blanks":[]},{"lvl":1,"label":"2.","text":"\"이미지파일”이란 도면스캐너에 의하여 제작된 낱장 형식의 이미지화 된 지적원도 전산파일을 말한다.","blanks":[]},{"lvl":1,"label":"3.","text":"\"좌표독취”란 좌표독취기 또는 좌표독취 응용프로그램을 이용하여 지적원도 이미지파일의 필지경계 굴곡점을 수치형식으로 순차 기록하는 작업을 말한다.","blanks":[]},{"lvl":1,"label":"4.","text":"\"수치파일”이란 지적원도의 필지경계점을 좌표독취 하고, 지번, 지목 등의 속성정보를 전산정보처리장치에 의하여 기록한 도곽 단위의 전산파일을 말한다.","blanks":[]},{"lvl":1,"label":"5.","text":"\"보정파일”이란 신축이 있는 지적원도 수치파일을 축척별 기준 도곽에 일치하도록 신축량을 보정한 수치파일을 말한다.","blanks":[]},{"lvl":1,"label":"6.","text":"\"통일원점 좌표변환”이란 구소삼각원점, 특별소삼각원점, 기타원점 등으로 제작된 지적원도를 지역측지계 기준의 동부원점, 중부원점, 서부원점, 동해원점의 통일원점계열로 변환하는 것을 말한다.","blanks":[]},{"lvl":1,"label":"7.","text":"\"도면접합”이란 지적원도 보정파일과 연접한 다른 지적원도 보정파일을 서로 접합하여 도곽선상에서 단절된 필지경계선을 연속된 도면형태로 접합 처리하는 작업을 말한다.","blanks":[]},{"lvl":1,"label":"8.","text":"\"연속지적원도”란 도면접합이 완료되어 하나의 행정구역 단위로 제작된 지적원도 전산파일을 말한다.","blanks":[]},{"lvl":1,"label":"9.","text":"\"도면데이터베이스”란 보정파일내의 필지 경계를 폐합(廢合)이 되도록 폴리건(polygon)을 형성하고, 구조화편집 등의 과정을 거쳐 각종 공간정보시스템에서 활용할 수 있도록 작업과정을 거친 최종 전산파일을 말한다.","blanks":[{"s":26,"e":32,"t":"term"}]}],"chap":"제1장 총칙"},{"id":"wondo-3","no":"제3조","title":"작업공정","lines":[{"lvl":0,"label":"","text":"지적원도 데이터베이스 구축 작업공정은 다음 각 호의 순서에 따른다. 다만, 발주기관이 지시 또는 승인한 경우는 작업순서의 일부를 변경 또는 생략할 수 있다.","blanks":[]},{"lvl":1,"label":"1.","text":"작업계획 수립","blanks":[]},{"lvl":1,"label":"2.","text":"작업준비","blanks":[]},{"lvl":1,"label":"3.","text":"지적원도 이미지파일 제작","blanks":[]},{"lvl":1,"label":"4.","text":"좌표독취(벡터라이징)","blanks":[]},{"lvl":1,"label":"5.","text":"속성정보 입력","blanks":[]},{"lvl":1,"label":"6.","text":"지적원도 수치파일 제작","blanks":[]},{"lvl":1,"label":"7.","text":"검수도면 출력","blanks":[]},{"lvl":1,"label":"8.","text":"지적원도 수치파일 검수","blanks":[]},{"lvl":1,"label":"9.","text":"지적원도 신축보정","blanks":[]},{"lvl":1,"label":"10.","text":"지적원도 보정파일 제작","blanks":[]},{"lvl":1,"label":"11.","text":"통일원점 좌표변환","blanks":[]},{"lvl":1,"label":"12.","text":"도면접합","blanks":[]},{"lvl":1,"label":"13.","text":"연속지적원도 제작","blanks":[]},{"lvl":1,"label":"14.","text":"세계측지계 좌표변환","blanks":[]},{"lvl":1,"label":"15.","text":"구조화편집","blanks":[]},{"lvl":1,"label":"16.","text":"데이터베이스 구축","blanks":[]},{"lvl":1,"label":"17.","text":"최종 성과 검수","blanks":[]},{"lvl":1,"label":"18.","text":"지적원도 데이터베이스 시스템 탑재 및 검증","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-4","no":"제4조","title":"사용장비","lines":[{"lvl":0,"label":"①","text":"지적원도 이미지파일 제작에 사용되는 자동독취기(스캐너)의 규격은 다음 각 호의 기준에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"형식 : 평판밀착스캔방식","blanks":[]},{"lvl":1,"label":"2.","text":"정밀도 : 0.1㎜ 이상","blanks":[{"s":6,"e":10,"t":"num"}]},{"lvl":1,"label":"3.","text":"광학해상도 : 2,000DPI 이상","blanks":[{"s":8,"e":16,"t":"num"}]},{"lvl":1,"label":"4.","text":"스캔 유효범위 : 지적원도 규격 이상","blanks":[]},{"lvl":0,"label":"②","text":"수치파일 검수도면 출력에 사용하는 출력장치의 정밀도, 성능 및 기능은 다음 각 호의 기준에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"출력 유효범위 : 600×900㎜(A1) 이상","blanks":[{"s":10,"e":18,"t":"num"}]},{"lvl":1,"label":"2.","text":"최소선 굵기 : 0.04㎜ 이상","blanks":[{"s":9,"e":14,"t":"num"}]},{"lvl":1,"label":"3.","text":"Line 정확도 : ±0.1%","blanks":[{"s":11,"e":16,"t":"num"}]},{"lvl":1,"label":"4.","text":"인쇄해상도 : 2400×1200DPI 이상","blanks":[{"s":8,"e":20,"t":"num"}]},{"lvl":1,"label":"5.","text":"용지공급 : 롤, 낱장공급, 자동절단 등","blanks":[]},{"lvl":1,"label":"6.","text":"용지의 종류 : 백상지, 트레싱지, 필름지","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-5","no":"제5조","title":"전산파일의 형식","lines":[{"lvl":0,"label":"①","text":"지적원도 전산파일은 각 공정별로 파일명칭을 부여하여 저장하여야 하며, 저장형식은 다음 각 호의 기준에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적원도 이미지파일 : TIFF 또는 JPG","blanks":[]},{"lvl":1,"label":"2.","text":"지적원도 수치파일 : DWG, DXF","blanks":[]},{"lvl":1,"label":"3.","text":"지적원도 보정파일 : DWG, DXF","blanks":[]},{"lvl":1,"label":"4.","text":"연속지적원도 전산파일 : DWG, DXF, SHP","blanks":[]},{"lvl":1,"label":"5.","text":"일람도 전산파일 : DWG, DXF, SHP","blanks":[]},{"lvl":1,"label":"6.","text":"행정경계 전산파일 : DWG, DXF, SHP","blanks":[]},{"lvl":1,"label":"7.","text":"지적측량기준점 전산파일 : DWG, DXF, SHP","blanks":[]},{"lvl":0,"label":"②","text":"지적원도 전산파일의 명칭은 별표 1에 따른다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-6","no":"제6조","title":"레이어 지정","lines":[{"lvl":0,"label":"","text":"지적원도 전산파일 제작을 위한 레이어는 데이터 종류에 따라 별표 2와 같이 구분하여 지정하여야 한다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-7","no":"제7조","title":"지적원도 정보화 항목","lines":[{"lvl":0,"label":"","text":"지적원도 전산파일 제작에 필요한 입력 항목은 다음 각 호와 같으며, 그밖에 지적원도에 기록되어 있는 모든 내용은 전산정보처리장치를 통하여 입력하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"행정구역 명칭","blanks":[]},{"lvl":1,"label":"2.","text":"도면번호 및 축척","blanks":[]},{"lvl":1,"label":"3.","text":"도곽선 및 도곽선수치","blanks":[]},{"lvl":1,"label":"4.","text":"행정구역선","blanks":[]},{"lvl":1,"label":"5.","text":"필지 경계 및 인접경계표시선","blanks":[]},{"lvl":1,"label":"6.","text":"지번·지목","blanks":[]},{"lvl":1,"label":"7.","text":"소유자","blanks":[]},{"lvl":1,"label":"8.","text":"필지순번","blanks":[]},{"lvl":1,"label":"9.","text":"사용세목","blanks":[]},{"lvl":1,"label":"10.","text":"측량경계점 거리","blanks":[]},{"lvl":1,"label":"11.","text":"지적측량기준점 명칭 및 좌표","blanks":[]},{"lvl":1,"label":"12.","text":"유수방향","blanks":[]},{"lvl":1,"label":"13.","text":"교량","blanks":[]},{"lvl":1,"label":"14.","text":"인접도면번호","blanks":[]},{"lvl":1,"label":"15.","text":"측량년월일","blanks":[]},{"lvl":1,"label":"16.","text":"원점명 및 기타 필요한 사항","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-8","no":"제8조","title":"작업계획 수립","lines":[{"lvl":0,"label":"①","text":"작업책임자는 지적원도 전산파일 작업공정에 따라 다음 각 호의 사항들이 포함된 작업계획서를 작성하여 발주기관에 제출하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"입력대상지역","blanks":[{"s":0,"e":6,"t":"item"}]},{"lvl":1,"label":"2.","text":"사용할 장비의 현황","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"3.","text":"작업예정공정표","blanks":[{"s":0,"e":7,"t":"item"}]},{"lvl":1,"label":"4.","text":"작업흐름도","blanks":[{"s":0,"e":5,"t":"item"}]},{"lvl":1,"label":"5.","text":"보완관리계획","blanks":[{"s":0,"e":6,"t":"item"}]},{"lvl":1,"label":"6.","text":"기타 작업에 필요한 사항","blanks":[]},{"lvl":0,"label":"②","text":"발주기관은 작업책임자가 제출한 작업계획서를 검토한 후 사업추진에 필요한 조치를 하게 할 수 있다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-9","no":"제9조","title":"작업준비","lines":[{"lvl":0,"label":"","text":"작업책임자는 본 업무 수행을 위하여 다음 각 호와 같은 작업준비를 하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"작업자 교육","blanks":[]},{"lvl":1,"label":"2.","text":"자료 목록부 작성","blanks":[]},{"lvl":1,"label":"3.","text":"작업공정표 작성","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-10","no":"제10조","title":"이미지파일 제작","lines":[{"lvl":0,"label":"①","text":"지적원도 이미지파일은 제4조제1항에 따른 자동독취기(스캐너)를 사용하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"작업자는 장비를 매일 1회 이상 정기적으로 점검하고, 그 내용을 별지 제1호서식의 장비 점검일지에 기록·관리하여야 한다.","blanks":[{"s":12,"e":14,"t":"num"}]},{"lvl":0,"label":"③","text":"스캐닝은 지적원도를 편 상태에서 장비에 압착 또는 흡착시켜야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"스캔화면이 평탄하지 않거나 흐려 기계의 조정이 필요한 경우 정밀계측기를 이용하여 편차를 확인하고 조정계수를 적용하여 지적원도와 입력결과가 동일하도록 조치하여야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"장비가 정상적으로 작동하지 않을 경우 즉시 작업을 중단하고 그 원인을 파악 후 조치하여야 하며, 고장내용과 조치결과를 장비점검일지에 기록하여야 한다.","blanks":[]},{"lvl":0,"label":"⑥","text":"스캐닝이 완료된 이미지파일은 좌표독취가 가능한 전산파일로 변환하여 지정된 폴더에 저장한다.","blanks":[]},{"lvl":0,"label":"⑦","text":"이미지파일 제작은 반드시 지적원도 보관장소 또는 발주기관이 지정한 작업장에서 실시하여야 한다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-11","no":"제11조","title":"좌표독취","lines":[{"lvl":0,"label":"①","text":"지적원도의 좌표독취는 제10조제6항에 따라 저장된 이미지파일을 대상으로 좌표독취기 또는 좌표독취 응용프로그램을 활용하여 다음 각 호의 사항을 레이어별로 입력하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"도곽선","blanks":[{"s":0,"e":3,"t":"item"}]},{"lvl":1,"label":"2.","text":"필지경계선","blanks":[{"s":0,"e":5,"t":"item"}]},{"lvl":1,"label":"3.","text":"행정구역선","blanks":[{"s":0,"e":5,"t":"item"}]},{"lvl":1,"label":"4.","text":"지적측량기준점","blanks":[{"s":0,"e":7,"t":"item"}]},{"lvl":1,"label":"5.","text":"기타 선형 등","blanks":[]},{"lvl":0,"label":"②","text":"제1항에 따라 입력되는 좌표는 해당 도면 좌하단점의 도곽선수치를 기준으로 가산한다.","blanks":[]},{"lvl":0,"label":"③","text":"경계점간 연결되는 선은 굵기가 0.1㎜ 이하가 되도록 하여야 한다.","blanks":[{"s":17,"e":21,"t":"num"}]},{"lvl":0,"label":"④","text":"좌표독취는 반드시 수동방식의 취득방법으로 하여야 하며, 경계점을 명확히 구분할 수 있도록 확대한 후 작업을 실시하여야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"좌표독취는 밀리미터(㎜)단위로 하되, 소수점 이하 2자리 이상 취득하여 미터(m)단위로 소수점 이하 3자리까지 결정하여야 한다.","blanks":[{"s":28,"e":31,"t":"num"},{"s":56,"e":59,"t":"num"}]},{"lvl":0,"label":"⑥","text":"필지의 경계는 중복되지 않아야 하며 경계가 만나는 지점의 좌표는 동일하여야 하고, 경계에 이어지는 다른 필지의 경계는 그 경계를 벗어나서는 아니된다.","blanks":[]},{"lvl":0,"label":"⑦","text":"도곽선은 좌하단, 좌상단, 우상단, 우하단 방향으로 4점의 도곽점을 연결한 선형으로 입력하여야 한다.","blanks":[{"s":29,"e":31,"t":"num"}]},{"lvl":0,"label":"⑧","text":"행정구역선은 지적원도에 표시된 유형별 선형(도계, 부·군계 등)으로 입력하며, 지적원도에 행정구역선이 없는 경우 위성영상 등을 활용하여 입력하여야 한다.","blanks":[]},{"lvl":0,"label":"⑨","text":"지적원도에 표시된 지형·지물은 기타로 입력하거나 레이어를 추가하여 입력하여야 한다.","blanks":[]},{"lvl":0,"label":"⑩","text":"각 필지경계선의 편집은 다음 각 호의 기준에 따라 작업하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"이미지데이터와 최종 벡터데이터를 화면에서 비교하여 도상 0.1㎜범위 내에서 생성하여야 한다.","blanks":[{"s":31,"e":35,"t":"num"}]},{"lvl":1,"label":"2.","text":"필지경계선 중 직선경계는 각 굴곡점에 하나씩의 점(Vertex) 데이터만 있어야 한다.","blanks":[]},{"lvl":1,"label":"3.","text":"필지 단위의 필지경계선은 반드시 폐합되어야 한다.","blanks":[]},{"lvl":1,"label":"4.","text":"다른 필지경계선으로 분기되는 지점이 있는 경우에는 반드시 점(Vertex) 데이터로 시작하여야 한다.","blanks":[]},{"lvl":1,"label":"5.","text":"연속되는 모든 선형데이터는 연결되어야 한다.","blanks":[]},{"lvl":1,"label":"6.","text":"지적원도의 오기 또는 누락으로 지적도의 표현이 불합리한 경우에는 별지 제2호서식의 지적원도 처리방안 기록부에 기재하고, 그 내용을 발주기관에 보고하여 협의를 거쳐 작업하여야 한다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-12","no":"제12조","title":"속성정보 입력","lines":[{"lvl":0,"label":"①","text":"지적원도의 속성정보는 일필지 단위로 입력하되, 지번은 아라비아숫자로 행정구역·지목·소유자 등은 한글로 하여 가로쓰기 입력한다.","blanks":[]},{"lvl":0,"label":"②","text":"제1항에 따른 속성정보는 필지 중앙에 위치하도록 하며, 지번 및 경계 등과 겹치지 않게 레이어 기준을 준용하여 입력하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"지적원도에 소유자가 기록되어 있는 경우 지번·지목 아래에 한글로 소유자를 입력한다.","blanks":[]},{"lvl":0,"label":"④","text":"지적원도에 기록된 모든 문자들은 빠짐없이 입력하여야 하며, 그 내용이 특이하거나 일관성이 없는 경우에는 별지 제3호서식의 예외사항 처리대장을 작성하여 발주기관에 보고하고 입력여부에 대한 지시를 받아 작업을 진행한다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-13","no":"제13조","title":"수치파일 제작","lines":[{"lvl":0,"label":"","text":"지적원도 이미지파일의 좌표독취 및 속성정보 입력이 완료되면 제5조에 따른 형식으로 수치파일을 제작하고, 작업관리자는 그 목록을 작성·관리하여야 한다.","blanks":[]}],"chap":"제2장 지적원도 이미지파일 및 수치파일 제작"},{"id":"wondo-14","no":"제14조","title":"성과검사계획 수립","lines":[{"lvl":0,"label":"①","text":"작업관리자는 지적원도 수치파일 제작 품질 향상을 위하여 자체 성과검사계획을 수립하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"성과검사계획 수립을 위하여 KS X ISO 19113 지리정보-품질원칙을 준용하여 지적원도 수치파일의 완전성, 논리적 일관성, 위치정확성, 주제 정확성을 포함하여(별표 7) 성과검사계획을 수립하여야 한다.","blanks":[]}],"chap":"제3장 성과검사"},{"id":"wondo-15","no":"제15조","title":"검사도면 출력","lines":[{"lvl":0,"label":"","text":"작업관리자는 지적원도 수치파일 제작이 완료되면 그 결과도면을 트레싱지에 출력하고, 자체 검사인력을 확보하여 작업량 전체를 대상으로 전수검사를 하여야 한다.","blanks":[]}],"chap":"제3장 성과검사"},{"id":"wondo-16","no":"제16조","title":"지적원도 수치파일 성과검사","lines":[{"lvl":0,"label":"①","text":"검사자는 제15조에 따라 출력된 검사용 트레싱지를 지적원도에 중첩하여 도곽선을 일치시킨 후, 필지경계점의 부합여부를 육안으로 대조하여 도곽선 및 필지경계선에 0.1㎜이상의 편차가 있는 경우에는 재작업토록 하여야 한다.","blanks":[{"s":88,"e":92,"t":"num"}]},{"lvl":0,"label":"②","text":"필지경계선의 미달(Under Shoot) 및 초과(Over Shoot) 입력여부를 검사하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"지번·지목·소유자 등 각종 속성정보를 정확하게 입력하였는지 여부를 검사하여야 하며, 필지가 작아 육안으로 입력정보의 확인이 곤란한 경우 컴퓨터를 이용하여 수치파일을 확대한 상태에서 확인하여야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"자체 성과검사 결과 잘못 입력된 필지경계점과 속성정보는 검사용 트레싱지에 적색 필기구로 표기하고, 그 내용을 별지 제4호서식의 지적원도 수치파일 검사대장에 기록한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"자체 성과검사가 완료되면 검사자는 트레싱지와 검사대장에 서명과 날인 한다.","blanks":[]}],"chap":"제3장 성과검사"},{"id":"wondo-17","no":"제17조","title":"속성데이터 성과검사","lines":[{"lvl":0,"label":"","text":"검사자는 지적원도 속성데이터의 다음 각 호의 항목을 검사하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"레이어 검사","blanks":[]},{"lvl":1,"label":"2.","text":"행정구역별 지번 중복필지 검사","blanks":[]},{"lvl":1,"label":"3.","text":"지번, 지목, 필지순번, 소유자 등의 누락 및 필지 내 중복여부 검사","blanks":[]}],"chap":"제3장 성과검사"},{"id":"wondo-18","no":"제18조","title":"성과수정","lines":[{"lvl":0,"label":"①","text":"제16조 및 제17조에 따른 지적원도 수치파일 검사 결과 성과수정이 필요한 사항에 대하여 작업자는 검사용 트레싱지와 지적원도 수치파일 검사대장을 확인하여 잘못된 입력정보를 수정하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"작업자는 성과수정 여부를 지적원도 수치파일 검사대장에 기재하고, 작업관리자는 성과수정 적정 여부를 최종 확인한 후 서명·날인한다.","blanks":[]}],"chap":"제3장 성과검사"},{"id":"wondo-19","no":"제19조","title":"신축보정","lines":[{"lvl":0,"label":"①","text":"작업자는 지적원도의 신축량을 고려하지 않고 제작된 수치파일은 데이터베이스 구축을 위하여 축척별 기준 도곽에 일치하도록 「공간정보의 구축 및 관리 등에 관한 법률」(이하 \"법”이라 한다)에서 정한 방법으로 신축을 보정하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"신축보정은 지적원도의 도곽을 기준으로 실시하며, 기타 원점지역 등 도곽이 없는 지적원도의 경우에는 신축보정을 생략할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"작업자가 보정프로그램을 이용하여 지적원도의 신축을 보정하고자 하는 경우에는 해당 프로그램을 발주기관에 사전 검증을 요청하여 승인을 받은 후 사용하여야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"지적원도 내 격자망의 좌표를 취득하여 보정계수를 산출하며, 이를 지적원도 신축보정에 활용하여야 한다.","blanks":[]}],"chap":"제4장 지적원도 보정파일 제작"},{"id":"wondo-20","no":"제20조","title":"보정파일 제작","lines":[{"lvl":0,"label":"","text":"지적원도의 신축보정이 완료되면 제5조에 따른 형식으로 보정파일을 제작하고, 작업관리자는 그 목록을 작성하여 관리하여야 한다.","blanks":[]}],"chap":"제4장 지적원도 보정파일 제작"},{"id":"wondo-21","no":"제21조","title":"신축보정량 관리","lines":[{"lvl":0,"label":"","text":"작업자는 지적원도 도곽별로 보정 전과 후의 신축보정량을 기록·관리하여야 한다.","blanks":[]}],"chap":"제4장 지적원도 보정파일 제작"},{"id":"wondo-22","no":"제22조","title":"작업순서","lines":[{"lvl":0,"label":"","text":"연속지적원도 제작은 다음 각 호의 순서에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"일람도 제작","blanks":[]},{"lvl":1,"label":"2.","text":"접합준비도 제작","blanks":[]},{"lvl":1,"label":"3.","text":"도면 오류 정비","blanks":[]},{"lvl":1,"label":"4.","text":"도면접합","blanks":[]},{"lvl":1,"label":"5.","text":"행정구역경계 작성","blanks":[]},{"lvl":1,"label":"6.","text":"접합성과품 작성","blanks":[]},{"lvl":1,"label":"7.","text":"성과 검사","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-23","no":"제23조","title":"일람도 제작","lines":[{"lvl":0,"label":"①","text":"작업자는 지적원도의 도곽을 추출하여 도면번호를 기재하고 행정구역별, 축척별로 일람도 파일을 제작한다.","blanks":[]},{"lvl":0,"label":"②","text":"일람도는 해당 축척의 10분의 1로 제작하는 것을 원칙으로 한다. 다만, 해당 축척의 10분의 1로 제작하는 것이 곤란한 경우에는 발주기관의 승인을 얻어 임의의 축척으로 제작할 수 있다.","blanks":[{"s":12,"e":18,"t":"num"},{"s":48,"e":54,"t":"num"}]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-24","no":"제24조","title":"접합준비도 제작","lines":[{"lvl":0,"label":"","text":"준비된 작업영역 전체의 지적원도를 이용하여 원시접합도를 작성하고, 작성된 원시접합도를 정비하여 접합준비도를 제작한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-25","no":"제25조","title":"오류 정비","lines":[{"lvl":0,"label":"","text":"작업자는 접합준비도를 통해 도면상의 오류가 발견되면 다음 각 호에 따라 작업을 진행한다.","blanks":[]},{"lvl":1,"label":"1.","text":"오류의 원인을 분석하여 원인이 경미한 경우에는 작업책임자와 협의한 후 도면접합을 수행하여야 한다.","blanks":[]},{"lvl":1,"label":"2.","text":"오류의 원인이 중대한 경우에는 별지 제5호서식의 연속지적원도 처리방안 기록부에 기록하고, 그 내용을 발주기관에게 보고한 후 협의를 거쳐 도면접합을 수행하여야 한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-26","no":"제26조","title":"도면접합","lines":[{"lvl":0,"label":"","text":"지적원도의 접합은 제28조의 도면접합 원칙에 따라 다음 각 호와 같은 순서로 수행한다.","blanks":[]},{"lvl":1,"label":"1.","text":"동일 행정구역내 축척별 도곽간 접합","blanks":[]},{"lvl":1,"label":"2.","text":"동일 행정구역내 축척간 접합","blanks":[]},{"lvl":1,"label":"3.","text":"동일 행정구역내 원점간 접합","blanks":[]},{"lvl":1,"label":"4.","text":"행정구역간 접합","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-27","no":"제27조","title":"행정구역경계 작성","lines":[{"lvl":0,"label":"","text":"접합이 완료된 행정구역을 단위로 하여 다음 각 호와 같은 행정구역 경계를 작성한다.","blanks":[]},{"lvl":1,"label":"1.","text":"리·동 경계","blanks":[]},{"lvl":1,"label":"2.","text":"읍·면 경계","blanks":[]},{"lvl":1,"label":"3.","text":"시·군·구 경계","blanks":[]},{"lvl":1,"label":"4.","text":"시·도 경계","blanks":[]},{"lvl":1,"label":"5.","text":"원점간 경계","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-28","no":"제28조","title":"일반원칙","lines":[{"lvl":0,"label":"","text":"도면접합은 지적원도의 전체 현황을 파악하여 다음 각 호와 같은 일반원칙에 따라 작업하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"도면접합은 도곽을 기준으로 접합하는 것을 원칙으로 하며, 접합대상 필지는 형태와 면적의 변화를 최소화 한다.","blanks":[]},{"lvl":1,"label":"2.","text":"서로 다른 축척간의 접합 시 대축척의 필지경계선을 기준으로 접합처리 한다.","blanks":[]},{"lvl":1,"label":"3.","text":"소면적 필지경계를 우선하여 접합한다.","blanks":[]},{"lvl":1,"label":"4.","text":"도곽선 주위의 폐합된 필지경계를 우선하여 접합처리 한다.","blanks":[]},{"lvl":1,"label":"5.","text":"지번과 필지의 중복 및 누락이 발생한 경우에는 자료조사를 실시한 후 발주기관과 협의하여 처리하고, 연속지적원도 처리방안 기록부에 기록한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-29","no":"제29조","title":"같은 행정구역내 도곽간 접합","lines":[{"lvl":0,"label":"①","text":"같은 행정구역내 축척별 접합 중 한 필지가 여러 도면에 폐합되어 있는 경우의 도면접합은 다음 각 호와 같이 처리한다.","blanks":[]},{"lvl":1,"label":"1.","text":"중복·이격 및 어긋나는 부분이 적고 면적에 미치는 영향이 미미한 경우, 폐합된 필지 중 1개 필지를 선택하여 접합한다.","blanks":[{"s":49,"e":51,"t":"num"}]},{"lvl":1,"label":"2.","text":"중복 및 이격이 비교적 많은 경우 면적 및 형태의 변화를 최소화하는 범위 내에서 면적이 적은 필지를 우선하여 처리하되, 가급적 필지경계선의 중간부분을 취하여 접합한다.","blanks":[]},{"lvl":1,"label":"3.","text":"한 필지가 여러 도면에 폐합되어 있는 경우로, 그 형태가 서로 상이한 경우에는 자료조사를 실시한 후 연속지적원도 처리방안 기록부에 기재하고 발주기관의 승인을 받아 처리한다.","blanks":[]},{"lvl":0,"label":"②","text":"한 필지가 여러 도면에 걸쳐있으나 어떤 도면에도 폐합되어 있지 않은 경우의 도면접합은 다음 각 호와 같이 처리한다.","blanks":[]},{"lvl":1,"label":"1.","text":"도곽선에서 가까운 경계점을 직선으로 연결하여 접합 처리한다.","blanks":[]},{"lvl":1,"label":"2.","text":"중복·이격량이 미세할 경우 필지의 모양을 보존하기 위해 중간부분을 취하여 접합한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-30","no":"제30조","title":"같은 행정구역내 축척간 접합","lines":[{"lvl":0,"label":"","text":"같은 행정구역내 축척간 접합은 다음 각 호와 같이 처리한다.","blanks":[]},{"lvl":1,"label":"1.","text":"대축척의 필지경계선을 기준으로 접합 처리한다.","blanks":[]},{"lvl":1,"label":"2.","text":"접합이 어려운 경우 연속지적원도 처리방안 기록부에 기재하고 그 내용을 발주기관에 보고하여 협의를 거쳐 접합하며, 필지상에 지적선 불일치 정보를 입력하고 작업한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-31","no":"제31조","title":"같은 행정구역내 원점간 접합","lines":[{"lvl":0,"label":"","text":"같은 행정구역내 측량원점간 접합은 다음 각 호와 같이 처리한다.","blanks":[]},{"lvl":1,"label":"1.","text":"행정구역(읍·면, 리·동)이 같고 측량원점이 다른 경우에는 통일원점을 기준으로 접합처리 한다.","blanks":[]},{"lvl":1,"label":"2.","text":"기타 원점이 혼재하는 지역의 경우 통일원점으로 변환처리 한 후 접합처리 하는 것을 원칙으로 한다.","blanks":[]},{"lvl":1,"label":"3.","text":"기타 원점의 통일원점 변환은 세부측량 당시의 기준점에 의한 변환을 원칙으로 한다. 다만, 기준점에 의한 변환이 어려운 경우에는 지구계 경계의 형태로 변환할 수 있다.","blanks":[]},{"lvl":1,"label":"4.","text":"접합이 어려운 경우 연속지적원도 처리방안 기록부에 기재하고 그 내용을 발주기관에 보고하여 협의를 거쳐 접합하며, 필지상에 지적선 불일치 정보를 입력하고 작업한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-32","no":"제32조","title":"행정구역간 접합","lines":[{"lvl":0,"label":"","text":"행정구역간 접합은 다음 각 호에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"행정구역간 인접하는 지역의 축척이 상이한 경우에는 대축척의 필지경계선을 기준으로 접합 처리한다.","blanks":[]},{"lvl":1,"label":"2.","text":"행정구역간 인접하는 지역의 축척이 같은 경우에는 중간부분을 취하여 접합 처리하는 것을 원칙으로 한다.","blanks":[]},{"lvl":1,"label":"3.","text":"접합이 어려운 경우 연속지적원도 처리방안 기록부에 기재하고 그 내용을 발주기관에 보고하여 협의를 거쳐 접합하며, 필지상에 지적선 불일치 정보를 입력하고 작업한다.","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-33","no":"제33조","title":"연속지적원도의 성과검사","lines":[{"lvl":0,"label":"","text":"작업관리자는 다음 항목에 대하여 성과를 검사하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"필지 경계의 폴리건 처리 및 무결성 검사","blanks":[]},{"lvl":1,"label":"2.","text":"컴퓨터상에서 원본데이터와 최종 접합한 데이터를 중첩하여 도곽 부위를 확대한 후 필지에 이상이 있는지에 대한 검사","blanks":[]},{"lvl":1,"label":"3.","text":"행정구역별 지번 중복필지 검사","blanks":[]},{"lvl":1,"label":"4.","text":"지번 및 지목 누락 검사","blanks":[]},{"lvl":1,"label":"5.","text":"속성 레이어 검사","blanks":[]},{"lvl":1,"label":"6.","text":"한필지내 다중 지번 검사","blanks":[]},{"lvl":1,"label":"7.","text":"원본데이터와 접합데이터간 지번, 지목, 소유자 등 일치 검사","blanks":[]}],"chap":"제5장 연속지적원도 제작"},{"id":"wondo-34","no":"제34조","title":"구조화편집","lines":[{"lvl":0,"label":"①","text":"모든 필지는 폐합다각형이 되도록 폴리건을 형성하여야 하며, 두 도곽 이상에 등록되어 있는 필지 중 폐합이 되지 않은 필지는 도곽선을 따라 임의의 경계를 추가하여 폴리건을 형성하고 무결성을 확보하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"필지 내부에 다수의 필지가 연속되어 있는 경우에는 임의로 경계를 분리하여 폴리건을 형성하고, 지번·지목과 구분코드를 입력한다.","blanks":[]},{"lvl":0,"label":"③","text":"필지 내부에 독립된 폴리건이 있는 경우에는 내부에 속한 폴리건에 구분코드를 입력한다.","blanks":[]},{"lvl":0,"label":"④","text":"인접경계 표시선은 별도의 레이어로 구분하여야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"구조화편집 테이터는 원점별·행정구역별·축척별로 하나의 파일로 제작하여야 한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-35","no":"제35조","title":"구조화편집의 검사","lines":[{"lvl":0,"label":"①","text":"제34조에 따라 필지가 분리되어 있거나 임의로 분리한 필지는 필지식별 코드로 원시파일과 연속지적원도 파일을 구분하여야 하며, 비교대상 결과와 동일하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"구조화편집이 완료된 연속지적원도의 폴리건수와 속성의 통계수가 일치하는지 확인하고, 연속지적원도의 전체 속성통계를 검색하여 별도의 속성집계표를 작성하여야 한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-36","no":"제36조","title":"구조화편집 데이터 관리","lines":[{"lvl":0,"label":"","text":"구조화편집이 완료된 데이터는 별도의 기록매체에 저장하여 관리하여야 한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-37","no":"제37조","title":"데이터베이스 구축대상 및 메타데이터 작성","lines":[{"lvl":0,"label":"①","text":"데이터베이스로 구축하여야 할 대상은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"연속지적원도","blanks":[]},{"lvl":1,"label":"2.","text":"일람도 및 행정구역 데이터","blanks":[]},{"lvl":1,"label":"3.","text":"지적측량기준점 데이터","blanks":[]},{"lvl":1,"label":"4.","text":"토지소유자 데이터","blanks":[]},{"lvl":1,"label":"5.","text":"지번, 지목, 좌표면적 데이터","blanks":[]},{"lvl":1,"label":"6.","text":"메타데이터","blanks":[]},{"lvl":1,"label":"7.","text":"기타 필요한 데이터","blanks":[]},{"lvl":0,"label":"②","text":"데이터베이스에 대한 메타데이터의 요소 및 작성방법은 KS X ISO 19115 지리정보-메타데이터 표준을 준용하여(별표 8) 작성한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-38","no":"제38조","title":"작업순서","lines":[{"lvl":0,"label":"","text":"데이터베이스 구축은 다음 각 호의 순서에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"기초자료 준비","blanks":[]},{"lvl":1,"label":"2.","text":"시스템의 준비","blanks":[]},{"lvl":1,"label":"3.","text":"데이터의 환경설정 및 정의","blanks":[]},{"lvl":1,"label":"4.","text":"데이터의 전환","blanks":[]},{"lvl":1,"label":"5.","text":"데이터베이스 전환 전·후의 자료검정","blanks":[]},{"lvl":1,"label":"6.","text":"데이터 관리","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-39","no":"제39조","title":"기초자료 준비","lines":[{"lvl":0,"label":"","text":"데이터베이스 구축을 위하여 다음 각 호의 사항을 미리 준비하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"구조화편집 데이터 속성 집계표","blanks":[{"s":0,"e":16,"t":"item"}]},{"lvl":1,"label":"2.","text":"행정구역 코드집","blanks":[{"s":0,"e":8,"t":"item"}]},{"lvl":1,"label":"3.","text":"행정구역별 영문자 명칭을 기록한 조서","blanks":[{"s":0,"e":20,"t":"item"}]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-40","no":"제40조","title":"데이터의 환경설정","lines":[{"lvl":0,"label":"①","text":"데이터의 최소단위는 동·리별, 축척별로 작성하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"작업영역은 해당 행정구역 전체 지역을 포함할 수 있는 범위 이상으로 설정하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"좌표계 설정은 법에 따른다.","blanks":[]},{"lvl":0,"label":"④","text":"기타원점 지역에 대해서는 좌표변환 알고리즘을 통해 표준화된 통일원점 좌표계의 위치로 회전 및 이동하여 처리하여야 한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-41","no":"제41조","title":"데이터베이스의 전환","lines":[{"lvl":0,"label":"","text":"시스템 환경설정이 완료되면 제38조 각 호의 전산입력자료는 도면 및 속성 데이터베이스로 전환하여야 한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-42","no":"제42조","title":"데이터베이스 전환 전·후의 자료검정","lines":[{"lvl":0,"label":"","text":"도면데이터베이스의 전환이 완료되면, 다음 각 호의 도면 및 속성정보의 현황을 파악하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"폴리건, 지번, 지목, 도면번호의 갯수","blanks":[]},{"lvl":1,"label":"2.","text":"중복 지번수, 무지번수 현황","blanks":[]},{"lvl":1,"label":"3.","text":"좌표계산에 의한 면적 통계","blanks":[]},{"lvl":1,"label":"4.","text":"일람도 및 행정구역 통계","blanks":[]},{"lvl":1,"label":"5.","text":"지적측량기준점 통계","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-43","no":"제43조","title":"데이터베이스의 관리","lines":[{"lvl":0,"label":"","text":"구축된 데이터베이스는 전체 자료를 기록매체에 복사하여 별도 보관하여야 한다.","blanks":[]}],"chap":"제6장 지적원도 데이터베이스 구축"},{"id":"wondo-44","no":"제44조","title":"성과품 납품","lines":[{"lvl":0,"label":"","text":"과업완료시 다음 각 호에 따른 과업성과물 원본을 대용량 저장장치에 저장하여 발주기관에 제출하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적원도 이미지파일 데이터","blanks":[]},{"lvl":1,"label":"2.","text":"지적원도 수치파일 데이터","blanks":[]},{"lvl":1,"label":"3.","text":"지적원도 보정파일 데이터","blanks":[]},{"lvl":1,"label":"4.","text":"연속지적원도 데이터","blanks":[]},{"lvl":1,"label":"5.","text":"일람도 및 행정구역 데이터","blanks":[]},{"lvl":1,"label":"6.","text":"지적측량기준점 데이터","blanks":[]},{"lvl":1,"label":"7.","text":"데이터 목록","blanks":[]},{"lvl":1,"label":"8.","text":"데이터베이스 구축 지침서(안)","blanks":[]},{"lvl":1,"label":"9.","text":"지적원도 검사 출력물","blanks":[]},{"lvl":1,"label":"10.","text":"완료보고서","blanks":[]}],"chap":"제7장 기타"},{"id":"wondo-45","no":"제45조","title":"기타","lines":[{"lvl":0,"label":"","text":"이 작업기준에 정하지 아니한 사항이나 지적원도 데이터베이스 구축에 필요한 사항에 대하여는 발주기관과 협의하거나 승인을 받아 처리할 수 있다.","blanks":[]}],"chap":"제7장 기타"},{"id":"wondo-46","no":"제46조","title":"재검토기한","lines":[{"lvl":0,"label":"","text":"국토교통부장관은 「훈령·예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2021년 1월 1일을 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":68,"e":69,"t":"num"},{"s":80,"e":81,"t":"num"}]}],"chap":"제7장 기타"}]}},"imgs":{"155836323":"data:image/gif;base64,R0lGODlh9QFFAPcAAAAAAAAAMwAAZgAAmQAAzAAA/wArAAArMwArZgArmQArzAAr/wBVAABVMwBVZgBVmQBVzABV/wCAAACAMwCAZgCAmQCAzACA/wCqAACqMwCqZgCqmQCqzACq/wDVAADVMwDVZgDVmQDVzADV/wD/AAD/MwD/ZgD/mQD/zAD//zMAADMAMzMAZjMAmTMAzDMA/zMrADMrMzMrZjMrmTMrzDMr/zNVADNVMzNVZjNVmTNVzDNV/zOAADOAMzOAZjOAmTOAzDOA/zOqADOqMzOqZjOqmTOqzDOq/zPVADPVMzPVZjPVmTPVzDPV/zP/ADP/MzP/ZjP/mTP/zDP//2YAAGYAM2YAZmYAmWYAzGYA/2YrAGYrM2YrZmYrmWYrzGYr/2ZVAGZVM2ZVZmZVmWZVzGZV/2aAAGaAM2aAZmaAmWaAzGaA/2aqAGaqM2aqZmaqmWaqzGaq/2bVAGbVM2bVZmbVmWbVzGbV/2b/AGb/M2b/Zmb/mWb/zGb//5kAAJkAM5kAZpkAmZkAzJkA/5krAJkrM5krZpkrmZkrzJkr/5lVAJlVM5lVZplVmZlVzJlV/5mAAJmAM5mAZpmAmZmAzJmA/5mqAJmqM5mqZpmqmZmqzJmq/5nVAJnVM5nVZpnVmZnVzJnV/5n/AJn/M5n/Zpn/mZn/zJn//8wAAMwAM8wAZswAmcwAzMwA/8wrAMwrM8wrZswrmcwrzMwr/8xVAMxVM8xVZsxVmcxVzMxV/8yAAMyAM8yAZsyAmcyAzMyA/8yqAMyqM8yqZsyqmcyqzMyq/8zVAMzVM8zVZszVmczVzMzV/8z/AMz/M8z/Zsz/mcz/zMz///8AAP8AM/8AZv8Amf8AzP8A//8rAP8rM/8rZv8rmf8rzP8r//9VAP9VM/9VZv9Vmf9VzP9V//+AAP+AM/+AZv+Amf+AzP+A//+qAP+qM/+qZv+qmf+qzP+q///VAP/VM//VZv/Vmf/VzP/V////AP//M///Zv//mf//zP///wAAAAAAAAAAAAAAACH5BAEAAPwALAAAAAD1AUUAAAj/APdNQoNm0sBMAw0WLJhwYUOFDxlGfDgx4UCGDjFOzAiRo0eKGgk2zKTR4keOFUOm3NjRZEuUJ0FCZAmTJkuXFwu6wakypk2XDm0GjVmT6MyeMjOSlLnSqNCbPpE+RVozKUVlysRkwkps6ydin7CG/TRWrNmyZ5WRVZs2LFuxbt2yjfu2LN25bc3WxWt3klZlXQF/2qp2LFq7efPSXbyXL1a+h/FKlou4ctq9aN9i3rw2bCYxYoix9To3s2nJmwtfRjy5tePXlB function astats(aid) {
  const r = { tot: 0, seen: 0, c: 0, w: 0, pend: 0 };
  units(aid).forEach(u => u.blanks.forEach(b => {
    if (!isActive(b)) return;
    r.tot++;
    const x = S.rec[b.bid];
    if (x) { r.seen++; r.c += x.c; r.w += x.w; if (x.last === 'w') r.pend++; }
  }));
  r.acc = r.c + r.w ? r.c / (r.c + r.w) : null;
  r.prog = r.tot ? r.seen / r.tot : 0;
  return r;
}
function sumStats(ids) {
  const r = { tot: 0, seen: 0, c: 0, w: 0, pend: 0 };
  ids.forEach(id => { const s = astats(id); r.tot += s.tot; r.seen += s.seen; r.c += s.c; r.w += s.w; r.pend += s.pend; });
  r.acc = r.c + r.w ? r.c / (r.c + r.w) : null;
  r.prog = r.tot ? r.seen / r.tot : 0;
  return r;
}

function tstats(aid, grp) {
  if (grp === 'all') return astats(aid);
  const r = { tot: 0, seen: 0, c: 0, w: 0, pend: 0 };
  units(aid).forEach(u => u.blanks.forEach(b => {
    if (tkey(b.t) !== grp) return;
    r.tot++;
    const x = S.rec[b.bid];
    if (x) { r.seen++; r.c += x.c; r.w += x.w; if (x.last === 'w') r.pend++; }
  }));
  r.acc = r.c + r.w ? r.c / (r.c + r.w) : null;
  r.prog = r.tot ? r.seen / r.tot : 0;
  return r;
}
function tsum(ids, grp) {
  if (grp === 'all') return sumStats(ids);
  const r = { tot: 0, seen: 0, c: 0, w: 0, pend: 0 };
  ids.forEach(id => { const s = tstats(id, grp); r.tot += s.tot; r.seen += s.seen; r.c += s.c; r.w += s.w; r.pend += s.pend; });
  r.acc = r.c + r.w ? r.c / (r.c + r.w) : null;

}
function weakList(n) {

}
function buildQueue(filter) {

const MATH = PACK.math || {}, MATHKEYS = Object.keys(MATH).sort((a, b) => b.length - a.length);
function rich(seg) {   // 본문·빈칸 정답 안의 수식 문자열을 MathML 로 바꿔 그린다
  if (!MATHKEYS.length) return subs(esc(seg));
  let out = '', i = 0;
  const starts = j => MATHKEYS.find(k => seg.startsWith(k, j));
  while (i < seg.length) {
    const k = starts(i);
    if (k) { out += MATH[k]; i += k.length; continue; }
    let j = i + 1;
    while (j < seg.length && !starts(j)) j++;
    out += subs(esc(seg.slice(i, j))); i = j;
  }
  return out;
}

/* ----- 라우터 ----- */
function parseRoute() { const h = location.hash.replace(/^#\/?/, ''); return h ? h.split('/').map(decodeURIComponent) : []; }

/* ===== 상호작용 ===== */
let SHEET = null, HIST = null, LASTADD = null, _tt;
const needsRerender = () => { const r = parseRoute(); return r[0] === 'review' || (r[0] === 'read' && S.settings.mode === 'card'); };
const findBlankEl = id => $$('.bk[data-bid]').find(x => x.dataset.bid === id);

/* ----- 팝오버·시트·토스트 ----- */
function closePop() { $('#pop-root').innerHTML = ''; }
function pickRect(el, ev) {
  const rs = Array.from(el.getClientRects());
  if (ev && rs.length > 1) { const hit = rs.find(r => ev.clientY >= r.top - 4 && ev.clientY <= r.bottom + 4); if (hit) return hit; }
  return rs[0] || el.getBoundingClientRect();
}
function openPop(el, html, ev) {
  closePop();
  const r = pickRect(el, ev), p = document.createElement('div');
  p.className = 'pop'; p.innerHTML = html;
  $('#pop-root').appendChild(p);
  const w = p.offsetWidth;
  let x = ev && ev.clientX ? Math.max(r.left, Math.min(r.right, ev.clientX)) : r.left + r.width / 2;
  x = Math.max(w / 2 + 8, Math.min(innerWidth - w / 2 - 8, x));
  let y = r.bottom + 8;
  if (y + 58 > innerHeight) y = Math.max(8, r.top - 58);
  p.style.left = x + 'px'; p.style.top = y + 'px';
}
function openSheet(html) { clearTimeout(_tt); $('#toast-root').innerHTML = ''; $('#sheet-root').innerHTML = `<div class="ov"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`; }
function closeSheet() { $('#sheet-root').innerHTML = ''; SHEET = null; }
function toast(msg, acts) {
  clearTimeout(_tt);
  $('#toast-root').innerHTML = `<div class="toast"><span>${esc(msg)}</span>${(acts || []).map(a => `<button data-act="${a[1]}">${esc(a[0])}</button>`).join('')}</div>`;
  _tt = setTimeout(() => { $('#toast-root').innerHTML = ''; }, acts && acts.length ? 6000 : 2400);
}
function askText(title, value, onOk) {
  window.__askOk = onOk;
  openSheet(`<h3>${esc(title)}</h3><div class="f"><input class="in" id="ask-in" value="${esc(value || '')}" maxlength="60"></div><div class="acts"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="askok">확인</button></div>`);
  setTimeout(() => { const i = $('#ask-in'); if (i) i.focus(); }, 60);
}

/* ----- 빈칸 탭(학습) ----- */
function onBlank(el, ev) {

/* ----- 편집 모드(단어 탭) ----- */
const cloneOv = k => (S.ov[k] ? JSON.parse(JSON.stringify(S.ov[k])) : null);
function ovFor(key) {
  if (!S.ov[key]) { const ru = rawUnit(key); S.ov[key] = { text: null, blanks: ru.blanks.map(b => Object.assign({ s: b.s, e: b.e, t: b.t }, b.n ? { n: b.n } : {})), bold: [] }; }
  if (!S.ov[key].bold) S.ov[key].bold = [];
  return S.ov[key];
}
function tidyOv(key) {
  const o = S.ov[key]; if (!o) return;
  const ru = rawUnit(key);
  if (o.bold && !o.bold.length) delete o.bold;
  if (o.text == null && !(o.bold && o.bold.length) && JSON.stringify(o.blanks.map(b => [b.s, b.e, b.t])) === JSON.stringify(ru.blanks.map(b => [b.s, b.e, b.t]))) delete S.ov[key];
}
const PARTICLE_RE = /^(.{2,}?)(으로서|으로|에서|에게|까지|부터|이나|이란|이며|이고|을|를|은|는|이|가|의|에|로|와|과)$/;
/* 단어 조각에서 앞뒤 구두점·끝 조사를 뺀 핵심 범위 [시작, 끝) */
function trimTok(seg) {
  let ls = 0, le = seg.length;
  const m1 = seg.match(/^[(\[「“"'<‘]+/); if (m1) ls = m1[0].length;
  const m2 = seg.slice(ls).match(/[)\]」”"'>’,.:;、。]+$/); if (m2) le -= m2[0].length;
  const pm = seg.slice(ls, le).match(PARTICLE_RE);
  if (pm) le = ls + pm[1].length;
  return [ls, le];
}
function curText(key) { const ru = rawUnit(key); return eff(key, ru.text, ru.blanks).text; }
function editRemove(el) {
  const key = el.dataset.key, s = +el.dataset.bs, e = +el.dataset.be;
  HIST = { key, prev: cloneOv(key) };
  const o = ovFor(key);
  o.blanks = o.blanks.filter(b => !(b.s === s && b.e === e));
  tidyOv(key); save(); render();
  toast('빈칸을 해제했어요', [['되돌리기', 'undo']]);
}
function editAdd(el) {
  const key = el.dataset.key, s = +el.dataset.s, e = +el.dataset.e, T = curText(key);
  const [ls, le] = trimTok(T.slice(s, e));
  const s2 = s + ls, e2 = s + le;
  if (e2 <= s2) return;
  HIST = { key, prev: cloneOv(key) };
  const o = ovFor(key);
  if (o.blanks.some(b => !(e2 <= b.s || s2 >= b.e))) return;
  o.blanks.push({ s: s2, e: e2, t: 'user' });
  o.blanks.sort((a, b) => a.s - b.s);
  LASTADD = { key, s: s2, e: e2 };
  save(); render();
  toast('빈칸을 추가했어요', [['되돌리기', 'undo'], ['다음 단어까지', 'extend']]);
}
function extendLast() {
  if (!LASTADD) return;
  const { key, s, e } = LASTADD, T = curText(key), o = ovFor(key);

  if (!obj || obj.app !== 'jeokjeuk-law-note' || !obj.data || typeof obj.data !== 'object') { toast('지적 법령 노트 백업 파일이 아니에요'); return; }
  window.__imp = obj;
  const n = Object.keys(obj.data.rec || {}).length;
  openSheet(`<h3>백업 불러오기</h3><div class="muted" style="line-height:1.7;margin-bottom:14px">현재 기기의 기록이 이 백업으로 <b style="color:var(--tx)">덮어써져요.</b><br>백업 시각 ${esc((obj.exportedAt || '').slice(0, 16).replace('T', ' '))} · 빈칸 기록 ${n}개 · 기출 ${(obj.data.exams || []).length}개</div><div class="acts"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="doimport">덮어쓰기</button></div>`);
}
function doImport() {
  const o = window.__imp; if (!o) return;
  S = Object.assign(defState(), o.data);
  S.settings = Object.assign(defState().settings, S.settings || {});
  S.settings.types = Object.assign({}, DEF_TYPES, S.settings.types || {});
  initTopics(); saveNow(); applyTheme(); applyName(); closeSheet(); location.hash = '#/'; render(); toast('백업을 불러왔어요');
}

/* ----- 클릭 위임 ----- */
document.addEventListener('click', e => {
  const t = e.target;
  if (Date.now() < SUPPRESS && t.closest && t.closest('.law')) { e.preventDefault(); return; }   // 끌기 직후 본문에 생기는 클릭만 무시

  const bk = t.closest('.bk[data-bid]');

document.addEventListener('input', e => {

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closePop(); } });
window.addEventListener('scroll', () => { $('#top').classList.toggle('scrolled', window.scrollY > 4); if ($('#pop-root').firstChild) closePop(); }, { passive: true });

/* ----- 편집 모드: 길게 누른 채 끌어서 빈칸 범위 지정 ----- */
let DRAG = null, SUPPRESS = 0, LASTTOUCH = 0;
const selTarget = el => el && el.closest && el.closest('.law.edit .tk[data-key], .law.edit .bk[data-key]');
const rngOf = el => el.classList.contains('tk') ? { key: el.dataset.key, s: +el.dataset.s, e: +el.dataset.e } : { key: el.dataset.key, s: +el.dataset.bs, e: +el.dataset.be };
function dragPaint() {
  const s = Math.min(DRAG.a.s, DRAG.b.s), e = Math.max(DRAG.a.e, DRAG.b.e);
  DRAG.range = { s, e };
  $$('.law.edit .tk[data-key], .law.edit .bk[data-key]').forEach(el => {
    if (el.dataset.key !== DRAG.key) { el.classList.remove('sel'); return; }
    const r = rngOf(el); el.classList.toggle('sel', r.s >= s && r.e <= e);
  });
}
function dragActivate() {
  if (!DRAG) return;
  DRAG.active = true; document.body.classList.add('selecting'); dragPaint();
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (x) { /* 무시 */ }
}
function dragMove(x, y) {
  let el = selTarget(document.elementFromPoint(x, y));
  if (!el || el.dataset.key !== DRAG.key) {        // 손가락이 줄에서 조금 벗어나도 가장 가까운 단어로 보정
    let best = null, bd = 56 * 56;
    $$('.law.edit .tk[data-key], .law.edit .bk[data-key]').forEach(c => {
      if (c.dataset.key !== DRAG.key) return;
      const rs = c.getClientRects();
      for (let i = 0; i < rs.length; i++) {
        const q = rs[i], dx = Math.max(q.left - x, 0, x - q.right), dy = Math.max(q.top - y, 0, y - q.bottom), dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = c; }
      }
    });
    el = best;
  }
  if (!el) return;
  DRAG.b = rngOf(el); dragPaint();
}
function dragCommit() {
  const key = DRAG.key, T = curText(key);
  let a = DRAG.range.s, b = DRAG.range.e;
  while (a < b && /[\s(\[「“"'<‘]/.test(T[a])) a++;
  while (b > a && /[\s)\]」”"'>’,.:;、。]/.test(T[b - 1])) b--;
  if (b <= a) return;
  if (ETOOL === 'bold') { applyBold(key, a, b); return; }
  HIST = { key, prev: cloneOv(key) };
  const o = ovFor(key);
  o.blanks.forEach(x => { if (!(x.e <= a || x.s >= b)) { a = Math.min(a, x.s); b = Math.max(b, x.e); } });
  o.blanks = o.blanks.filter(x => x.e <= a || x.s >= b);
  o.blanks.push({ s: a, e: b, t: 'user' });
  o.blanks.sort((p, q) => p.s - q.s);
  LASTADD = { key, s: a, e: b };
  save(); render();
  toast('범위를 빈칸으로 지정했어요', [['되돌리기', 'undo'], ['다음 단어까지', 'extend']]);
}
function dragEnd() {
  if (!DRAG) return;
  clearTimeout(DRAG.timer);
  const d = DRAG; DRAG = null;
  document.body.classList.remove('selecting');
  if (d.active) { SUPPRESS = Date.now() + 600; DRAG = d; try { dragCommit(); } finally { DRAG = null; } }
  $$('.sel').forEach(x => x.classList.remove('sel'));
}
document.addEventListener('touchstart', e => {
  LASTTOUCH = Date.now();
  const t = e.touches && e.touches[0]; if (!t) return;
  const el = selTarget(e.target);
  if (el && EDIT) { const r = rngOf(el); DRAG = { key: r.key, a: r, b: r, x: t.clientX, y: t.clientY, active: false, timer: setTimeout(dragActivate, 320) }; }
  SW = swipeStart(e, t);
}, { passive: true });
document.addEventListener('touchmove', e => {
  const t = e.touches && e.touches[0]; if (!t) return;
  if (DRAG) {
    if (DRAG.active) { e.preventDefault(); dragMove(t.clientX, t.clientY); }
    else if (Math.abs(t.clientX - DRAG.x) > 10 || Math.abs(t.clientY - DRAG.y) > 10) { clearTimeout(DRAG.timer); DRAG = null; }
  }
}, { passive: false });
document.addEventListener('touchend', e => {
  if (DRAG) dragEnd();
  else if (SW) swipeEnd(e);
  SW = null;
}, { passive: true });
document.addEventListener('touchcancel', () => { if (DRAG) { clearTimeout(DRAG.timer); DRAG = null; document.body.classList.remove('selecting'); } SW = null; }, { passive: true });
/* 마우스(데스크톱): 단어에서 눌러 다른 단어까지 끌기 */
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || Date.now() - LASTTOUCH < 800 || !EDIT) return;
  const el = selTarget(e.target); if (!el) return;
  const r = rngOf(el);
  DRAG = { key: r.key, a: r, b: r, x: e.clientX, y: e.clientY, active: false, timer: null };
});
document.addEventListener('mousemove', e => {
  if (!DRAG || DRAG.timer !== null && DRAG.kind === 'touch') return;
  if (!DRAG.active) {
    if (Math.abs(e.clientX - DRAG.x) + Math.abs(e.clientY - DRAG.y) < 6) return;
    const el = selTarget(document.elementFromPoint(e.clientX, e.clientY));
    if (!el || (el.dataset.key === DRAG.key && rngOf(el).s === DRAG.a.s && rngOf(el).e === DRAG.a.e)) return;
    dragActivate();
  }
  dragMove(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => { if (DRAG && Date.now() - LASTTOUCH >= 800) dragEnd(); else if (DRAG && !DRAG.active && DRAG.timer === null) DRAG = null; });

/* ----- 좌우 스와이프로 이전·다음 조문(카드는 이전·다음 카드) ----- */
let SW = null;
function swipeStart(e, t) {
  const r = parseRoute();
  if (EDIT || $('#sheet-root').firstChild || !(r[0] === 'read' || r[0] === 'review')) return null;
  if (e.target.closest && e.target.closest('.tblw, .toc, .tbchips, input, textarea, select, .pop, .toast')) return null;
  if (t.clientX < 24 || t.clientX > innerWidth - 24) return null;   // iOS 가장자리 뒤로가기 제스처와 충돌 방지
  return { x: t.clientX, y: t.clientY, t: Date.now() };
}
function swipeEnd(e) {
  const t = e.changedTouches && e.changedTouches[0]; if (!t || !SW) return;
  const dx = t.clientX - SW.x, dy = t.clientY - SW.y;
  if (Date.now() - SW.t > 800 || Math.abs(dx) < 70 || Math.abs(dy) > 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
  stepBy(dx < 0 ? 1 : -1);
}
function stepBy(dir) {
  const r = parseRoute();
  if (r[0] === 'review') { if (RV && RV.i < RV.q.length && dir > 0) { RV.i++; closePop(); render(); window.scrollTo(0, 0); } return; }
  if (r[0] !== 'read' || !ARTS[r[1]]) return;
  if (S.settings.mode === 'card') {
    const gs = groupsOf(r[1]).filter(g => groupBlanks(r[1], g, isActive).length > 0);
    if (dir > 0 && CARD.i < gs.length) { CARD.i++; closePop(); render(); window.scrollTo(0, 0); return; }
    if (dir < 0 && CARD.i > 0) { CARD.i--; closePop(); render(); window.scrollTo(0, 0); return; }
  }
  const A = ARTS[r[1]], ct = r[2] || 'law', cid = r[3] || A.lid, list = ctxList(ct, cid), nx = list[list.indexOf(r[1]) + dir];
  if (!nx) { toast(dir > 0 ? '마지막 조문이에요' : '첫 조문이에요'); return; }
  SLIDE = dir > 0 ? 'next' : 'prev';
  location.hash = readHref(nx, ct, cid);
}
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if ($('#sheet-root').firstChild) return;
  if (e.key === 'ArrowRight') stepBy(1);
  if (e.key === 'ArrowLeft') stepBy(-1);
});

function cardIds() {
  const r = parseRoute(), aid = r[1];
  const gs = groupsOf(aid).filter(g => groupBlanks(aid, g, isActive).length > 0), g = gs[CARD.i];
  return g ? groupBlanks(aid, g, isActive).map(b => b.bid) : [];
}
function act(name, a, e) {
  const d = a.dataset;
  switch (name) {
    case 'go': closeSheet(); if (location.hash === d.to) render(); else location.hash = d.to; break;
    case 'close': closeSheet(); break;
    case 'closerender': closeSheet(); render(); break;
    case 'theme': S.settings.theme = nextTheme(S.settings.theme)[0]; applyTheme(); save(); render(); toast(`${themeInfo(S.settings.theme)[1]} 테마`); break;
    case 'settings': openSettings(); break;
    case 'settheme': S.settings.theme = d.v; applyTheme(); save(); openSettings(); render(); break;
    case 'setfont': S.settings.font = +d.v; applyTheme(); save(); openSettings(); break;
    case 'setname': { S.settings.appName = ($('#nm-in').value || '').trim().slice(0, 20); applyName(); save(); render(); openSettings(); toast('앱 이름을 바꿨어요'); break; }
    case 'resetname': S.settings.appName = ''; applyName(); save(); render(); openSettings(); toast('기본 이름으로 되돌렸어요'); break;
    case 'rvlaw': RVLAW = d.l; render(); break;
    case 'setbold': S.settings.bold = S.settings.bold === false; save(); openSettings(); render(); break;
    case 'settype': S.settings.types[d.t] = !S.settings.types[d.t]; save(); openSettings(); render(); break;
    case 'type': S.settings.types[d.t] = !S.settings.types[d.t]; save(); render(); break;
    case 'mode': S.settings.mode = d.m; EDIT = false; save(); render(); break;
    case 'revall': $$('.bk[data-bid]').forEach(x => REV.add(x.dataset.bid)); refreshBlankEls(); break;
    case 'hideall': REV.clear(); closePop(); refreshBlankEls(); break;
    case 'edit': EDIT = !EDIT; if (!EDIT) ETOOL = 'blank'; closePop(); render(); break;
    case 'etool': ETOOL = d.t === 'bold' ? 'bold' : 'blank'; closePop(); render(); break;
    case 'lsort': LSORT = d.s; render(); break;
    case 'ptype': S.settings.ptype = d.g; save(); render(); break;
    case 'tedit': TEDIT = !TEDIT; render(); break;
    case 'toc': { const r = parseRoute(), A = ARTS[r[1]]; if (!A) break; const ct = r[2] || 'law', cid = r[3] || A.lid; openSheet(`<div class="toc flat" style="display:block;position:static;max-height:none;overflow:visible">${tocPanel(ctxList(ct, cid), r[1], ct, cid)}</div>`); break; }
    case 'patchinfo': openPop(a, `<div class="msg">${d.kind === 'img' ? esc(d.src || '이미지를 보고 글자로 옮긴 표예요.') : d.kind === 'fixed' ? '법제처 공식 원문의 수식·이미지를 직접 대조해 보정한 줄이에요.' + (d.src ? `<br><span class="dim">근거: ${esc(d.src)}</span>` : '') : '법제처 공식 본문과 대조해 확인한 줄이에요.'}</div>`, e); break;
    case 'warninfo': openPop(a, '<div class="msg">원문에서 수식·숫자가 빠졌을 수 있어요. 법제처 원문을 확인하고 편집 모드의 “원문 수정”으로 고쳐 주세요.</div>', e); break;
    case 'pj': {
      closePop();
      if (d.v === 'h') REV.delete(d.id); else judge(d.id, d.v === 'c');
      if (needsRerender()) render(); else refreshBlankEls();
      break;
    }
    /* 카드 모드 */
    case 'creveal': cardIds().forEach(i => REV.add(i)); closePop(); render(); break;
    case 'cok': cardIds().forEach(i => { if (!SJ[i]) judge(i, true); }); CARD.i++; closePop(); render(); window.scrollTo(0, 0); break;
    case 'cnext': CARD.i++; closePop(); render(); window.scrollTo(0, 0); break;
    case 'cprev': CARD.i = Math.max(0, CARD.i - 1); closePop(); render(); window.scrollTo(0, 0); break;
    case 'cardjump': CARD.i = +d.i; render(); window.scrollTo(0, 0); break;
    /* 복습 */
    case 'rvreveal': RV.q[RV.i].targets.forEach(i => REV.add(i)); closePop(); render(); break;
    case 'rvok': RV.q[RV.i].targets.forEach(i => { if (!SJ[i]) judge(i, true); }); RV.i++; closePop(); render(); window.scrollTo(0, 0); break;
    case 'rvskip': RV.i++; closePop(); render(); window.scrollTo(0, 0); break;
    case 'rvagain': RV = null; render(); break;
    /* 편집 */
    case 'ltxt': openTextEdit(d.key); break;
    case 'ltxtsave': saveTextEdit(d.key); break;
    case 'lreset': HIST = { key: d.key, prev: cloneOv(d.key) }; delete S.ov[d.key]; save(); render(); toast('이 줄을 원래대로 되돌렸어요', [['되돌리기', 'undo']]); break;
    case 'undo': undoEdit(); break;
    case 'resetscope': { const r = parseRoute(); if (r[0] === 'read' && ARTS[r[1]]) openReset(resetScopes(r[1], r[2], r[3])); break; }
    case 'resettopic': { const f = findTopic(d.tid); if (!f) break; const ids = f.t.arts.filter(x => ARTS[x]); openReset([{ label: f.t.name, sub: `이 주제 · 조문 ${ids.length}개`, ids, n: recKeysOf(ids).length }]); break; }
    case 'resetpick': confirmReset(+d.i); break;
    case 'resetback': if (RESET) openReset(RESET.scopes); break;
    case 'resetdo': doReset(); break;
    case 'resetundo': undoReset(); break;
    case 'extend': extendLast(); break;
    /* 주제 */
    case 'tadd': askText('새 주제 이름', '', v => { if (!v) return; newTopic(d.sid, v); render(); }); break;
    case 'trename': { const f = findTopic(d.tid); askText('주제 이름 변경', f.t.name, v => { if (!v) return; f.t.name = v; save(); render(); }); break; }
    case 'tdel': { const f = findTopic(d.tid); if (f && confirm(`“${f.t.name}” 주제를 삭제할까요? (조문은 삭제되지 않아요)`)) { S.topics[f.sid] = S.topics[f.sid].filter(x => x.id !== d.tid); save(); render(); } break; }
    case 'tassign': openTopicAssign(d.tid); break;
    case 'arttopics': openArtTopics(d.aid); break;
    case 'tnewfor': { const aid = d.aid; askText('새 주제 이름', '', v => { if (!v) return; newTopic(sidOfLaw(ARTS[aid].lid), v, aid); closeSheet(); render(); toast('주제를 만들고 이 조문을 담았어요'); }); break; }
    case 'tchk': {
      const f = findTopic(d.tid); if (!f) break;
      const i = f.t.arts.indexOf(d.aid);
      if (i >= 0) f.t.arts.splice(i, 1); else f.t.arts.push(d.aid);
      a.classList.toggle('on', i < 0); save(); break;
    }
    case 'askok': { const v = ($('#ask-in').value || '').trim(), fn = window.__askOk; closeSheet(); if (fn) fn(v); break; }
    /* 기출 */
    case 'exadd': openExamForm(null); break;
    case 'exadd2': openExamForm(null, d.aid); break;
    case 'exedit': openExamForm(d.id); break;
    case 'exdel': if (confirm('이 기출을 삭제할까요?')) { S.exams = S.exams.filter(x => x.id !== d.id); save(); render(); } break;
    case 'exsave': saveExam(); break;
    case 'exkind': EX.kind = d.k; render(); break;
    case 'exart': EX.art = null; render(); break;
    case 'exfilter': EX.art = d.aid; EX.kind = '전체'; closeSheet(); location.hash = '#/subject/' + sidOfLaw(ARTS[d.aid].lid) + '/exams'; break;
    case 'artexams': openArtExams(d.aid); break;
    case 'xchk': { if (!SHEET) break; const on = !SHEET.sel.has(d.id); on ? SHEET.sel.add(d.id) : SHEET.sel.delete(d.id); a.classList.toggle('on', on); const n = $('#x-n'); if (n) n.textContent = SHEET.sel.size + '개 선택'; break; }
    case 'ximp': if (SHEET) { SHEET.imp = +d.v; $$('#x-imp button').forEach(b => b.classList.toggle('on', +b.dataset.v === SHEET.imp)); } break;
    /* 백업 */
    case 'export': exportData(); break;
    case 'exporttext': exportText(); break;
    case 'import': $('#file').click(); break;
    case 'importtext': openSheet('<h3>붙여넣어 복원</h3><div class="f"><textarea id="imp-in" placeholder="내보낸 백업 텍스트를 붙여넣으세요" style="min-height:160px"></textarea></div><div class="acts"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="importgo">확인</button></div>'); break;
    case 'importgo': askImport($('#imp-in').value); break;
    case 'doimport': doImport(); break;
    case 'resetall': if (confirm('학습 기록·편집 내용·기출을 모두 지울까요? 되돌릴 수 없어요.')) { S = defState(); initTopics(); saveNow(); applyTheme(); applyName(); closeSheet(); location.hash = '#/'; render(); toast('초기화했어요'); } break;
  }
}
$('#file').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => askImport(String(r.result)); r.readAsText(f); ev.target.value = '';
});

/* ----- 시작 ----- */
load();
applyTheme();
applyName();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* 지원하지 않는 환경 */ }
/* 오프라인 저장: 호스팅한 주소(https)에서만 서비스 워커를 등록한다. 파일로 직접 연 경우엔 건너뜀 */
let SWSTATE = window.__SW__ ? 'pending' : 'none';
if (window.__SW__ && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const done = () => { SWSTATE = 'ready'; };
    if (reg.active) done();
    else { const w = reg.installing || reg.waiting; if (w) w.addEventListener('statechange', () => { if (w.state === 'activated') done(); }); }
  }).catch(() => { SWSTATE = 'fail'; });
} else if (window.__SW__) SWSTATE = 'none';
render();

})();
