<title>지적 법령 노트</title>

<style>
:root{--fs:17px;--r:14px;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=dark]{--bg:#1b1c1f;--s1:#232428;--s2:#2b2c31;--s3:#3d3e45;--bd:#34353b;--tx:#e9e9ec;--tx2:#a4a5ad;--tx3:#8e8f97;--bkbg:#65666c;--bkline:#8d8e95;--law:#d2d2d7;--ac:#93abc6;--acbg:rgba(147,171,198,.16);--tocbg:#1f2229;--tocbd:#2d323b;--good:#93b5a0;--bad:#cb9393;--inv:#ececee;--invtx:#1b1c1f;--sh:0 10px 34px rgba(0,0,0,.4);--ov:rgba(8,8,10,.55)}
[data-theme=light]{--bg:#f4f4f2;--s1:#ffffff;--s2:#ecece9;--s3:#e3e3df;--bd:#dcdcd7;--tx:#1d1e21;--tx2:#5f6067;--tx3:#73747b;--bkbg:#9fa0a6;--bkline:#7d7e84;--law:#383940;--ac:#56697f;--acbg:rgba(86,105,127,.13);--tocbg:#e9ebee;--tocbd:#d4d8de;--good:#5f8a70;--bad:#b06a6a;--inv:#1d1e21;--invtx:#f4f4f2;--sh:0 10px 34px rgba(0,0,0,.14);--ov:rgba(20,20,24,.35)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}
svg{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
#rail{display:none}
#main{min-width:0;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid transparent}
#top.scrolled{border-bottom-color:var(--bd)}
#top .ttl{flex:1;min-width:0;font-weight:650;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl small{display:block;font-weight:500;font-size:12px;color:var(--tx3);margin-bottom:1px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2)}
.ib:active,.ib.on{background:var(--s2);color:var(--tx)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--s1);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;color:var(--tx3);border-radius:12px}
#tabs button.on{color:var(--tx)}
#tabs svg{width:23px;height:23px}
#rail .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:700;font-size:16px;letter-spacing:-.02em}
#rail .brand i{width:30px;height:30px;border-radius:9px;border:1.6px solid var(--tx);display:grid;place-items:center}
#rail .brand svg{width:17px;height:17px}
#rail button.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--tx2);font-size:15px;width:100%;text-align:left}
#rail button.nv.on{background:var(--s2);color:var(--tx);font-weight:600}
#rail .sp{flex:1}
@media(min-width:900px){
  #app{grid-template-columns:208px minmax(0,1fr)}
  #rail{display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;padding:calc(18px + env(safe-area-inset-top)) 14px 18px;border-right:1px solid var(--bd);background:var(--bg)}
  #tabs{display:none}
  #main{padding-bottom:48px}
  #top{padding-left:24px;padding-right:24px}
}
.wrap{max-width:860px;margin:0 auto;padding:6px 16px 28px}
@media(min-width:900px){.wrap{padding:10px 24px 36px}}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:13px;font-weight:650;color:var(--tx3);text-transform:none;letter-spacing:.02em}
.sec a,.sec button.lk{font-size:13px;color:var(--tx2)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card.tap:active{background:var(--s2)}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid2.stack{grid-template-columns:1fr}}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.small{font-size:13.5px}.xs{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:12px;background:var(--s2);color:var(--tx);font-weight:600;font-size:15px;border:1px solid var(--bd)}
.btn:active{filter:brightness(.92)}
.btn.pri{background:var(--inv);color:var(--invtx);border-color:var(--inv)}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--bd);color:var(--tx2);font-size:13.5px;background:transparent;white-space:nowrap}
.chip.on{background:var(--inv);color:var(--invtx);border-color:var(--inv);font-weight:600}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--s2);border-radius:11px;padding:3px;border:1px solid var(--bd)}
.seg button{height:32px;padding:0 14px;border-radius:8px;font-size:13.5px;color:var(--tx2);font-weight:550}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bar{height:6px;border-radius:5px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tx);border-radius:5px;opacity:.85}
.bar.acc i{background:var(--good)}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--bd);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--s2)}
.row .no{flex:none;min-width:58px;font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums}
.row .tt{flex:1;min-width:0;font-size:15.5px;line-height:1.35}
.row .meta{flex:none;display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:12px}
.row .mini{width:46px}
.list{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:0 14px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--s2);color:var(--tx2);font-size:12px;font-weight:600;border:1px solid var(--bd)}
.badge.hot{color:var(--tx);background:var(--s3)}
.badge.bad{color:var(--bad)}.badge.good{color:var(--good)}
.empty{padding:38px 12px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.7}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv .card{padding:14px}
.kv b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv span{font-size:13px;color:var(--tx3)}
.hero{padding:18px;display:flex;flex-direction:column;gap:12px}
.hero h3{font-size:19px;line-height:1.3}
.sbj{display:flex;flex-direction:column;gap:12px;min-height:140px;justify-content:space-between}
.sbj h3{font-size:19px}
.sbj.soon{opacity:.55}
.logo{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.logo h1{font-size:26px;font-weight:750}
.logo p{margin:2px 0 0;color:var(--tx3);font-size:13px}

/* 학습 화면 */
.read{display:grid;grid-template-columns:minmax(0,1fr);margin:0 auto;max-width:860px;padding:0 16px 24px}
.toc{display:none}
@media(min-width:1100px){
  .read.has-toc{grid-template-columns:264px minmax(0,1fr);gap:26px;max-width:none;margin:0;padding:0 24px 30px 20px}
  .read.has-toc>div:last-child{width:100%;max-width:860px;margin:0 auto}
  .toc{display:block;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;align-self:start}
  .ib.tocbtn{display:none}
}
.toc{background:var(--tocbg);border:1px solid var(--tocbd);border-radius:16px;padding:0 8px 8px}
.toc-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:14px 8px 10px;margin:0 -8px 4px;background:var(--tocbg);border-radius:16px 16px 0 0;border-bottom:1px solid var(--tocbd)}
.toc-h i{width:4px;height:16px;border-radius:2px;background:var(--ac);flex:none}
.toc-h b{font-size:14px;letter-spacing:.06em;color:var(--ac);font-weight:760}
.toc-h span{margin-left:auto;font-size:11.5px;color:var(--tx3);max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

[data-theme=color]{color-scheme:light;--bg:#f6f1ff;--s1:#ffffff;--s2:#efe8ff;--s3:#e2d8fb;--bd:#e3daf7;--tx:#2b2455;--tx2:#5a5384;--tx3:#6f6896;--bkbg:#cfc3f5;--bkline:#9a85ee;--law:#2d2757;--ac:#7c5cff;--acbg:rgba(124,92,255,.14);--tocbg:#efe9ff;--tocbd:#ddd2fa;--good:#13a679;--bad:#e5416b;--inv:#6a4bff;--invtx:#ffffff;--sh:0 12px 34px rgba(106,75,255,.22);--ov:rgba(43,36,85,.42)}

 중","laws":[],"topics":[],"soon":true}],"laws":{"jcsl":{"id":"jcsl","name":"지적측량 시행규칙","kind":"국토교통부령","effective":"2025-03-27","promulgated":"2024-12-26","url":"https://www.law.go.kr/법령/지적측량시행규칙","rule":false,"articles":[{"id":"jcsl-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규칙은「공간정보의 구축 및 관리 등에 관한 법률」 및 같은 법 시행령에서 위임된 사항과 그 시행에 필요한 사항을 정함을 목적으로 한다.","blanks":[]}]},{"id":"jcsl-2","no":"제2조","title":"정의","lines":[{"lvl":0,"label":"","text":"이 규칙에서 사용하는 용어의 뜻은 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"기지점(旣知點)\"이란 다음 각 목의 구분에 따른 측량기준점 및 경계점을 말한다.","blanks":[{"s":1,"e":9,"t":"term"}]},{"lvl":2,"label":"가.","text":"「공간정보의 구축 및 관리 등에 관한 법률 시행령」(이하 \"영\"이라 한다) 제8조제1항제3호에 따른 지적기준점을 정하기 위한 기초측량(이하 \"기초측량\"이라 한다): 「공간정보의 구축 및 관리 등에 관한 법률」(이하 \"법\"이라 한다) 제7조제1항제1호에 따른 국가기준점 또는 같은 항 제3호에 따른 지적기준점(이하 \"지적기준점\"이라 한다)","blanks":[{"s":56,"e":61,"t":"term"},{"s":144,"e":149,"t":"term"}]},{"lvl":2,"label":"나.","text":"제5조제1항에 따른 세부측량: 지적기준점 또는 지적도ㆍ임야도상 필지를 구획하는 경계점과 상호 부합되는 지상의 경계점","blanks":[{"s":17,"e":22,"t":"term"}]},{"lvl":1,"label":"2.","text":"\"망평균계산법\"이란 지적삼각망을 활용하여 구하려는 지적삼각점 위치를 구하는 계산방법을 말한다.","blanks":[{"s":1,"e":7,"t":"term"},{"s":28,"e":33,"t":"term"}]},{"lvl":1,"label":"3.","text":"\"배각법(倍角法)\"이란 하나의 각을 2회 이상 반복 관측하여 누적된 값을 평균하는 관측방법을 말한다.","blanks":[{"s":1,"e":9,"t":"term"},{"s":20,"e":22,"t":"num"}]},{"lvl":1,"label":"4.","text":"\"방위각법(方位角法)\"이란 자오선의 북을 기준으로 시계방향으로 각 측선까지 이루는 각을 직접 관측하는 방법을 말한다.","blanks":[{"s":1,"e":11,"t":"term"}]},{"lvl":1,"label":"5.","text":"\"도선법(道線法)\"이란 기지점에서 출발하여 각 변의 방향과 거리를 순차적으로 관측하고 기지점에 도착하도록 하여 측점의 위치를 결정하는 방법을 말한다.","blanks":[{"s":1,"e":9,"t":"term"}]},{"lvl":1,"label":"6.","text":"\"다각망도선법(多角網道線法)\"이란 여러 개의 도선을 결합한 형태로 구성하여 각 도선에서 발생한 오차를 상호 관련이 있는 도선과의 관계를 종합하여 오차를 소거시키는 방법을 말한다.","blanks":[{"s":1,"e":15,"t":"term"}]},{"lvl":1,"label":"7.","text":"\"교회법(交會法)\"이란 기지점 또는 미지점(未知點)에서 방향선의 교차로 점의 위치를 결정하는 방법을 말한다.","blanks":[{"s":1,"e":9,"t":"term"},{"s":20,"e":28,"t":"term"}]},{"lvl":1,"label":"8.","text":"\"방사법(放射法)\"이란 측정하려는 점이 모두 보이는 점 또는 기지점에 측판을 설치하고 여러 점의 거리와 각을 측정하여 측정하려는 점의 위치를 결정하는 방법을 말한다.","blanks":[{"s":1,"e":9,"t":"term"}]},{"lvl":1,"label":"9.","text":"\"연직각(鉛直角)\"이란 시준선(視準線)이 수평선과 이루는 각을 말한다.","blanks":[{"s":1,"e":9,"t":"term"},{"s":13,"e":21,"t":"term"}]}]},{"id":"jcsl-2-2","no":"제2조의2","title":"지적기준점표지의 설치ㆍ관리 등","lines":[{"lvl":0,"label":"①","text":"법 제8조제1항에 따른 지적기준점표지의 설치는 다음 각 호의 기준에 따른다.","blanks":[{"s":13,"e":18,"t":"term"}]},{"lvl":1,"label":"1.","text":"지적삼각점표지의 점간거리는 평균 2킬로미터 이상 5킬로미터 이하로 할 것","blanks":[{"s":0,"e":5,"t":"term"},{"s":18,"e":23,"t":"num"},{"s":27,"e":32,"t":"num"}]},{"lvl":1,"label":"2.","text":"지적삼각보조점표지의 점간거리는 평균 1킬로미터 이상 3킬로미터 이하로 할 것. 다만, 다각망도선법에 따르는 경우에는 평균 0.5킬로미터 이상 1킬로미터 이하로 한다.","blanks":[{"s":0,"e":7,"t":"term"},{"s":20,"e":25,"t":"num"},{"s":29,"e":34,"t":"num"},{"s":48,"e":54,"t":"term"},{"s":68,"e":75,"t":"num"},{"s":79,"e":84,"t":"num"}]},{"lvl":1,"label":"3.","text":"지적도근점표지의 점간거리는 평균 50미터 이상 500미터 이하로 할 것","blanks":[{"s":0,"e":5,"t":"term"},{"s":18,"e":22,"t":"num"},{"s":26,"e":31,"t":"num"}]},{"lvl":0,"label":"②","text":"지적소관청은 연 1회 이상 지적기준점표지의 이상 유무를 조사하여야 한다. 이 경우 멸실되거나 훼손된 지적기준점표지를 계속 보존할 필요가 없을 때에는 폐기할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":9,"e":11,"t":"num"},{"s":15,"e":20,"t":"term"},{"s":56,"e":61,"t":"term"}]},{"lvl":0,"label":"③","text":"지적소관청이 관리하는 지적기준점표지가 멸실되거나 훼손되었을 때에는 지적소관청은 다시 설치하거나 보수하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":12,"e":17,"t":"term"},{"s":37,"e":42,"t":"org"}]}]},{"id":"jcsl-3","no":"제3조","title":"지적기준점성과의 관리 등","lines":[{"lvl":0,"label":"","text":"법 제27조제1항에 따른 지적기준점성과의 관리는 다음 각 호에 따른다.","blanks":[{"s":14,"e":19,"t":"term"}]},{"lvl":1,"label":"1.","text":"지적삼각점성과는 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사 또는 특별자치도지사(이하 \"시ㆍ도지사\"라 한다)가 관리하고, 지적삼각보조점성과 및 지적도근점성과는 지적소관청이 관리할 것","blanks":[{"s":0,"e":5,"t":"term"},{"s":9,"e":40,"t":"org"},{"s":64,"e":71,"t":"term"},{"s":76,"e":81,"t":"term"},{"s":85,"e":90,"t":"org"}]},{"lvl":1,"label":"2.","text":"지적소관청이 지적삼각점을 설치하거나 변경하였을 때에는 그 측량성과를 시ㆍ도지사에게 통보할 것","blanks":[{"s":0,"e":5,"t":"org"},{"s":7,"e":12,"t":"term"},{"s":38,"e":43,"t":"org"}]},{"lvl":1,"label":"3.","text":"지적소관청은 지형ㆍ지물 등의 변동으로 인하여 지적삼각점성과가 다르게 된 때에는 지체 없이 그 측량성과를 수정하고 그 내용을 시ㆍ도지사에게 통보할 것","blanks":[{"s":0,"e":5,"t":"org"},{"s":25,"e":30,"t":"term"},{"s":69,"e":74,"t":"org"}]}]},{"id":"jcsl-4","no":"제4조","title":"지적기준점성과표의 기록ㆍ관리 등","lines":[{"lvl":0,"label":"①","text":"제3조에 따라 시ㆍ도지사가 지적삼각점성과를 관리할 때에는 다음 각 호의 사항을 지적삼각점성과표에 기록ㆍ관리하여야 한다.","blanks":[{"s":8,"e":13,"t":"org"},{"s":15,"e":20,"t":"term"},{"s":44,"e":52,"t":"term"}]},{"lvl":1,"label":"1.","text":"지적삼각점의 명칭과 기준 원점명","blanks":[{"s":0,"e":17,"t":"item"}]},{"lvl":1,"label":"2.","text":"좌표 및 표고","blanks":[{"s":0,"e":7,"t":"item"}]},{"lvl":1,"label":"3.","text":"경도 및 위도(필요한 경우로 한정한다)","blanks":[{"s":0,"e":7,"t":"item"}]},{"lvl":1,"label":"4.","text":"자오선수차(子午線收差)","blanks":[{"s":0,"e":5,"t":"item"}]},{"lvl":1,"label":"5.","text":"시준점(視準點)의 명칭, 방위각 및 거리","blanks":[{"s":0,"e":12,"t":"item"},{"s":14,"e":22,"t":"item"}]},{"lvl":1,"label":"6.","text":"소재지와 측량연월일","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"7.","text":"그 밖의 참고사항","blanks":[]},{"lvl":0,"label":"②","text":"제3조에 따라 지적소관청이 지적삼각보조점성과 및 지적도근점성과를 관리할 때에는 다음 각 호의 사항을 지적삼각보조점성과표 및 지적도근점성과표에 기록ㆍ관리하여야 한다.","blanks":[{"s":8,"e":13,"t":"org"},{"s":15,"e":22,"t":"term"},{"s":27,"e":32,"t":"term"},{"s":56,"e":66,"t":"term"},{"s":69,"e":77,"t":"term"}]},{"lvl":1,"label":"1.","text":"지적삼각보조점 또는 지적도근점의 번호","blanks":[{"s":0,"e":20,"t":"item"}]},{"lvl":1,"label":"1의2.","text":"근경사진 및 위치의 약도(위치의 약도는 원경사진ㆍ항공사진으로 대체할 수 있다)","blanks":[{"s":0,"e":13,"t":"item"}]},{"lvl":1,"label":"2.","text":"좌표와 직각좌표계 원점명","blanks":[{"s":0,"e":13,"t":"item"}]},{"lvl":1,"label":"3.","text":"경도와 위도(필요한 경우로 한정한다)","blanks":[{"s":0,"e":6,"t":"item"}]},{"lvl":1,"label":"4.","text":"표고(필요한 경우로 한정한다)","blanks":[{"s":0,"e":2,"t":"item"}]},{"lvl":1,"label":"5.","text":"소재지와 설치 및 재설치연월일","blanks":[{"s":0,"e":16,"t":"item"}]},{"lvl":1,"label":"6.","text":"도선등급 및 ,"blanks":[{"s":21,"e":62,"t":"term","n":6},{"s":98,"e":139,"t":"term","n":6}]},{"lvl":1,"label":"1.","text":"측량대상토지가 지적도를 갖춰 두는 지역에 인접하여 있고 지적도의 기지점이 정확하다고 인정되는 경우","blanks":[]},{"lvl":1,"label":"2.","text":"임야도에 도곽선이 없는 경우","blanks":[]},{"lvl":0,"label":"②","text":"제1항 단서에 따라 측량할 때에는 임야도상의 경계는 제17조제1항제3호의 경계에 따라야 하며, 지적도의 축척에 따른 측량성과를 임야도의 축척으로 측량결과도에 표시할 때에는 지적도의 축척에 따른 측량결과도에 표시된 경계점의 좌표를 구하여 임야측량결과도에 전개하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 축척비율에 따라 줄여서 임야측량결과도를 작성한다.","blanks":[]},{"lvl":1,"label":"1.","text":"경계점의 좌표를 구할 수 없는 경우","blanks":[]},{"lvl":1,"label":"2.","text":"경계점의 좌표에 따라 줄여서 그리는 것이 부적당한 경우","blanks":[]}]},{"id":"jcsl-22","no":"제22조","title":"지적확정측량","lines":[{"lvl":0,"label":"①","text":"지적확정측량을 하는 경우 필지별 경계점은 위성기준점, 통합기준점, 삼각점, 지적삼각점, 지적삼각보조점 및 지적도근점에 따라 측정하여야 한다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":23,"e":64,"t":"term","n":6}]},{"lvl":0,"label":"②","text":"지적확정측량을 할 때에는 미리 규칙 제95조제1항제3호에 따른 사업계획도와 지적도ㆍ임야도를 대조하여 각 필지의 위치 등을 확인해야 한다.","blanks":[{"s":0,"e":6,"t":"term"}]},{"lvl":0,"label":"③","text":"도시개발사업 등으로 지적확정측량을 하려는 지역에 임야도를 갖춰 두는 지역의 토지가 있는 경우에는 등록전환을 하지 아니할 수 있다.","blanks":[{"s":11,"e":17,"t":"term"},{"s":54,"e":58,"t":"term"}]},{"lvl":0,"label":"④","text":"지적확정측량 방법과 절차에 대해서는 국토교통부장관이 정한다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":20,"e":27,"t":"org"}]}]},{"id":"jcsl-23","no":"제23조","title":"경계점좌표등록부를 갖춰 두는 지역의 측량","lines":[{"lvl":0,"label":"①","text":"경계점좌표등록부를 갖춰 두는 지역에 있는 각 필지의 경계점을 측정할 때에는 도선법ㆍ방사법 또는 교회법에 따라 좌표를 산출하여야 한다. 다만, 필지의 경계점이 지형ㆍ지물에 가로막혀 경위의를 사용할 수 없는 경우에는 간접적인 방법으로 경계점의 좌표를 산출할 수 있다.","blanks":[{"s":42,"e":56,"t":"term","n":3}]},{"lvl":0,"label":"②","text":"제1항에 따른 각 필지의 경계점 측점번호는 왼쪽 위에서부터 오른쪽으로 경계를 따라 일련번호를 부여한다.","blanks":[]},{"lvl":0,"label":"③","text":"기존의 경계점좌표등록부를 갖춰 두는 지역의 경계점에 접속하여 경위의측량방법 등으로 지적확정측량을 하는 경우 동일한 경계점의 측량성과가 서로 다를 때에는 경계점좌표등록부에 등록된 좌표를 그 경계점의 좌표로 본다. 이 경우 동일한 경계점의 측량성과의 차이는 제27조제1항제4호가목의 허용범위 이내여야 한다.","blanks":[{"s":34,"e":39,"t":"term"},{"s":46,"e":52,"t":"term"}]}]},{"id":"jcsl-24","no":"제24조","tit blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":2,"label":"가.","text":"경계점좌표등록부 시행지역: ±15센티미터","blanks":[{"s":15,"e":22,"t":"num"}]},{"lvl":2,"label":"나.","text":"그 밖의 지역: ±25센티미터","blanks":[{"s":9,"e":16,"t":"num"}]},{"lvl":1,"label":"4.","text":"경계점","blanks":[]},{"lvl":2,"label":"가.","text":"경계점좌표등록부 시행지역: ±10센티미터","blanks":[{"s":15,"e":22,"t":"num"}]},{"lvl":2,"label":"나.","text":"그 밖의 지역: ±100분의 3M센티미터(M은 축척분모). 이 경우 전자평판측량방법으로 측량하는 경우에는 ±100분의 2M센티미터로 한다.","blanks":[{"s":9,"e":22,"t":"num"},{"s":38,"e":44,"t":"term"},{"s":59,"e":72,"t":"num"}]},{"lvl":0,"label":"②","text":"지적측량성과를 전자계산기기로 계산하였을 때에는 그 계산성과자료를 측량부 및 면적측정부로 본다.","blanks":[]}]},{"id":"jcsl-28","no":"제28조","title":"지적측량성과의 검사방법 등","lines":[{"lvl":0,"label":"①","text":"법 제25조제1항 단서에서 \"국토교통부령으로 정하는 측량의 경우\"란 경계복원측량 및 지적현황측량을 하는 경우를 말한다.","blanks":[{"s":38,"e":44,"t":"term"},{"s":47,"e":53,"t":"term"}]},{"lvl":0,"label":"②","text":"법 제25조제2항에 따른 지적측량성과의 검사방법과 검사절차는 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적측량수행자는 측량부ㆍ측량결과도ㆍ면적측정부, 측량성과 파일 등 측량성과에 관한 자료(전자파일 형태로 저장한 매체 또는 인터넷 등 정보통신망을 이용하여 제출하는 자료를 포함한다)를 지적소관청에 제출하여 그 성과의 정확성에 관한 검사를 받아야 한다. 다만, 지적삼각점측량성과 및 경위의측량방법으로 실시한 지적확정측량성과인 경우에는 다음 각 목의 구분에 따라 검사를 받아야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":101,"e":106,"t":"org"},{"s":143,"e":148,"t":"term"},{"s":155,"e":160,"t":"term"},{"s":169,"e":175,"t":"term"}]},{"lvl":2,"label":"가.","text":"국토교통부장관이 정하여 고시하는 면적 규모 이상의 지적확정측량성과: 시ㆍ도지사 또는 대도시 시장(「지방자치법」 제175조에 따라 서울특별시ㆍ광역시 및 특별시를 제외한 인구 50만 이상 대도시의 시장을 말한다. 이하 같다):","blanks":[{"s":0,"e":7,"t":"org"},{"s":28,"e":34,"t":"term"},{"s":38,"e":53,"t":"org"},{"s":96,"e":99,"t":"num"}]},{"lvl":2,"label":"나.","text":"국토교통부장관이 정하여 고시하는 면적 규모 미만의 지적확정측량성과: 지적소관청","blanks":[{"s":0,"e":7,"t":"org"},{"s":28,"e":34,"t":"term"},{"s":38,"e":43,"t":"org"}]},{"lvl":1,"label":"2.","text":"시ㆍ도지사 또는 대도시 시장은 제1호가목에 따른 검사를 하였을 때에는 그 결과를 지적소관청에 통지하여야 한다.","blanks":[{"s":0,"e":15,"t":"org"},{"s":45,"e":50,"t":"org"}]},{"lvl":1,"label":"3.","text":"지적소관청은 「건축법」 등 관계 법령에 따른 분할제한 저촉 여부 등을 판단하여 측량성과가 정확하다고 인정하면 지적측량성과도를 지적측량수행자에게 발급하여야 하며, 지적측량수행자는 측량의뢰인에게 그 지적측량성과도를 포함한 지적측량 결과부를 지체 없이 발급하여야 한다. 이 경우 검사를 받지 아니한 지적측량성과도는 측량의뢰인에게 발급할 수 없다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":70,"e":77,"t":"org"},{"s":90,"e":97,"t":"org"},{"s":99,"e":104,"t":"org"},{"s":173,"e":178,"t":"org"}]},{"lvl":0,"label":"③","text":"지적소관청은 지적측량성과의 검사에 필요한 경우 지적측량수행자에게 해당 필지 및 인접 필지의 경계복원측량결과도 또는 지적현황측량결과도를 제공할 것을 요청할 수 있으며, 지적측량수행자는 특별한 이유가 없으면 해당 요청에 따라야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":26,"e":33,"t":"org"},{"s":51,"e":57,"t":"term"},{"s":64,"e":70,"t":"term"},{"s":93,"e":100,"t":"org"}]},{"lvl":0,"label":"④","text":"제2항에 따른 측량성과에 관한 자료의 제출방법 및 절차, 지적측량성과도의 작성방법 등에 관하여 필요한 사항은 국토교통부장관이 정한다.","blanks":[{"s":61,"e":68,"t":"org"}]}]},{"id":"jcsl-29","no":"제29조","title":"문서의 서식","lines":[{"lvl":0,"label":"","text":"[서식 목록 — 학습 대상 제외, 원문은 법제처에서 확인]","blanks":[]}],"excluded":"서식"}]},"jbc":{"id":"jbc","name":"지적업무처리규정","kind":"국토교통부훈령","effective":"2025-08-29","promulgated":"2025-08-29","url":"https://www.law.go.kr/행정규칙/지적업무처리규정","short":"지적업무처리규정","annex":["[별표 1] 지적삼각점 및 지적삼각보조점의 매설방법","[별표 2] 법원감정측량 처리절차","[별표 3] 측량파일 코드 일람표","[별표 4] 측량성과검사 필인","[별표 5] 지적현황측량성과도의 도시방법","[별표 6] 측량결과도 용지의 규격","[별표 7] 도해지역의 토지이동 측량결과도(제67조제2항 관련)","[별표 8] 경계복원·지적현황 측량결과도(제67조제2항 관련)","[별표 9] 경계점좌표등록부시행지역 측량결과도(제67조제2항 관련)","[별표 10] 보조점 표지의 규격 및 재질","[별지 1] 기준점측량부 보관대장","[별지 2] 지적도근점성과 가감지역 관리대장","[별지 3] 위임장","[별지 4] 지적측량성과 검사정리부","[별지 5] 지적측량자료부","[별지 6] 지목변경(합병) 현지조사서","[별지 7] 지적정리결과 통보","[별지 8] 등록사항 정정대상 토지 관리대장","[별지 9] 토지(임야)대장 소유자정정 신청서","[별지 10] 미등기토지 소유자 주소정정 신청서","[별지 11] 미등기토지 소유자주소정정 등에 관한 조사서","[별지 12] 지적업무정리부","[별지 13] 소유자정리부","[별첨 1] 지적측량결과도 작성 예시 목록(지적업무처리규정 제25조제1항 관련)","[별첨 2] 도면정리 예시 목록(지적업무처리규정 제63조제3항 관련)"],"rule":true,"articles":[{"id":"jbc-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규정은 「공간정보의 구축 및 관리 등에 관한 법률」, 같은 법 시행령 및 같은 법 시행규칙, 「지적측량 시행규칙」에서 위임된 사항과 지적업무의 처리에 관하여 필요한 사항을 규정함을 목적으로 한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jbc-2","no":"제2조","title":"적용범위","lines":[{"lvl":0,"label":"","text":"지적업무의 처리에 관하여 「공간정보의 구축 및 관리 등에 관한 법률」(이하 \"법\"이라 한다), 같은 법 시행령(이하 \"영\"이라 한다), 같은 법 시행규칙(이하 \"규칙\"이라 한다) 및 「지적측량 시행규칙」에서 규정한 것과 다른 규정에 특별히 정하는 것을 제외하고는 이 규정에 따른다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jbc-3","no":"제3조","title":"정의","lines":[{"lvl":0,"label":"","text":"이 규정에서 사용하는 용어의 뜻은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"기지점\" 이란 「지적측량 시행규칙」 제2조제1호에 따른 기지점을 말한다.","blanks":[]},{"lvl":1,"label":"2.","text":"\"기지경계선(旣知境界線)\" 이란 세부측량성과를 결정하는 기준이 되는 기지점을 필지별로 직선으로 연결한 선을 말한다.","blanks":[{"s":1,"e":13,"t":"term"}]},{"lvl":1,"label":"3.","text":"\"전자평판측량\" 이란 토털스테이션과 지적측량 운영프로그램 등이 설치된 컴퓨터를 연결하여 세부측량을 수행하는 측량을 말한다.","blanks":[{"s":1,"e":7,"t":"term"}]},{"lvl":1,"label":"4.","text":"\"경위의측량\" 이란 수평각과 연직각을 정밀하게 관측할 수 있는 측량기계를 이용하여 실시하는 측량을 말한다.","blanks":[{"s":1,"e":6,"t":"term"}]},{"lvl":1,"label":"5.","text":"\"지적측량파일\" 이란 측량준비 파일, 측량현형파일 및 측량성과파일을 말한다.","blanks":[]},{"lvl":1,"label":"6.","text":"\"측량준비 파일\" 이란 부동산종합공부시스템에서 지적측량 업무를 수행하기 위하여 도면 및 대장속성 정보를 추출한 파일을 말한다.","blanks":[]},{"lvl":1,"label":"7.","text":"\"측량현형파일\" 이란 전자평판측량방법, 위성측량방법 및 드론측량방법으로 관측한 지적측량에 필요한 현형(現形)정보가 들어있는 파일을 말한다.","blanks":[{"s":12,"e":18,"t":"term"},{"s":22,"e":26,"t":"term"},{"s":31,"e":35,"t":"term"},{"s":54,"e":60,"t":"term"}]},{"lvl":1,"label":"8.","text":"\"측량성과파일\" 이란 전자평판측량 및 위성측량방법으로 관측 후 지적측량정보를 처리할 수 있는 시스템에 따라 작성된 측량결과도파일과 토지이동정리를 위한 지번, 지목 및 경계점의 좌표가 포함된 파일을 말한다.","blanks":[{"s":12,"e":18,"t":"term"},{"s":21,"e":25,"t":"term"}]},{"lvl":1,"label":"9.","text":"\"측량부\"란 기초측량 또는 세부측량성과를 결정하기 위하여 사용한 관측부ㆍ계산부 등 이에 수반되는 기록을 말한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jbc-4","no":"제4조","title":"지적측량수행자가 설치한 지적기준점표지의 관리 등","lines":[{"lvl":0,"label":"①","text":"지적측량수행자가 「지적측량 시행규칙」 제2조의2제1항에 따라 설치한 지적기준점표지의 작성 등에 관하여는 이 규정이 정하는 바에 따른다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":38,"e":43,"t":"term"}]},{"lvl":0,"label":"②","text":"지적측량수행자가 지적기준점표지를 설치한 때에는 「지적측량 시행규칙」 제28조제2항에 따라 측량성과에 대한 검사를 받아야 하며, },{"s":15,"e":20,"t":"term"},{"s":53,"e":58,"t":"term"},{"s":96,"e":103,"t":"org"}]}],"chap":"제2장 지적기준점의 관리"},{"id":"jbc-14","no":"제14조","title":"지적측량의 방법","lines":[{"lvl":0,"label":"①","text":"세부측량은 「지적측량 시행규칙」 제7조제1항제4호에 따른다.","blanks":[]},{"lvl":0,"label":"②","text":"지적확정측량과 시가지지역의 축척변경측량은 경위의측량방법, 전파기 또는 광파기측량방법, 드론측량방법 및 위성측량방법에 따른다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":15,"e":19,"t":"term"},{"s":23,"e":28,"t":"term"},{"s":39,"e":44,"t":"term"},{"s":48,"e":52,"t":"term"},{"s":57,"e":61,"t":"term"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-15","no":"제15조","title":"지적측량업의 등록 등","lines":[{"lvl":0,"label":"①","text":"영 제35조제4항에 따라 시ㆍ도지사 또는 대도시 시장(「지방자치법」제198조에 따라 서울특별시, 광역시 및 특별자치시를 제외한 인구 50만 이상의 시의 시장을 말한다. 이하 같다)은 지적측량업등록신청에 관한 적합여부를 심사하는 때에는 다음 각 호에 따라 처리한다.","blanks":[{"s":14,"e":29,"t":"org"},{"s":74,"e":77,"t":"num"}]},{"lvl":1,"label":"1.","text":"등록신청에 따른 서류를 심사할 경우에는 정본(등본 또는 증명서)은 서류 확인으로, 사본은 담당공무원이 원본과 대조하여 확인한다.","blanks":[]},{"lvl":1,"label":"2.","text":"지적측량업을 등록하려는 개인, 법인의 대표자와 임원에 관한 신원조회는 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 확인한다.","blanks":[]},{"lvl":1,"label":"3.","text":"지적측량업의 등록번호는 업종코드와 전국일련번호를 합하여 부여한다.","blanks":[]},{"lvl":0,"label":"②","text":"지적측량업을 등록한 자가 측량기기 성능검사를 받은 때에는 성능검사서 사본을 시ㆍ도지사 또는 대도시 시장에게 제출해야 한다.","blanks":[{"s":42,"e":57,"t":"org"}]},{"lvl":0,"label":"③","text":"지적측량업을 등록한 자가 폐업신고 시에는 측량업 폐업신고서 및 등록된 기술인력에 대한 자격상실증명원(4대 보험중 하나)을 시ㆍ도지사 또는 대도시 시장에게 제출해야 한다.","blanks":[{"s":56,"e":57,"t":"num"},{"s":68,"e":83,"t":"org"}]},{"lvl":0,"label":"④","text":"지적측량업을 등록한 자가 측량업을 휴업할 경우, 휴업기간 중에도 등록기준에 미달되지 않도록 등록된 사항을 유지하여야 한다. 다만, 보증보험은 제외한다.","blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-16","no":"제16조","title":"지적측량의뢰 등","lines":[{"lvl":0,"label":"①","text":"지적측량수행자가 법 제24조제1항에 따라 토지소유자 등 이해관계인(이하 \"측량의뢰인\"이라 한다)으로부터 지적측량의뢰를 받은 때에는 법 제106조제2항에 따른 지적측량수수료를 수납하고, 측량예정일자가 기재된 입금표를 측량의뢰인에게 교부하거나 인터넷 등 정보통신망 또는 등기우편으로 송달해야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":120,"e":125,"t":"org"}]},{"lvl":0,"label":"②","text":"토지소유자로부터 위임을 받은 자가 지적측량 의뢰를 할 때에는 토지소유자의 서명 또는 날인이 첨부된 별지 제3호 서식의 위임장을 지적측량수행자에게 제출해야 한다. 다만, 토지이동을 요하지 않는 지적측량을 의뢰하는 경우로서 토지가 국유지 또는 공유지인 경우 위임장을 생략할 수 있다.","blanks":[{"s":71,"e":78,"t":"org"}]},{"lvl":0,"label":"③","text":"지적측량수행자는 지적공부정리를 하여야 하는 지적측량의뢰를 받은 때에는 측량의뢰인에게 지적공부정리 및 지적공부등본발급신청을 지적소관청에 직접 신청하거나 지적측량수행자에게 위임할 수 있다는 설명을 하고, 측량의뢰인으로부터 위임을 받은 때에는 측량의뢰인이 하는 신청절차를 대행할 수 있다. 이 경우 의뢰서 여백에 \"신청위임\" 이라고 흑백의 반전으로 표시하거나 붉은색으로 기재하고, 소유자의 서명 또는 날인을 받아야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":39,"e":44,"t":"org"},{"s":68,"e":73,"t":"org"},{"s":84,"e":91,"t":"org"},{"s":112,"e":117,"t":"org"},{"s":133,"e":138,"t":"org"}]},{"lvl":0,"label":"④","text":"측량의뢰인은 전화 또는 인터넷 등 정보통신망을 사용하여 측량을 의뢰할 수 있으며, 이 경우 지적측량수행자는 규칙 별지 제15호 서식에 의뢰내용을 기록하여 저장할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":51,"e":58,"t":"org"}]},{"lvl":0,"label":"⑤","text":"제4항의 기록내용은 측량의뢰서로 갈음한다.","blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-17","no":"제17조","title":"지적측량 성과검사 정리부 등","lines":[{"lvl":0,"label":"①","text":"시ㆍ도지사, 대도시 시장 또는 지적소관청은 별지 제4호 서식의 지적측량 성과검사 정리부를 작성ㆍ비치하고, 지적측량수행계획서를 받은 때와 지적측량성과검사 요청이 있는 때에는 그 처리내용을 기재하여야 한다.","blanks":[{"s":0,"e":22,"t":"term","n":3}]},{"lvl":0,"label":"②","text":"지적측량수행자가 지적도근점측량을 한 때에는 제13조제1항에 따라 지적도근점측량성과와 경계가 부합하는지를 확인한 측량결과도를 지적도근점측량성과와 함께 지적소관청에 제출하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":9,"e":14,"t":"term"},{"s":36,"e":41,"t":"term"},{"s":69,"e":74,"t":"term"},{"s":83,"e":88,"t":"org"}]},{"lvl":0,"label":"③","text":"시ㆍ도지사, 대도시 시장 또는 지적소관청은 지적측량수행계획서에 기재된 측량기간ㆍ측량일자 등을 확인하여 측량이 지연되는 일이 없도록 조치하여야 한다.","blanks":[{"s":0,"e":22,"t":"term","n":3}]},{"lvl":0,"label":"④","text":"지적측량수행자는 지적측량성과검사를 위하여 측량결과도의 작성에 관한 제 규정 이행여부를 확인하여 검사를 의뢰하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-18","no":"제18조","title":"측량준비도 또는 측량준비 파일의 작성","lines":[{"lvl":0,"label":"①","text":"세부측량을 하고자 할 때에는 측량준비도 또는 측량준비 파일을 작성해야 한다. 이 경우 평판측량방법의 측량준비도는 연필로 작성할 수 있다.","blanks":[{"s":48,"e":52,"t":"term"}]},{"lvl":0,"label":"②","text":"제1항에 따라 측량준비도 또는 측량준비 파일을 작성하고자 하는 때에는 「지적측량 시행규칙」 제17조제1항제1호, 제4호 및 제5호 중 지적기준점 및 그 번호와 좌표는 검은색으로, 「지적측량 시행규칙」 제17조제1항제6호, 제7호 및 제5호 중 도곽선 및 그 수치와 지적기준점 간 거리는 붉은색으로, 그 외는 검은색으로 작성한다.","blanks":[{"s":75,"e":80,"t":"term"},{"s":148,"e":153,"t":"term"}]},{"lvl":0,"label":"③","text":"지적측량수행자는 측량 전에 측량준비 파일 작성의 적정여부 등을 확인하여 필요한 조치를 해야 한다. 이 경우 측량대상토지가 도곽ㆍ축척ㆍ행정구역선(동ㆍ리 경계선)등의 접합부분이 벌어지거나 겹쳐지면 해당 지적소관청에 그 내용을 통보해야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":111,"e":116,"t":"org"}]},{"lvl":0,"label":"④","text":"제3항 후단에 따라 통보를 받은 지적소관청은 측량대상토지가 도곽ㆍ축척ㆍ행정구역선(동ㆍ리 경계선) 등의 접합부분과 벌어지거나 겹치지 않도록 조치하여 지적전산파일을 다시 지적측량수행자에게 제공해야 한다. 이 경우 지적소관청이 지적전산파일의 접합을 위해 필요하면 지적측량수행자에게 지적측량 등 현황조사에 대한 협조를 요청할 수 있다.","blanks":[{"s":18,"e":23,"t":"org"},{"s":93,"e":100,"t":"org"},{"s":117,"e":122,"t":"org"},{"s":144,"e":151,"t":"org"}]},{"lvl":0,"label":"⑤","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"⑥","text":"경위의측량방법으로 세부측량을 하고자 할 경우 측량준비 파일의 작성에 관련된 사항은 제1항부터 제4항까지의 규정을 준용한다. 이 경우 지적기준점 간 거리 및 방위각은 붉은색으로 작성한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":74,"e":79,"t":"term"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-19","no":"제19조","title":"지적측량 자료조사","lines":[{"lvl":0,"label":"①","text":"지적측량수행자가 세부측량을 하고자 하는 때에는 별지 제5호 서식의 지적측량자료부를 작성ㆍ비치하여야 한다. 다만, 측량성과결정에 지장이 없다고 판단되는 경우에는 그러하지 아니하다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"②","text":"지적측량수행자는 지적측량정보를 처리할 수 있는 시스템에 측량준비 파일을 등록하여 다음 각 호의 사항에 대한 자료를 조사하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":1,"label":"1.","text":"경계 및 면적","blanks":[{"s":0,"e":7,"t":"item"}]},{"lvl":1,"label":"2.","text":"지적측량성과의 결정방법","blanks":[{"s":0,"e":12,"t":"item"}]},{"lvl":1,"label":"3.","text":"측량연혁","blanks":[{"s":0,"e":4,"t":"item"}]},{"lvl":1,"label":"4.","text":"지적기준점 성과","blanks":[{"s":0,"e":8,"t":"item"}]},{"lvl":1,"label":"5.","text":"그 밖에 필요한 사항","blanks":[]},{"lvl":0,"label":"③","text":"지적측량자료부를 작성할 경우에는 측량 전에 토지이동측량결과도, 경계복원측량결과도 및 지적공부 등에 따라 측량대상토지의 토지표시 변동사항, 지적측량연혁, 측량성과 결정에 사용한 기지점, 측량대상토지 주위의 기지점 및 지적기준점 유무 등을 조사하여 측량 시에 활용하여야 한다.","blanks":[{"s":26,"e":30,"t":"term"},{"s":35,"e":41,"t":"term"},{"s":120,"e":125,"t":"term"}]},{"lvl":0,"label":"④","text":"지적소관청은 지적측량수행자가 지적측량 자료조사를 위하여 지적공부, 지적측량성과(지적측량을 실시하여 작성한 측량부, 측량결과도, 면적측정부 및 측량성과파일에 등재된 측량결과를 말한다) 및 관계자료 등을 항상 조사할 수 있도록 협조하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":7,"e":14,"t":"org"}]},{"lvl":0,"label":"⑤","text":"지적소관청은 지적측량 민원처리 등에 필요한 경우에는 지적측량수행자에게 경계복원ㆍ지적현황측량결과도 등 관련 자료의 제출을 요구할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":29,"e":36,"t":"org"},{"s":44,"e":50,"t":"term"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-20","no":"제20조","title":"현지측량방법 등","lines":[{"lvl":0,"label":"①","text":"지적측량을 할 때에는 측량의뢰인과 인접 토지 소유자 등을 입회시켜 측량에 필요한 질문을 하거나 참고자료의 제시를 요구할 수 있다. 이 경우 측량의뢰인이 토지소유자가 아니면 토지소유자를 입회시켜야 한다.","blanks":[{"s":12,"e":17,"t":"org"},{"s":78,"e":83,"t":"org"}]},{"lvl":0,"label":"②","text":"지적측량결과도에는 제1항에 따라 입회한 자의 서명ㆍ전자서명 또는 날인을 받아야 한다. 다만, 측량의뢰인, 인접 토지 소유자 등이 입회하지 못하는 경우와 입회는 하였으나 서명 또는 날인을 거부하는 때에는 그 사유를 기재해야 한다.","blanks":[{"s":52,"e":57,"t":"org"}]},{"lvl":0,"label":"③","text":"인가ㆍ허가 등에 따라 토지의 형질이 변경되었을 경우에는 그 형질변경이 완료된 현황대로 측량성과를 결정해야 한다. 다만, 인가ㆍ허가 등의 내용과 다르게 토지의 형질이 변경되었을 경우에는 측량의뢰인에게 그 사실을 통지해야 한다.","blanks":[{"s":103,"e":108,"t":"org"}]},{"lvl":0,"label":"④","text":"세부측량성과를 결정하기 위하여 사용하는 기지점은 지적기준점이어야 한다. 다만, 도면의 기지점이 정확하고 보존이 양호하여 기지점을 이용하여도 측량에 지장이 없다고 인정되는 축척 1천분의 1 이하의 지역에는 그러하지 아니하다.","blanks":[{"s":27,"e":32,"t":"term"},{"s":98,"e":104,"t":"num"}]},{"lvl":0,"label":"⑤","text":"제4항에 따른 지적기준점은 세부측량을 하기 전에 설치하여야 하며, 그 설치비용을 측량의뢰인에게 부담시켜서는 아니 된다. 다만, 「지적측량 시행규칙」 제6조제2항제1호ㆍ제2호 또는 제4호에 해당하는 경우, 51필지 이상 연속지 또는 집단지 세부측량시에 지적기준점을 설치할 경우 및 제4항 단서에 따른 기지점에 따라 세부측량을 할 지역에서 측량의뢰인이 지적기준점의 설치를 요구할 경우에는 그러하지 아니하다.","blanks":[{"s":8,"e":13,"t":"term"},{"s":45,"e":50,"t":"org"},{"s":140,"e":145,"t":"term"},{"s":188,"e":193,"t":"org"},{"s":195,"e":200,"t":"term"}]},{"lvl":0,"label":"⑥","text":"지적확정측량지구 안에서 지적측량을 하고자 할 경우에는 종전에 실시한 지적확정측량성과를 참고하여 성과를 결정하여야 한다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":38,"e":44,"t":"term"}]},{"lvl":0,"label":"⑦","text":"지적측량을 완료한 때에는 분할 등록될 경계점의 위치 또는 경계복원점의 위치를 측량의뢰인 및 이해관계인에게 확인시키고, 지적기준점ㆍ담장모서리 및 전신주 등 주위 고정물로부터 거리를 측정하여 그 거리를 측량결과도 여백에 기재하거나 경위의측량방법에 따른 평면직각종횡선좌표 등 측정점의 위치설명도를 [예시1] 지적측량결과도 작성 예시 목록과 같이 작성해야 한다. 다만, 다음 각 호의 경우는 측정점 위치설명도 작성이 불가능한 사유를 기재하고 작성을 생략할 수 있다.","blanks":[{"s":43,"e":48,"t":"org"},{"s":66,"e":71,"t":"term"},{"s":127,"e":132,"t":"term"}]},{"lvl":1,"label":"1.","text":"주위 고정물이 없어 3방향 이상에서 거리를 측정할 수 없는 경우","blanks":[{"s":11,"e":14,"t":"num"}]},{"lvl":1,"label":"2.","text":"설치된 경계점표지와 고정물 간 거리가 30미터 이상이거나 고정물까지 지반이 연속되지 않는 경우","blanks":[{"s":21,"e":25,"t":"num"}]},{"lvl":1,"label":"3.","text":"도로, 구거(溝渠: 도랑), 하천 등 연속ㆍ집단지 토지의 경우","blanks":[]},{"lvl":1,"label":"4.","text":"그 밖의 사유로 위치설명도 작성이 불가능한 경우","blanks":[]},{"lvl":0,"label":"⑧","text":"지적측량수행자는 지적측량자료조사 또는 지적측량결과, 지적공부의 토지의 표시에 잘못이 있음을 발견한 때에는 지체 없이 지적소관청에 다음 각 호의 자료를 첨부하여 문서로 통보하고, 측량의뢰인에게 그 내용을 통지해야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":65,"e":70,"t":"org"},{"s":99,"e":104,"t":"org"}]},{"lvl":1,"label":"1.","text":"토지의 표시가 잘못되었음을 확인할 수 있는 자료","blanks":[{"s":0,"e":26,"t":"item"}]},{"lvl":1,"label":"2.","text":"제3조제5호에 따른 지적측량파일","blanks":[{"s":0,"e":17,"t":"item"}]},{"lvl":1,"label":"3.","text":"측량연혁 및 과거측량(지적공부를 정리하지 아니하는 측량에 한함)자료","blanks":[{"s":0,"e":37,"t":"item"}]},{"lvl":0,"label":"⑨","text":"법원의 감정측량을 할 때에는 별표 2의 법원감정측량 처리절차에 따른다.","blanks":[]},{"lvl":0,"label":"⑩","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"⑪","text":"전자평판측량에 따른 세부측량 시 평판점의 이동거리는 「지적측량 시행규칙」 제2조의2제1항제3호에서 정한 지적도근점표지의 점간거리 이내로 한다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":58,"e":63,"t":"term"}]},{"lvl":0,"label":"⑫","text":"「지적측량 시행규칙」제18조제1항제3호에 따라 보조점을 설치하는 경우와 지적기준점이 없는 지역에서 후속측량에 활용할 수 있도록 보조점을 설치하는 경우의 보조점표지의 형상 및 규격은 별표 10과 같다.","blanks":[{"s":40,"e":45,"t":"term"}]},{"lvl":0,"label":"⑬","text":"현형법(現形法)으로 지적측량의 성과를 결정하려면 경계점은 반드시 지적공부 등록당시의 축척으로 하며, 기지점을 기준으로 지상경계선과 도상경계선의 부합여부를 확인하여야 한다.","blanks":[{"s":0,"e":8,"t":"term"}]},{"lvl":0,"label":"⑭","text":"이미 작성되어 있는 지적측량파일을 이용하여 측량할 경우에는 기존 지적측량파일의 기준점 또는 제12항에 따라 설치된 보조점에서 지상경계선과 도상경계가 잘 부합되는 기지점과 신청토지 주변을 추가로 실측하여 성과를 결정해야 한다. 이 경우 작성되어 있는 지적측량파일의 측지계가 측량시점의 측지계와 다르면 측지계 변환 결과를 반영하여 성과를 결정해야 한다.","blanks":[]},{"lvl":0,"label":"⑮","text":"전자평판측량의 설치 및 표정방법은 다음 각 호에 따른다.","blanks":[{"s":0,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"토털스테이션을 지적기준점 또는 보조점 위에 거치한 후 다른 지적기준점이나 고정물을 시준하고 수평각을 전자평판에서 0° 0’ 0\"로 세팅하여 관측을 준비한다.","blanks":[{"s":8,"e":13,"t":"term"},{"s":33,"e":38,"t":"term"},{"s":63,"e":71,"t":"num"}]},{"lvl":1,"label":"2.","text":"지적기준점 간의 거리는 2회 이상 측정하여 확인한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":13,"e":15,"t":"num"}]},{"lvl":1,"label":"3.","text":"연직각은 천정을 0으로 설정한다.","blanks":[{"s":9,"e":10,"t":"num"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-21","no":"제21조","title":"신규등록측량","lines":[{"lvl":0,"label":"①","text":"지적공부에 등록되어 있지 아니한 토지 또는 공유수면을 매립하여 새로이 지적공부에 등록하는 토지는 인접 토지의 경계를 기준으로 하여 경계와 이용현황 등을 조사하기 위한 측량을 해야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"1950. 12. 1. 법률 제165호로 제정된 「지적법」 제37조에 따른 신규 등록 시 누락된 도로ㆍ하천 및 구거 등의 토지를 등록하는 경우의 경계는 도면에 등록된 인접토지의 경계를 기준으로 하여 결정한다. 이 경우 토지의 경계와 이용현황 등을 조사하기 위한 측량을 하여야 한다.","blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-22","no":"제22조","title":"등록전환측량","lines":[{"lvl":0,"label":"①","text":"1필지 전체를 등록전환 할 경우에는 임야대장등록사항과 토지대장등록사항의 부합여부 등을 확인하고 토지의 경계와 이용현황 등을 조사하기 위한 측량을 하여야 한다.","blanks":[{"s":8,"e":12,"t":"term"}]},{"lvl":0,"label":"②","text":"등록전환 할 일단의 토지가 2필지 이상으로 분할되어야 할 토지인 경우에는 1필지로 등록전환 후 분할해야 한다. 이 경우 등록 전환할 토지의 지목은 임야대장에 등록된 지목으로 설정하되, 분할은 등록전환과 동시에 정리한다.","blanks":[{"s":0,"e":4,"t":"term"},{"s":46,"e":50,"t":"term"},{"s":107,"e":111,"t":"term"}]},{"lvl":0,"label":"③","text":"경계점좌표등록부를 비치하는 지역과 연접되어 있는 토지를 등록전환하려면 경계점좌표등록부에 등록하여야 한다.","blanks":[{"s":31,"e":35,"t":"term"}]},{"lvl":0,"label":"④","text":"토지대장에 등록하는 면적은 등록전환측량의 결과에 따라야 하며, 임야대장의 면적을 그대로 정리할 수 없다.","blanks":[{"s":15,"e":19,"t":"term"}]},{"lvl":0,"label":"⑤","text":"1필지의 일부를 등록전환 하려면 등록전환으로 인하여 말소하여야 할 필지의 면적은 반드시 임야분할측량결과도에서 측정하여야 한다.","blanks":[{"s":9,"e":13,"t":"term"},{"s":18,"e":22,"t":"term"}]},{"lvl":0,"label":"⑥","text":"임야도에 도곽선 또는 도곽선수치가 없거나, 1필지 전체를 등록전환 할 경우에만 등록전환으로 인하여 말소해야 할 필지의 임야측량결과도를 등록전환측량결과도에 함께 작성할 수 있다.","blanks":[{"s":32,"e":36,"t":"term"},{"s":44,"e":48,"t":"term"},{"s":75,"e":79,"t":"term"}]},{"lvl":0,"label":"⑦","text":"삭제","deleted":true,"blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-23","no":"제23조","title":"분할측량","lines":[{"lvl":0,"label":"①","text":"측량대상토지의 점유현황이 도면에 등록된 경계와 일치하지 않으면 분할 측량 시에 그 분할 등록될 경계점을 지상에 복원하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"합병된 토지를 합병전의 경계대로 분할하려면 합병 전 각 필지의 면적을 분할 후 각 필지의 면적으로 한다. 이 경우 분할되는 토지 중 일부가 등록사항정정대상토지이면 분할정리 후 그 토지에만 등록사항정정대상토지임을 등록하여야 한다.","blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-24","no":"제24조","title":"측량기하적","lines":[{"lvl":0,"label":"①","text":"평판측량방법으로 세부측량을 하는 때에는 측량준비도에 측량한 기하적(幾何跡)을 다음 각 호와 같이 작성해야 한다.","blanks":[{"s":0,"e":4,"t":"term"},{"s":33,"e":41,"t":"term"}]},{"lvl":1,"label":"1.","text":"평판점ㆍ측정점 및 방위표정에 사용한 기지점등에는 방향선을 긋고 실측한 거리를 기재한다. 이 경우 측정점의 방향선 길이는 측정점을 중심으로 약 1센티미터로 표시한다.","blanks":[{"s":79,"e":84,"t":"num"}]},{"lvl":1,"label":"2.","text":"평판점은 측량자의 경우는 직경 1.5밀리미터 이상 3밀리미터 이하의 검은색 원으로 표시하고, 검사자의 경우는 1변의 길이가 2밀리미터 이상 4밀리미터 이하의 삼각형으로 표시한다. 이 경우 평판점 옆에 평판이동순서에 따라 不₁, 不₂----으로 표시한다.","blanks":[{"s":17,"e":24,"t":"num"},{"s":28,"e":33,"t":"num"},{"s":61,"e":63,"t":"num"},{"s":69,"e":74,"t":"num"},{"s":78,"e":83,"t":"num"}]},{"lvl":1,"label":"3.","text":"평판점의 결정 및 방위표정에 사용한 기지점은 측량자는 직경 1밀리미터와 2밀리미터의 2중원으로 표시하고, 검사자는 1변의 길이가 2밀리미터와 3밀리미터의 2중 삼각형으로 표시한다.","blanks":[{"s":33,"e":38,"t":"num"},{"s":40,"e":45,"t":"num"},{"s":47,"e":48,"t":"num"},{"s":64,"e":66,"t":"num"},{"s":72,"e":77,"t":"num"},{"s":79,"e":84,"t":"num"},{"s":86,"e":87,"t":"num"}]},{"lvl":1,"label":"4.","text":"평판점과 기지점사이의 도상거리와 실측거리를 방향선상에 다음과 같이 기재한다.","blanks":[],"imgs":["155908989"]},{"lvl":1,"label":"5.","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"②","text":"전자평판측량방법으로 세부측량을 하는 때에는 측량준비 파일에 측량한 기하적을 다음 각 호와 같이 작성해야 한다.","blanks":[{"s":0,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"관측한 측정점에는 측정점을 중심으로 1센티미터의 방향선( ├ )을 긋고, 오른쪽 상단에는 측정거리를 표시해야 한다. 다만, 소축척등으로 식별이 불가능한 때에는 방향선과 측정거리를 생략할 수 있다.","blanks":[{"s":20,"e":25,"t":"num"}]},{"lvl":1,"label":"2.","text":"측정점의 표시는 측량자의 경우 붉은색 짧은 십자선(+)으로 표시하고, 검사자는 삼각형(△)으로 표시하며, 각 측정점은 붉은색 점선으로 연결한다.","blanks":[]},{"lvl":1,"label":"3.","text":"평판점의 표시는 측량자의 경우 직경 1.5밀리미터 이상 3밀리미터 이하의 검은색 원으로 표시하고, 검사자의 경우 1변의 길이가 2밀리미터 이상 4밀리미터 이하의 삼각형으로 표시한다. 이 경우 평판점 옆에 평판이동순서에 따라 不₁, 不₂----으로 표시한다.","blanks":[{"s":20,"e":27,"t":"num"},{"s":31,"e":36,"t":"num"},{"s":63,"e":65,"t":"num"},{"s":71,"e":76,"t":"num"},{"s":80,"e":85,"t":"num"}]},{"lvl":1,"label":"4.","text":"지적측량결과도 상단 중앙에 \"전자평판측량\" 이라 표기하고, 상단 오른쪽에 측량성과파일명을 표기해야 하며, 측량성과파일에는 측량성과 결정에 관한 모든 사항이 수록되어 있어야 한다.","blanks":[{"s":16,"e":22,"t":"term"}]},{"lvl":1,"label":"5.","text":"측량결과의 파일 형식은 표준화된 공통포맷을 지원할 수 있어야 하며, 측량결과에 대한 측량파일 코드 일람표는 별표 3과 같다.","blanks":[]},{"lvl":1,"label":"6.","text":"이미 작성되어 있는 지적측량파일을 이용하여 측량할 경우에는 기존 측량파일 코드의 내용ㆍ규격ㆍ도식은 파란색으로 표시하며, 방향선, 측정거리는 생략할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"위성 또는 드론을 활용하여 세부측량을 실시하는 경우에는 제2항 각 호를 따르되, 위성측량방법은 방향선과 측정거리를 생략하고, 드론측량방법은 방향선, 측정거리, 측정점을 생략한다. 이 경우 위성측량은 지적측량결과도 상단 중앙에 \"위성측량\"이라 표기하고, 드론측량은 지적측량결과도 상단 중앙에 \"드론측량\"이라 표기한다.","blanks":[{"s":45,"e":49,"t":"term"},{"s":70,"e":74,"t":"term"},{"s":105,"e":109,"t":"term"},{"s":127,"e":131,"t":"term"},{"s":141,"e":145,"t":"term"},{"s":163,"e":167,"t":"term"}]},{"lvl":0,"label":"④","text":"측량대상토지에 지상구조물 등이 있는 경우와 새로이 설정하는 경계에 지상건물 등이 걸리는 경우에는 그 위치현황을 표시해야 한다. 다만, 영 제55조제4항제2호 또는 제3호의 규정에 따라 토지를 분할하는 경우에는 그러하지 아니하다.","blanks":[]},{"lvl":0,"label":"⑤","text":"「지적측량 시행규칙」 제26조제1항제6호 및 같은 조 제2항제7호에 따른 측량대상토지의 점유현황선은 붉은색 점선으로 표시한다. 다만, 현황에 따라 구분표시가 필요한 경우 붉은색 이외의 색을 사용할 수 있다.","blanks":[]},{"lvl":0,"label":"⑥","text":"「지적측량 시행규칙」 제26조 및 이 규정 제29조에 따른 측량결과도의 문자와 숫자는 레터링 또는 전자측량시스템에 따라 작성한다.","blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-25","no":"제25조","title":"지적측량결과도의 작성 등","lines":[{"lvl":0,"label":"①","text":"「지적측량 시행규칙」 제26조에 따른 측량결과도(세부측량을 실시한 결과를 작성한 측량도면을 말한다)는 도면용지 또는 전자측량시스템을 사용하여 예시 1의 지적측량결과도 작성 예시에 따라 작성하고, 측량결과도를 파일로 작성한 때에는 데이터베이스에 저장하여 관리 할 수 있다. 다만, 경위의측량방법으로 실시한 지적측량결과를 별표 제7호 또는 제8호 서식으로 작성할 경우에는 다음 각 호의 사항을 별도 작성ㆍ관리ㆍ검사요청 하여야 한다.","blanks":[{"s":156,"e":161,"t":"term"}]},{"lvl":1,"label":"1.","text":"경계점(지적기준점) 좌표","blanks":[{"s":0,"e":13,"t":"item"}]},{"lvl":1,"label":"2.","text":"기지점 계산","blanks":[{"s":0,"e":6,"t":"item"}]},{"lvl":1,"label":"3.","text":"경계점(보조점) 관측 및 좌표 계산","blanks":[{"s":0,"e":19,"t":"item"}]},{"lvl":1,"label":"4.","text":"교차점 계산","blanks":[{"s":0,"e":6,"t":"item"}]},{"lvl":1,"label":"5.","text":"면적 지정분할 계산","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"6.","text":"좌표면적 및 점간거리","blanks":[{"s":0,"e":11,"t":"item"}]},{"lvl":1,"label":"7.","text":"면적측정부","blanks":[{"s":0,"e":5,"t":"item"}]},{"lvl":0,"label":"②","text":"지적측량수행자는 지적측량결과도상의 면적측정, 측량준비도, 측량결과도 작성 및 검사, 측량성과도 작성, 수치의 계산 및 검사 등에 날인 또는 서명을 해야 하고, 지적측량검사자는 지적측량결과도상의 면적측정의 검사, 도면의 정리 및 검사, 지적도 및 경계점좌표등록부의 정리 및 검사란 등에 날인 또는 서명을 해야 한다. 이 경우 서명은 정자(正字)로 해야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":185,"e":191,"t":"term"}]},{"lvl":0,"label":"③","text":"측량결과도의 보관은 지적소관청은 연도별, 측량종목별, 지적공부정리 일자별, 동ㆍ리별로, 지적측량수행자는 연도별, 동ㆍ리별로, 지번 순으로 편철하여 보관해야 한다. 다만, 파일 형태의 측량결과도의 경우 제1항 본문에 따른다.","blanks":[{"s":11,"e":16,"t":"org"},{"s":49,"e":56,"t":"org"}]},{"lvl":0,"label":"④","text":"지적측량업자가 폐업하는 경우에는 보관중인 측량결과도 원본(전자측량시스템으로 작성한 전산파일을 포함한다)과 지적측량 프로그램을 시ㆍ도지사 또는 대도시 시장에게 제출해야 하며, 시ㆍ도지사 또는 대도시 시장은 해당 지적소관청에 측량결과도 원본을 보내주어야 한다.","blanks":[{"s":70,"e":85,"t":"org"},{"s":97,"e":112,"t":"org"},{"s":117,"e":122,"t":"org"}]},{"lvl":0,"label":"⑤","text":"지적측량수행자는 전자평판측량방법, 위성측량방법 또는 드론측량방법으로 측량을 하여 작성된 지적측량파일을 데이터베이스에 저장하여 후속 측량자료 및 민원업무에 활용할 수 있도록 관리해야 하며, 지적측량파일은 월1회 이상 데이터를 백업하여 보관해야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":9,"e":15,"t":"term"},{"s":19,"e":23,"t":"term"},{"s":29,"e":33,"t":"term"},{"s":114,"e":116,"t":"num"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-26","no":"제26조","title":"지적측량성과의 검사항목","lines":[{"lvl":0,"label":"","text":"「지적측량 시행규칙」 제28조제2항에 따른 지적측량성과검사를 할 때에는 다음 각 호의 사항을 검사하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"기초측량","blanks":[]},{"lvl":2,"label":"가.","text":"기지점사용의 적정여부","blanks":[]},{"lvl":2,"label":"나.","text":"지적기준점설치망 구성의 적정여부","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":2,"label":"다.","text":"관측각 및 거리측정의 정확여부","blanks":[]},{"lvl":2,"label":"라.","text":"계산의 정확여부","blanks":[]},{"lvl":2,"label":"마.","text":"지적기준점 선점 및 표지설치의 정확여부","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":2,"label":"바.","text":"지적기준점성과와 기지경계선과의 부합여부","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":1,"label":"2.","text":"세부측량","blanks":[]},{"lvl":2,"label":"가.","text":"기지점사용의 적정여부","blanks":[]},{"lvl":2,"label":"나.","text":"측량준비도 및 측량결과도 작성의 적정여부","blanks":[]},{"lvl":2,"label":"다.","text":"기지점과 지상경계와의 부합여부","blanks":[]},{"lvl":2,"label":"라.","text":"경계점 간 계산거리(도상거리)와 실측거리의 부합여부","blanks":[]},{"lvl":2,"label":"마.","text":"면적측정의 정확여부","blanks":[]},{"lvl":2,"label":"바.","text":"관계법령의 분할제한 등의 저촉 여부. 다만, 제20조제3항은 제외한다.","blanks":[]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-27","no":"제27조","title":"지적측량성과의 검사방법 등","lines":[{"lvl":0,"label":"①","text":"지적측량수행자가 지적측량 성과검사를 요청하는 경우와 지적소관청이 지적측량 성과검사 결과를 통보하는 경우에는 정보시스템을 이용하여 처리할 수 있다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":29,"e":34,"t":"org"}]},{"lvl":0,"label":"②","text":"세부측량을 하기 전에 기초측량을 한 경우에는 미리 지적기준점성과에 대한 검사를 받은 후에 세부측량을 해야 한다. 다만, 지적소관청과 사전 협의를 한 경우에는 지적기준점성과 검사 전에 세부측량을 실시할 수 있다. 이 경우 지적공부 정리를 요하는 세부측량은 세부측량성과와 지적기준점성과를 동시에 검사할 수 있다.","blanks":[{"s":28,"e":33,"t":"term"},{"s":67,"e":72,"t":"org"},{"s":88,"e":93,"t":"term"},{"s":150,"e":155,"t":"term"}]},{"lvl":0,"label":"③","text":"전자평판측량에 따른 측량성과 파일은 도형자료와 속성자료 간의 일치성과 유효성을 검증하기 위하여 다음 각 호의 사항을 실시하고 최종적으로 종번(終番) 검사를 실시하여야 한다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":76,"e":82,"t":"term"}]},{"lvl":1,"label":"1.","text":"면적공차 초과 검증","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"2.","text":"누락필지 및 원필지 중복객체 검증","blanks":[{"s":0,"e":18,"t":"item"}]},{"lvl":1,"label":"3.","text":"지번중복 검증 및 도곽의 적정성 여부 검사","blanks":[{"s":0,"e":23,"t":"item"}]},{"lvl":1,"label":"4.","text":"법정 리ㆍ동계 및 축척 간 접합 중복 검사","blanks":[{"s":0,"e":23,"t":"item"}]},{"lvl":1,"label":"5.","text":"폐쇄도면 중첩검사","blanks":[{"s":0,"e":9,"t":"item"}]},{"lvl":1,"label":"6.","text":"성과레이어 중첩검사","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"7.","text":"이격거리 측정 및 필계점 좌표 확인","blanks":[{"s":0,"e":19,"t":"item"}]},{"lvl":1,"label":"8.","text":"측정점위치설명도 작성의 적정 여부","blanks":[{"s":0,"e":18,"t":"item"}]},{"lvl":1,"label":"9.","text":"주위필지와의 부합여부","blanks":[{"s":0,"e":11,"t":"item"}]},{"lvl":1,"label":"10.","text":"그 밖에 필요한 사항","blanks":[]},{"lvl":0,"label":"④","text":"지적소관청은 지적측량검사가 완료된 때에는 해당 측량성과 파일을 부동산종합공부시스템에 등록하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"⑤","text":"「지적측량 시행규칙」 제28조에 따른 측량성과의 검사방법은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"측량성과를 검사하는 때에는 측량자가 실시한 측량방법과 다른 방법으로 한다. 다만, 부득이한 경우에는 그러하지 아니한다.","blanks":[]},{"lvl":1,"label":"2.","text":"지적삼각점측량 및 지적삼각보조점측량은 신설된 점을, 지적도근점측량은 주요도선별로 지적도근점을 검사한다. 이 경우 후방교회법으로 검사할 수 있다. 다만, 구하고자 하는 지적기준점이 기지점과 같은 원주상에 있는 경우에는 그러하지 아니하다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":17,"t":"term"},{"s":29,"e":34,"t":"term"},{"s":45,"e":50,"t":"term"},{"s":65,"e":68,"t":"term"},{"s":93,"e":98,"t":"term"}]},{"lvl":1,"label":"3.","text":"제2호에도 불구하고 GNSS에 의한 기준점의 성과검사 방법은 「GNSS에 의한 지적측량규정」 제17조에 따른다.","blanks":[]},{"lvl":1,"label":"4.","text":"세부측량결과를 검사할 때에는 새로 결정된 경계를 검사한다. 이 경우 측량성과 검사 시에 확인된 지역으로서 측량결과도만으로 그 측량성과가 정확하다고 인정되는 경우에는 현지측량검사를 하지 아니할 수 있다.","blanks":[]},{"lvl":1,"label":"5.","text":"면적측정검사는 필지별로 한다.","blanks":[]},{"lvl":1,"label":"6.","text":"측량성과 파일의 검사는 부동산종합공부시스템으로 한다.","blanks":[]},{"lvl":1,"label":"7.","text":"지적측량수행자와 동일한 전자측량시스템을 이용하여 세부측량시 측량성과의 정확성을 검사할 수 있다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"⑥","text":"시ㆍ도지사, 대도시 시장 또는 지적소관청은 측량성과를 검사하여 그 측량성과가 정확하다고 인정되는 경우에는 측량부ㆍ측량결과도ㆍ면적측정부 및 측량성과도에 별표 4의 측량성과검사 필인을 각각 날인하여야 한다.","blanks":[{"s":0,"e":22,"t":"term","n":3}]},{"lvl":0,"label":"⑦","text":"시ㆍ도지사, 대도시 시장 또는 지적소관청은 측량성과 검사결과 측량성과가 부정확하다고 판단되는 경우에는 제17조에 따라 지적측량수행자가 제출한 측량성과를 보완하도록 조치하고, 측량성과검사정리부 지적사항란에 그 사유를 기재한다. 이 경우 측량성과 검사결과 제26조제2호바목 본문에 해당되는 경우에는 지적측량수행자에게 측량성과에 관한 자료를 되돌려 주고 그 사유를 지적측량 성과검사 정리부 비고란에 붉은색으로 기재한다.","blanks":[{"s":0,"e":22,"t":"term","n":3},{"s":66,"e":73,"t":"org"},{"s":165,"e":172,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-27-2","no":"제27조의2","title":"지적측량 표본검사 등","lines":[{"lvl":0,"label":"①","text":"국토교통부장관은 법 제99조제1항제1호에 따라 지적측량수행자의 고의 또는 과실로 인한 지적측량 민원발생을 사전에 예방하고, 지적측량성과의 정확성을 확보하기 위하여 시ㆍ도지사에게는 표본검사를, 한국국토정보공사(이하 \"공사\"라 한다) 사장에게는 기술검사를 실시하게 할 수 있다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":26,"e":33,"t":"org"},{"s":91,"e":96,"t":"org"},{"s":107,"e":115,"t":"org"}]},{"lvl":0,"label":"②","text":"시ㆍ도지사는 지적공부를 정리한 측량성과에 대하여 연 1회 이상 표본검사를 실시하여야 하며, 그 결과 지적소관청의 검사사항이 법령 등에 위배된다고 판단되는 경우에는 국토교통부장관에게 보고하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":29,"e":31,"t":"num"},{"s":56,"e":61,"t":"org"},{"s":91,"e":98,"t":"org"}]},{"lvl":0,"label":"③","text":"시ㆍ도지사는 지적측량업자가 법 제45조에서 정한 지적측량업무를 수행한 측량성과에 대하여는 정기적으로 표본검사를 시행하여야 하며, 그 결과 법령 등에 위배된다고 판단되는 경우에는 필요한 조치를 하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"④","text":"공사 사장은 「지적측량 시행규칙」 제28조제1항에 따른 경계복원측량 및 지적현황측량성과에 대하여 지역본부별로 연 1회 이상 기술검사를 실시하여야 하며, 그 결과 법령 등에 위배된다고 판단되는 경우에는 필요한 조치를 취하고 그 내용을 국토교통부장관에게 보고하여야 한다.","blanks":[{"s":31,"e":37,"t":"term"},{"s":40,"e":46,"t":"term"},{"s":63,"e":65,"t":"num"},{"s":130,"e":137,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-28","no":"제28조","title":"측량성과도의 작성방법","lines":[{"lvl":0,"label":"①","text":"「지적측량 시행규칙」 제28조제2항제3호에 따른 측량성과도(측량결과도에 따라 작성한 측량성과도면을 말한다)의 문자와 숫자는 레터링 또는 전자측량시스템에 따라 작성하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"측량성과도의 명칭은 신규 등록, 등록전환, 분할, 지적확정, 경계복원, 지적현황, 지적복구 또는 등록사항정정측량 성과도로 한다. 이 경우 경계점좌표로 등록된 지역인 경우에는 명칭 앞에 \"(좌표)\"라 기재한다.","blanks":[{"s":18,"e":22,"t":"term"}]},{"lvl":0,"label":"③","text":"경계점좌표로 등록된 지역의 측량성과도에는 경계점간 계산거리를 기재하여야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"분할측량성과도를 작성하는 때에는 측량대상토지의 분할선은 붉은색 실선으로, 점유현황선(담장, 옹벽 등 지표면에 고정된 구조물에 한한다)은 붉은색 점선으로 표시해야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"⑥","text":"경계복원측량성과도를 작성하는 때에는 복원된 경계점은 직경 2밀리미터의 붉은색 원으로 표시하고, 측량대상토지의 점유현황선은 제4항을 준용한다. 다만, 필지가 작아 식별하기 곤란한 경우에는 복원된 경계점을 직경 1밀리미터 이상 1.5밀리미터 이하의 붉은색 원으로 표시할 수 있다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":32,"e":37,"t":"num"},{"s":116,"e":121,"t":"num"},{"s":125,"e":132,"t":"num"}]},{"lvl":0,"label":"⑦","text":"측량 대상토지의 경계와 경계점이 점유현황선과 일치할 경우에는 제4항 및 제6항에 따른 점유현황선의 표시를 생략할 수 있다.","blanks":[]},{"lvl":0,"label":"⑧","text":"지적현황측량성과도를 작성하는 때에는 별표 5의 도시방법에 따라 현황구조물의 위치 등을 판별할 수 있도록 표시하여야 한다.","blanks":[{"s":0,"e":6,"t":"term"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-29","no":"제29조","title":"측량성과도의 발급 등","lines":[{"lvl":0,"label":"①","text":"「지적측량 시행규칙」 제28조제2항제2호에 따라 시ㆍ도지사 및 대도시 시장으로부터 지적측량성과 검사결과 측량성과가 정확하다고 통지를 받은 지적소관청은 「지적측량 시행규칙」 제28조제2항제3호에 따라 측량성과 및 지적측량성과도를 지적측량수행자에게 발급하여야 한다.","blanks":[{"s":27,"e":32,"t":"org"},{"s":35,"e":41,"t":"org"},{"s":77,"e":82,"t":"org"},{"s":127,"e":134,"t":"org"}]},{"lvl":0,"label":"②","text":"「지적측량 시행규칙」 제28조제1항의 경계복원측량과 지적현황측량을 완료하고 발급한 측량성과도와 「지적측량 시행규칙」 제28조제2항제3호 전단에 따른 측량성과도를 지적측량수행자가 측량의뢰인에게 송부하고자 하는 때에는 지체 없이 교부하거나 인터넷 등 정보통신망 또는 등기우편으로 송달해야 한다.","blanks":[{"s":21,"e":27,"t":"term"},{"s":29,"e":35,"t":"term"},{"s":90,"e":97,"t":"org"},{"s":99,"e":104,"t":"org"}]},{"lvl":0,"label":"③","text":"측량성과도를 정보시스템으로 작성한 경우 측량의뢰인이 파일로 제공할 것을 요구하면 편집이 불가능한 파일형식으로 변환하여 측량성과를 파일로 제공할 수 있다.","blanks":[{"s":22,"e":27,"t":"org"}]},{"lvl":0,"label":"④","text":"지적소관청은 제20조제3항에 따라 측량성과를 결정한 경우에는 그 측량성과에 따라 각종 인가ㆍ허가 등이 변경되어야 지적공부정리신청을 할 수 있다는 뜻을 지적측량성과도에 붉은색으로 표시하여 지적측량수행자에게 발급한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":104,"e":111,"t":"org"}]},{"lvl":0,"label":"⑤","text":"지적소관청은 지적측량성과도를 발급한 토지에는 지적공부정리 신청여부를 조사하여 필요한 조치를 하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-30","no":"제30조","title":"지적측량성과 파일 검사","lines":[{"lvl":0,"label":"①","text":"지적측량수행자가 지적측량을 완료한 때에는 지적공부를 정리하기 위한 측량성과파일과 측량현형파일을 작성하여 지적소관청에 제출하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":58,"e":63,"t":"org"}]},{"lvl":0,"label":"②","text":"지적소관청은 지적측량성과 파일의 정확성 여부를 검사하여야 한다. 이 경우 부동산종합공부시스템에 따라 검사할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-31","no":"제31조","title":"지적측량성과 파일 보관 등","lines":[{"lvl":0,"label":"","text":"지적소관청이 측량성과파일로 토지이동을 정리할 때에는 서버용 컴퓨터에 저장하되, 파일명은 「부동산종합공부시스템 운영 및 관리 규정」 제19조제1항에 따라 부여되는 행정구역코드와 소관청코드, 측량업체코드, 측량종목코드, 해당년도 및 접수번호 순으로 하고, 보관은 제25조제3항에 따른다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-32","no":"제32조","title":"중앙지적위원회의 의안제출","lines":[{"lvl":0,"label":"①","text":"국토교통부장관, 시ㆍ도지사, 지적소관청은 토지등록업무의 개선 및 지적측량기술의 연구ㆍ개발 등의 장기계획안을 중앙지적위원회에 제출할 수 있다.","blanks":[{"s":0,"e":21,"t":"term","n":3}]},{"lvl":0,"label":"②","text":"공사에 소속된 지적측량기술자는 공사 사장에게, 공간정보산업협회에 소속된 지적측량기술자는 공간정보산업협회장에게 제1항에 따른 중ㆍ단기 계획안을 제출 할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"국토교통부장관은 제2항에 따른 안건이 접수된 때에는 그 계획안을 검토하여 중앙지적위원회에 회부하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"④","text":"중앙지적위원회는 제1항 및 제3항에 따른 안건이 접수된 때에는 영 제21조에 따라 위원회의 회의를 소집하여 안건 접수일로부터 30일 이내에 심의ㆍ의결하고, 그 의결 결과를 지체 없이 국토교통부장관에게 송부하여야 한다.","blanks":[{"s":70,"e":73,"t":"per"},{"s":102,"e":109,"t":"org"}]},{"lvl":0,"label":"⑤","text":"국토교통부장관은 제4항에 따라 의결된 결과를 송부 받은 때에는 이를 시행하기 위하여 필요한 조치를 하여야 하고, 중ㆍ단기계획 제출자에게는 그 의결 결과를 통지하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]}],"chap":"제3장 지적측량의 절차 및 방법"},{"id":"jbc-33","no":"제33조","title":"지적공부의 관리","lines":[{"lvl":0,"label":"","text":"법 제2조제19호의 지적공부 관리방법은 부동산종합공부시스템에 따른 방법을 제외하고는 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적공부는 지적업무담당공무원 외에는 취급하지 못한다.","blanks":[]},{"lvl":1,"label":"2.","text":"지적공부 사용을 완료한 때에는 즉시 보관 상자에 넣어야 한다. 다만, 간이보관 상자를 비치한 경우에는 그러하지 아니하다.","blanks":[]},{"lvl":1,"label":"3.","text":"지적공부를 지적서고 밖으로 반출하고자 할 때에는 훼손이 되지 않도록 보관ㆍ운반함 등을 사용한다.","blanks":[]},{"lvl":1,"label":"4.","text":"도면은 항상 보호대에 넣어 취급하되, 말거나 접지 못하며 직사광선을 받게 하거나 건습이 심한 장소에서 취급하지 못한다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-34","no":"제34조","title":"지적공부의 복제 등","lines":[{"lvl":0,"label":"①","text":"시장ㆍ군수ㆍ구청장은 법 제69조제3항에 따라 지적공부를 복제할 때에는 2부를 복제하여야 한다.","blanks":[{"s":0,"e":9,"t":"org"},{"s":39,"e":40,"t":"num"}]},{"lvl":0,"label":"②","text":"제1항에 따라 복제된 지적공부 1부는 법 제69조제2항에 따라 보관하고, 나머지 1부는 시ㆍ도지사가 지정하는 안전한 장소에 이중문이 설치된 내화금고 등에 6개월 이상 보관하여야 한다.","blanks":[{"s":17,"e":18,"t":"num"},{"s":45,"e":46,"t":"num"},{"s":49,"e":54,"t":"org"},{"s":86,"e":89,"t":"per"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-35","no":"제35조","title":"지적서고의 관리","lines":[{"lvl":0,"label":"①","text":"지적소관청은 지적부서 실ㆍ과장을 지적공부 보관 정책임자로, 지적업무담당을 부책임자로 지정하여 관리한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"지적서고의 자물쇠는 바깥쪽 문과 안쪽 문에 각각 설치하고 열쇠는 2조를 마련하되, 1조는 지적소관청이 봉인하여 관리하고, 다른 1조는 지적부서 실ㆍ과장이 관리한다.","blanks":[{"s":50,"e":55,"t":"org"}]},{"lvl":0,"label":"③","text":"지적서고의 출입문이 자동으로 개폐되는 경우에는 보안 관리의 책임자는 지적부서 실ㆍ과장이 되고 담당자는 보안관리 책임자가 별도로 지정한다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-36","no":"제36조","title":"지적공부등록현황의 비치ㆍ관리","lines":[{"lvl":0,"label":"","text":"지적소관청은 부동산종합공부시스템에 의해 매월 말일 현재로 작성ㆍ관리되는 지적공부등록현황과 지적업무정리상황등의 이상 유무를 점검ㆍ확인하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-37","no":"제37조","title":"일람도 및 지번색인표의 등재사항","lines":[{"lvl":0,"label":"","text":"규칙 제69조제5항에 따른 일람도 및 지번색인표에는 다음 각 호의 사항을 등재하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"일람도","blanks":[]},{"lvl":2,"label":"가.","text":"지번부여지역의 경계 및 인접지역의 행정구역명칭","blanks":[]},{"lvl":2,"label":"나.","text":"도면의 제명 및 축척","blanks":[]},{"lvl":2,"label":"다.","text":"도곽선과 그 수치","blanks":[]},{"lvl":2,"label":"라.","text":"도면번호","blanks":[]},{"lvl":2,"label":"마.","text":"도로ㆍ철도ㆍ하천ㆍ구거ㆍ유지(溜池: 저수지)ㆍ취락 등 주요 지형ㆍ지물의 표시","blanks":[]},{"lvl":1,"label":"2.","text":"지번색인표","blanks":[]},{"lvl":2,"label":"가.","text":"제명","blanks":[]},{"lvl":2,"label":"나.","text":"지번ㆍ도면번호 및 결번","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-38","no":"제38조","title":"일람도의 제도","lines":[{"lvl":0,"label":"①","text":"규칙 제69조제5항에 따라 일람도를 작성할 경우 일람도의 축척은 그 도면축척의 10분의 1로 한다. 다만, 도면의 장수가 많아서 한 장에 작성할 수 없는 경우에는 축척을 줄여서 작성할 수 있으며, 도면의 장수가 4장 미만인 경우에는 일람도의 작성을 하지 아니할 수 있다.","blanks":[{"s":44,"e":50,"t":"num"}]},{"lvl":0,"label":"②","text":"제명 및 축척은 일람도 윗부분에 \"ㅇㅇ시ㆍ도 ㅇㅇ시ㆍ군ㆍ구 ㅇㅇ읍ㆍ면 ㅇㅇ동ㆍ리 일람도 축척 ㅇㅇㅇㅇ 분의 1\"이라 제도한다. 이 경우 경계점좌표등록부시행지역은 제명 중 일람도 다음에 \"(좌표)\"라 기재하며, 그 제도방법은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"글자의 크기는 9밀리미터로 하고 글자사이의 간격은 글자크기의 2분의 1정도 띄운다.","blanks":[{"s":8,"e":13,"t":"num"},{"s":34,"e":39,"t":"num"}]},{"lvl":1,"label":"2.","text":"제명의 일람도와 축척사이는 20밀리미터를 띄운다.","blanks":[{"s":15,"e":21,"t":"num"}]},{"lvl":0,"label":"③","text":"도면번호는 지번부여지역ㆍ축척 및 지적도ㆍ임야도ㆍ경계점좌표등록부 시행지별로 일련번호를 부여하고 이 경우 신규 등록 및 등록전환으로 새로 도면을 작성할 경우의 도면번호는 그 지역 마지막 도면번호의 다음 번호로 부여한다. 다만, 제46조제12항에 따라 도면을 작성할 경우에는 종전 도면번호에 \"-1\"과 같이 부호를 부여한다.","blanks":[{"s":65,"e":69,"t":"term"},{"s":162,"e":163,"t":"num"}]},{"lvl":0,"label":"④","text":"일람도의 제도방법은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"도곽선과 그 수치의 제도는 제40조제5항을 준용한다.","blanks":[]},{"lvl":1,"label":"2.","text":"도면번호는 3밀리미터의 크기로 한다.","blanks":[{"s":6,"e":11,"t":"num"}]},{"lvl":1,"label":"3.","text":"인접 동ㆍ리 명칭은 4밀리미터, 그 밖의 행정구역 명칭은 5밀리미터의 크기로 한다.","blanks":[{"s":11,"e":16,"t":"num"},{"s":32,"e":37,"t":"num"}]},{"lvl":1,"label":"4.","text":"지방도로 이상은 검은색 0.2밀리미터 폭의 2선으로, 그 밖의 도로는 0.1밀리미터의 폭으로 제도한다.","blanks":[{"s":13,"e":20,"t":"num"},{"s":24,"e":25,"t":"num"},{"s":39,"e":46,"t":"num"}]},{"lvl":1,"label":"5.","text":"철도용지는 붉은색 0.2밀리미터 폭의 2선으로 제도한다.","blanks":[{"s":10,"e":17,"t":"num"},{"s":21,"e":22,"t":"num"}]},{"lvl":1,"label":"6.","text":"수도용지 중 선로는 남색 0.1밀리미터 폭의 2선으로 제도한다.","blanks":[{"s":14,"e":21,"t":"num"},{"s":25,"e":26,"t":"num"}]},{"lvl":1,"label":"7.","text":"하천ㆍ구거ㆍ유지는 남색 0.1밀리미터의 폭의 2선으로 제도하고, 그 내부를 남색으로 엷게 채색한다. 다만, 적은 양의 물이 흐르는 하천 및 구거는 0.1밀리미터의 남색 선으로 제도한다.","blanks":[{"s":13,"e":20,"t":"num"},{"s":25,"e":26,"t":"num"},{"s":82,"e":89,"t":"num"}]},{"lvl":1,"label":"8.","text":"취락지ㆍ건물 등은 검은색 0.1밀리미터의 폭으로 제도하고, 그 내부를 검은색으로 엷게 채색한다.","blanks":[{"s":14,"e":21,"t":"num"}]},{"lvl":1,"label":"9.","text":"삼각점 및 지적기준점의 제도는 제43조를 준용한다.","blanks":[{"s":0,"e":3,"t":"term"},{"s":6,"e":11,"t":"term"}]},{"lvl":1,"label":"10.","text":"도시개발사업ㆍ축척변경 등이 완료된 때에는 지구경계를 붉은색 0.1밀리미터 폭의 선으로 제도한 후 지구 안을 붉은색으로 엷게 채색하고, 그 중앙에 사업명 및 사업완료연도를 기재한다.","blanks":[{"s":7,"e":11,"t":"term"},{"s":33,"e":40,"t":"num"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-39","no":"제39조","title":"지번색인표의 제도","lines":[{"lvl":0,"label":"①","text":"제명은 지번색인표 윗부분에 9밀리미터의 크기로 \"ㅇㅇ시ㆍ도 ㅇㅇ시ㆍ군ㆍ구 ㅇㅇ읍ㆍ면 ㅇㅇ동ㆍ리 지번색인표\"라 제도한다.","blanks":[{"s":15,"e":20,"t":"num"}]},{"lvl":0,"label":"②","text":"지번색인표에는 도면번호별로 그 도면에 등록된 지번을, 토지의 이동으로 결번이 생긴 때에는 결번란에 그 지번을 제도한다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-40","no":"제40조","title":"도곽선의 제도","lines":[{"lvl":0,"label":"①","text":"도면의 위 방향은 항상 북쪽이 되어야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"지적도의 도곽 크기는 가로 40센티미터, 세로 30센티미터의 직사각형으로 한다.","blanks":[{"s":15,"e":21,"t":"num"},{"s":26,"e":32,"t":"num"}]},{"lvl":0,"label":"③","text":"도곽의 구획은 영 제7조제3항 각 호에서 정한 좌표의 원점을 기준으로 하여 정하되, 그 도곽의 종횡선수치는 좌표의 원점으로부터 기산하여 영 제7조제3항에서 정한 종횡선수치를 각각 가산한다.","blanks":[]},{"lvl":0,"label":"④","text":"이미 사용하고 있는 도면의 도곽크기는 제2항에도 불구하고 종전에 구획되어 있는 도곽과 그 수치로 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"도면에 등록하는 도곽선은 0.1밀리미터의 폭으로, 도곽선의 수치는 도곽선 왼쪽 아랫부분과 오른쪽 윗부분의 종횡선교차점 바깥쪽에 2밀리미터 크기의 아라비아숫자로 제도한다.","blanks":[{"s":14,"e":21,"t":"num"},{"s":71,"e":76,"t":"num"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-41","no":"제41조","title":"경계의 제도","lines":[{"lvl":0,"label":"①","text":"경계는 0.1밀리미터 폭의 선으로 제도한다.","blanks":[{"s":4,"e":11,"t":"num"}]},{"lvl":0,"label":"②","text":"1필지의 경계가 도곽선에 걸쳐 등록되어 있으면 도곽선 밖의 여백에 경계를 제도하거나, 도곽선을 기준으로 다른 도면에 나머지 경계를 제도한다. 이 경우 다른 도면에 경계를 제도할 때에는 지번 및 지목은 붉은색으로 표시한다.","blanks":[]},{"lvl":0,"label":"③","text":"규칙 제69조제2항제4호에 따른 경계점좌표등록부 등록지역의 도면(경계점 간 거리등록을 하지 아니한 도면을 제외한다)에 등록할 경계점 간 거리는 검은색의 1.0～1.5밀리미터 크기의 아라비아숫자로 제도한다. 다만, 경계점 간 거리가 짧거나 경계가 원을 이루는 경우에는 거리를 등록하지 아니할 수 있다.","blanks":[{"s":85,"e":88,"t":"num"},{"s":89,"e":96,"t":"num"}]},{"lvl":0,"label":"④","text":"지적기준점 등이 매설된 토지를 분할할 경우 그 토지가 작아서 제도하기가 곤란한 때에는 그 도면의 여백에 그 축척의 10배로 확대하여 제도할 수 있다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":64,"e":67,"t":"num"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-42","no":"제42조","title":"지번 및 지목의 제도","lines":[{"lvl":0,"label":"①","text":"지번 및 지목은 경계에 닿지 않도록 필지의 중앙에 제도한다. 다만, 1필지의 토지의 형상이 좁고 길어서 필지의 중앙에 제도하기가 곤란한 때에는 가로쓰기가 되도록 도면을 왼쪽 또는 오른쪽으로 돌려서 제도할 수 있다.","blanks":[]},{"lvl":0,"label":"②","text":"지번 및 지목을 제도할 때에는 지번 다음에 지목을 제도한다. 이 경우 2밀리미터 이상 3밀리미터 이하 크기의 명조체로 하고, 지번의 글자 간격은 글자크기의 4분의 1정도, 지번과 지목의 글자 간격은 글자크기의 2분의 1정도 띄어서 제도한다. 다만, 부동산종합공부시스템이나 레터링으로 작성할 경우에는 고딕체로 할 수 있다.","blanks":[{"s":39,"e":44,"t":"num"},{"s":48,"e":53,"t":"num"},{"s":87,"e":92,"t":"num"},{"s":117,"e":122,"t":"num"}]},{"lvl":0,"label":"③","text":"1필지의 면적이 작아서 지번과 지목을 필지의 중앙에 제도할 수 없는 때에는 ㄱ, ㄴ, ㄷ, . . . ㄱ¹, ㄴ¹, ㄷ¹, . . . ㄱ², ㄴ², ㄷ². . . 등으로 부호를 붙이고, 도곽선 밖에 그 부호ㆍ지번 및 지목을 제도한다. 이 경우 부호가 많아서 그 도면의 도곽선 밖에 제도할 수 없는 때에는 별도로 부호도를 작성할 수 있다.","blanks":[]},{"lvl":0,"label":"④","text":"부동산종합공부시스템에 따라 지번 및 지목을 제도할 경우에는 제2항 중 글자의 크기에 대한 규정과 제3항을 적용하지 아니할 수 있다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-43","no":"제43조","title":"지적기준점 등의 제도","lines":[{"lvl":0,"label":"①","text":"삼각점 및 지적기준점(제4조에 따라 지적측량수행자가 설치하고, 그 지적기준점성과를 지적소관청이 인정한 지적기준점을 포함한다.) 은 0.2밀리미터 폭의 선으로 다음 각 호와 같이 제도한다.","blanks":[{"s":0,"e":3,"t":"term"},{"s":6,"e":11,"t":"term"},{"s":20,"e":27,"t":"org"},{"s":37,"e":42,"t":"term"},{"s":46,"e":51,"t":"org"},{"s":57,"e":62,"t":"term"},{"s":73,"e":80,"t":"num"}]},{"lvl":1,"label":"1.","text":"위성기준점은 직경 2밀리미터 및 3밀리미터의 2중원 안에 십자선을 표시하여 제도한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":15,"t":"num"},{"s":18,"e":23,"t":"num"},{"s":25,"e":26,"t":"num"}]},{"lvl":0,"label":"","text":"○ 위성기준점","blanks":[{"s":2,"e":7,"t":"term"}],"imgs":["155908995"]},{"lvl":1,"label":"2.","text":"1등 및 2등삼각점은 직경 1밀리미터, 2밀리미터 및 3밀리미터의 3중원으로 제도한다. 이 경우 1등삼각점은 그 중심원 내부를 검은색으로 엷게 채색한다.","blanks":[{"s":7,"e":10,"t":"term"},{"s":15,"e":20,"t":"num"},{"s":22,"e":27,"t":"num"},{"s":30,"e":35,"t":"num"},{"s":37,"e":38,"t":"num"},{"s":56,"e":59,"t":"term"}],"imgs":["155909105"]},{"lvl":1,"label":"3.","text":"3등 및 4등삼각점은 직경 1밀리미터 및 2밀리미터의 2중원으로 제도한다. 이 경우 3등삼각점은 그 중심원 내부를 검은색으로 엷게 채색한다.","blanks":[{"s":7,"e":10,"t":"term"},{"s":15,"e":20,"t":"num"},{"s":23,"e":28,"t":"num"},{"s":30,"e":31,"t":"num"},{"s":49,"e":52,"t":"term"}],"imgs":["155909119"]},{"lvl":1,"label":"4.","text":"지적삼각점 및 지적삼각보조점은 직경 3밀리미터의 원으로 제도한다. 이 경우 지적삼각점은 원안에 십자선을 표시하고, 지적삼각보조점은 원안에 검은색으로 엷게 채색한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":8,"e":15,"t":"term"},{"s":20,"e":25,"t":"num"},{"s":42,"e":47,"t":"term"},{"s":64,"e":71,"t":"term"}],"imgs":["155908997"]},{"lvl":1,"label":"5.","text":"지적도근점은 직경 2밀리미터의 원으로 다음과 같이 제도한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":15,"t":"num"}],"imgs":["155908999"]},{"lvl":1,"label":"6.","text":"지적기준점의 명칭과 번호는 그 지적기준점의 윗부분에 2밀리미터 이상 3밀리미터 이하 크기의 명조체로 제도한다. 다만, 레터링으로 작성할 경우에는 고딕체로 할 수 있으며 경계에 닿는 경우에는 다른 위치에 제도할 수 있다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":17,"e":22,"t":"term"},{"s":29,"e":34,"t":"num"},{"s":38,"e":43,"t":"num"}]},{"lvl":0,"label":"②","text":"「지적측량 시행규칙」 제2조의2제2항 후단에 따라 지적기준점표지를 폐기한 때에는 도면에 등록된 그 지적기준점 표시사항을 말소한다.","blanks":[{"s":28,"e":33,"t":"term"},{"s":55,"e":60,"t":"term"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-44","no":"제44조","title":"행정구역선의 제도","lines":[{"lvl":0,"label":"①","text":"도면에 등록할 행정구역선은 0.4밀리미터 폭으로 다음 각 호와 같이 제도한다. 다만, 동ㆍ리의 행정구역선은 0.2밀리미터 폭으로 한다.","blanks":[{"s":15,"e":22,"t":"num"},{"s":60,"e":67,"t":"num"}]},{"lvl":1,"label":"1.","text":"국계는 실선 4밀리미터와 허선 3밀리미터로 연결하고 실선 중앙에 실선과 직각으로 교차하는 1밀리미터의 실선을 긋고, 허선에 직경 0.3밀리미터의 점 2개를 제도한다.","blanks":[{"s":7,"e":12,"t":"num"},{"s":17,"e":22,"t":"num"},{"s":50,"e":55,"t":"num"},{"s":72,"e":79,"t":"num"},{"s":83,"e":85,"t":"num"}],"imgs":["155909001"]},{"lvl":1,"label":"2.","text":"시ㆍ도계는 실선 4밀리미터와 허선 2밀리미터로 연결하고 실선 중앙에 실선과 직각으로 교차하는 1밀리미터의 실선을 긋고, 허선에 직경 0.3밀리미터의 점 1개를 제도한다.","blanks":[{"s":9,"e":14,"t":"num"},{"s":19,"e":24,"t":"num"},{"s":52,"e":57,"t":"num"},{"s":74,"e":81,"t":"num"},{"s":85,"e":87,"t":"num"}],"imgs":["155909003"]},{"lvl":1,"label":"3.","text":"시ㆍ군계는 실선과 허선을 각각 3밀리미터로 연결하고, 허선에 0.3밀리미터의 점 2개를 제도한다.","blanks":[{"s":17,"e":22,"t":"num"},{"s":34,"e":41,"t":"num"},{"s":45,"e":47,"t":"num"}],"imgs":["155909005"]},{"lvl":1,"label":"4.","text":"읍ㆍ면ㆍ구계는 실선 3밀리미터와 허선 2밀리미터로 연결하고, 허선에 0.3밀리미터의 점 1개를 제도한다.","blanks":[{"s":11,"e":16,"t":"num"},{"s":21,"e":26,"t":"num"},{"s":38,"e":45,"t":"num"},{"s":49,"e":51,"t":"num"}],"imgs":["155909007"]},{"lvl":1,"label":"5.","text":"동ㆍ리계는 실선 3밀리미터와 허선 1밀리미터로 연결하여 제도한다.","blanks":[{"s":9,"e":14,"t":"num"},{"s":19,"e":24,"t":"num"}],"imgs":["155909009"]},{"lvl":1,"label":"6.","text":"행정구역선이 2종이상 겹치는 경우에는 최상급 행정구역선만 제도한다.","blanks":[{"s":7,"e":8,"t":"num"}]},{"lvl":1,"label":"7.","text":"행정구역선은 경계에서 약간 띄워서 그 외부에 제도한다.","blanks":[]},{"lvl":0,"label":"②","text":"행정구역의 명칭은 도면여백의 넓이에 따라 4밀리미터 이상 6밀리미터 이하의 크기로 경계 및 지적기준점 등을 피하여 같은 간격으로 띄어서 제도한다.","blanks":[{"s":23,"e":28,"t":"num"},{"s":32,"e":37,"t":"num"},{"s":51,"e":56,"t":"term"}]},{"lvl":0,"label":"③","text":"도로ㆍ철도ㆍ하천ㆍ유지 등의 고유명칭은 3밀리미터 이상 4밀리미터 이하의 크기로 같은 간격으로 띄어서 제도한다.","blanks":[{"s":21,"e":26,"t":"num"},{"s":30,"e":35,"t":"num"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-45","no":"제45조","title":"색인도 등의 제도","lines":[{"lvl":0,"label":"①","text":"색인도는 도곽선의 왼쪽 윗부분 여백의 중앙에 다음 각 호와 같이 제도한다.","blanks":[]},{"lvl":1,"label":"1.","text":"가로 7밀리미터, 세로 6밀리미터 크기의 직사각형을 중앙에 두고 그의 4변에 접하여 같은 규격으로 4개의 직사각형을 제도한다.","blanks":[{"s":3,"e":8,"t":"num"},{"s":13,"e":18,"t":"num"},{"s":39,"e":41,"t":"num"},{"s":55,"e":57,"t":"num"}]},{"lvl":1,"label":"2.","text":"1장의 도면을 중앙으로 하여 동일 지번부여지역안 위쪽ㆍ아래쪽ㆍ왼쪽 및 오른쪽의 인접 도면번호를 각각 3밀리미터의 크기로 제도한다.","blanks":[{"s":56,"e":61,"t":"num"}]},{"lvl":0,"label":"②","text":"제명 및 축척은 도곽선 윗부분 여백의 중앙에 \"ㅇㅇ시ㆍ군ㆍ구 ㅇㅇ읍ㆍ면 ㅇㅇ동ㆍ리 지적도 또는 임야도 ㅇㅇ장중 제ㅇㅇ호 축척ㅇㅇㅇㅇ분의 1\"이라 제도한다. 이 경우 그 제도방법은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"글자의 크기는 5밀리미터로 하고, 글자사이의 간격은 글자크기의 2분의 1정도 띄어 쓴다.","blanks":[{"s":8,"e":13,"t":"num"},{"s":35,"e":40,"t":"num"}]},{"lvl":1,"label":"2.","text":"축척은 제명끝에서 10밀리미터를 띄어 쓴다.","blanks":[{"s":10,"e":16,"t":"num"}]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-46","no":"제46조","title":"토지의 이동에 따른 도면의 제도","lines":[{"lvl":0,"label":"①","text":"토지의 이동으로 지번 및 지목을 제도하는 경우에는 이동전 지번 및 지목을 말소하고, 새로 설정된 지번 및 지목을 가로쓰기로 제도한다.","blanks":[]},{"lvl":0,"label":"②","text":"경계를 말소할 때에는 해당 경계선을 말소한다.","blanks":[]},{"lvl":0,"label":"③","text":"말소된 경계를 다시 등록할 때에는 말소정리 이전의 자료로 원상회복 정리한다.","blanks":[]},{"lvl":0,"label":"④","text":"신규 등록ㆍ등록전환 및 등록사항정정으로 도면에 경계, 지번 및 지목을 새로 등록할 때에는 이미 비치된 도면에 제도한다. 다만, 이미 비치된 도면에 정리할 수 없는 때에는 새로 도면을 작성한다.","blanks":[{"s":6,"e":10,"t":"term"}]},{"lvl":0,"label":"⑤","text":"등록전환 할 때에는 임야도의 그 지번 및 지목을 말소한다.","blanks":[{"s":0,"e":4,"t":"term"}]},{"lvl":0,"label":"⑥","text":"필지를 분할할 경우에는 분할 전 지번 및 지목을 말소하고, 분할경계를 제도한 후 필지마다 지번 및 지목을 새로 제도한다.","blanks":[]},{"lvl":0,"label":"⑦","text":"도곽선에 걸쳐 있는 필지가 분할되어 도곽선 밖에 분할경계가 제도된 때에는 도곽선 밖에 제도된 필지의 경계를 말소하고, 그 도곽선 안에 필지의 경계, 지번 및 지목을 제도한다.","blanks":[]},{"lvl":0,"label":"⑧","text":"합병할 때에는 합병되는 필지 사이의 경계ㆍ지번 및 지목을 말소한 후 새로 부여하는 지번과 지목을 제도한다.","blanks":[]},{"lvl":0,"label":"⑨","text":"지번 또는 지목을 변경할 때에는 지번 또는 지목만 말소하고, 새로 설정된 지번 또는 지목을 제도한다.","blanks":[]},{"lvl":0,"label":"⑩","text":"지적공부에 등록된 토지가 바다가 된 때에는 경계ㆍ지번 및 지목을 말소한다.","blanks":[]},{"lvl":0,"label":"⑪","text":"행정구역이 변경된 때에는 변경 전 행정구역선과 그 명칭 및 지번을 말소하고, 변경 후의 행정구역선과 그 명칭 및 지번을 제도한다.","blanks":[]},{"lvl":0,"label":"⑫","text":"도시개발사업ㆍ축척변경 등의 시행지역으로서 시행 전과 시행 후의 도면축척이 같고 시행 전 도면에 등록된 필지의 일부가 사업지구안에 편입된 때에는 이미 비치된 도면에 경계ㆍ지번 및 지목을 제도하거나, 남아 있는 일부 필지를 포함하여 도면을 작성한다. 다만, 도면과 확정측량결과도의 도곽선 차이가 0.5밀리미터 이상인 경우에는 확정측량결과도에 따라 새로이 도면을 작성한다.","blanks":[{"s":7,"e":11,"t":"term"},{"s":163,"e":170,"t":"num"}]},{"lvl":0,"label":"⑬","text":"도시개발사업ㆍ축척변경 등의 완료로 새로 도면을 작성한 지역의 종전도면의 지구안의 지번 및 지목을 말소한다.","blanks":[{"s":7,"e":11,"t":"term"}]},{"lvl":0,"label":"⑭","text":"부동산종합공부시스템으로 제1항부터 제13항까지를 정리한 경우에는 변동 전ㆍ후의 내용을 관리하여야 하며, 필요한 경우 필지별로 폐쇄 전ㆍ후의 내용을 열람 및 발급할 수 있어야한다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-47","no":"제47조","title":"경계점좌표등록부의 정리","lines":[{"lvl":0,"label":"①","text":"부호도의 각 필지의 경계점부호는 왼쪽 위에서부터 오른쪽으로 경계를 따라 아라비아숫자로 연속하여 부여한다. 이 경우 토지의 빈번한 이동정리로 부호도가 복잡한 경우에는 아래 여백에 새로 정리할 수 있다.","blanks":[]},{"lvl":0,"label":"②","text":"분할된 경우의 부호도 및 부호에는 새로 결정된 경계점의 부호를 그 필지의 마지막부호 다음 번호부터 부여하고, 다른 필지로 된 경계점의 부호도, 부호 및 좌표는 말소하여야 하며, 새로 결정된 경계점의 좌표를 다음 란에 정리한다.","blanks":[]},{"lvl":0,"label":"③","text":"분할 후 필지의 부호도 및 부호의 정리는 제1항 본문을 준용한다.","blanks":[]},{"lvl":0,"label":"④","text":"합병된 때에는 존치되는 필지의 경계점좌표등록부에 합병되는 필지의 좌표를 정리하고 부호도 및 부호를 새로 정리한다. 이 경우 부호는 마지막부호 다음부호부터 부여하고, 합병으로 인하여 필요 없는 된 경계점(일직선상에 있는 경계점을 말한다)의 부호도ㆍ부호 및 좌표를 말소한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"합병으로 인하여 필지가 말소된 때에는 경계점좌표등록부의 부호도, 부호 및 좌표를 말소한다. 이 경우 말소된 경계점좌표등록부도 지번 순으로 함께 보관한다.","blanks":[]},{"lvl":0,"label":"⑥","text":"등록사항정정으로 경계점좌표등록부를 정리할 때에는 제1항부터 제5항까지 규정을 준용한다.","blanks":[]},{"lvl":0,"label":"⑦","text":"부동산종합공부시스템에 따라 경계점좌표등록부를 정리할 때에는 제1항부터 제6항까지를 적용하지 아니할 수 있다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-48","no":"제48조","title":"지적공부의 열람 및 등본작성 방법 등","lines":[{"lvl":0,"label":"①","text":"지적공부의 열람 및 등본발급 신청은 신청자가 대상토지의 지번을 제시한 경우에만 할 수 있다.","blanks":[]},{"lvl":0,"label":"②","text":"지적소관청은 지적공부의 열람신청이 있는 때에는 신청필지수와 수수료금액을 확인하여 신청서에 첨부된 수입증지를 소인한 후 컴퓨터 화면 등에 따라 담당공무원의 참여하에 지적공부를 열람시킨다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"③","text":"열람자가 보기 쉬운 장소에 다음 각 호와 같이 열람시의 유의사항을 게시하고 알려주어야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"지정한 장소에서 열람하여 주십시오.","blanks":[]},{"lvl":1,"label":"2.","text":"화재의 위험이 있거나 지적공부를 훼손할 수 있는 물건을 휴대해서는 안 됩니다.","blanks":[]},{"lvl":1,"label":"3.","text":"열람 시 개인정보 등이 포함된 사항은 기록, 촬영하여서는 안 됩니다.","blanks":[]},{"lvl":0,"label":"④","text":"지적공부의 등본은 지적공부를 복사ㆍ제도하여 작성하거나 부동산종합공부시스템으로 작성한다. 이 경우 대장등본은 작성일 현재의 최종사유를 기준으로 작성한다. 다만, 신청인의 요구가 있는 때에는 그러하지 아니하다.","blanks":[]},{"lvl":0,"label":"⑤","text":"도면등본을 복사에 따라 작성 발급하는 때에는 윗부분과 아랫부분에 다음과 같이 날인하고, 축척은 규칙 제69조제6항에 따른다. 다만, 부동산종합공부시스템으로 발급하는 경우에는 신청인이 원하는 축척과 범위를 지정하여 발급할 수 있다.","blanks":[],"imgs":["155909201"]},{"lvl":0,"label":"⑥","text":"제4항에 따라 작성한 등본에는 수입증지를 첨부하여 소인한 후 지적소관청의 직인을 날인하여야 한다. 이 경우 등본이 1장을 초과할 경우에는 첫 장에만 직인을 날인하고 다음 장부터는 천공 또는 간인하여 발급한다.","blanks":[{"s":34,"e":39,"t":"org"}]},{"lvl":0,"label":"⑦","text":"대장등본을 복사하여 작성 발급하는 때에는 대장의 앞면과 뒷면을 각각 복사하여 기재사항 끝부분에 다음과 같이 날인한다.","blanks":[],"imgs":["155909649"]},{"lvl":0,"label":"⑧","text":"법 제106조에 따라 등본 발급의 수수료는 유료와 무료로 구분하여 처리하되, 무료로 발급할 경우에는 등본 앞면 여백에 붉은색으로 \"무료\"라 기재한다.","blanks":[]},{"lvl":0,"label":"⑨","text":"폐쇄 또는 말소된 지적공부의 등본을 작성할 때에는 \"폐쇄 또는 말소된 ○○○○에 따라 작성한 등본입니다\"라고 붉은색으로 기재한다.","blanks":[]},{"lvl":0,"label":"⑩","text":"부동산종합공부시스템으로 지적공부를 열람하는 경우 열람용 등본을 발급할 수 있으며, 이때에는 아랫부분에 \"본토지(임야)대장은 열람용이므로 출력하신 토지(임야)대장은 법적인 효력이 없습니다.\"라고 기재한다.","blanks":[]},{"lvl":0,"label":"⑪","text":"등본은 공용으로 발급할 수 있으며, 이때 등본의 아래 부분에 \"본토지(임야)대장은 공용이므로 출력하신 토지(임야)대장은 민원용으로 사용할 수 없습니다.\"라고 기재한다.","blanks":[]}],"chap":"제4장 지적공부의 작성 및 관리"},{"id":"jbc-49","no":"제49조","title":"상속 등의 토지에 대한 지적공부정리 신청","lines":[{"lvl":0,"label":"①","text":"상속, 공용징수, 판결, 경매 등 「민법」 제187조에 따라 등기를 요하지 아니하는 토지를 취득한 자는 지적공부정리신청을 할 수 있다. 이 경우 토지소유를 증명하는 서류를 첨부하여야 하고, 상속의 경우에는 상속인 전원이 신청하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"③","text":"제1항에 따른 토지소유를 증명하는 서류는 다음 각 호를 말한다.","blanks":[]},{"lvl":1,"label":"1.","text":"상속재산 분할 협의서","blanks":[]},{"lvl":1,"label":"2.","text":"공용징수증","blanks":[]},{"lvl":1,"label":"3.","text":"법원의 확정판결서 정본 또는 사본","blanks":[]},{"lvl":1,"label":"4.","text":"경매 낙찰증서","blanks":[]},{"lvl":1,"label":"5.","text":"그 밖에 소유권을 확인할 수 있는 서류","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-50","no":"제50조","title":"지적공부정리신청의 조사","lines":[{"lvl":0,"label":"①","text":"지적소관청은 법 제77조부터 제82조까지, 법 제84조, 법 제86조 및 법 제87조에 따른 지적공부정리신청이 있는 때에는 다음 각 호의 사항을 확인ㆍ조사하여 처리한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":1,"label":"1.","text":"신청서의 기재사항과 지적공부등록사항과의 부합여부","blanks":[{"s":0,"e":26,"t":"item"}]},{"lvl":1,"label":"2.","text":"관계법령의 저촉여부","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"3.","text":"대위신청에 관하여는 그 권한대위의 적법여부","blanks":[{"s":0,"e":23,"t":"item"}]},{"lvl":1,"label":"4.","text":"구비서류 및 수입증지의 첨부여부","blanks":[{"s":0,"e":17,"t":"item"}]},{"lvl":1,"label":"5.","text":"신청인의 신청권한 적법여부","blanks":[{"s":0,"e":14,"t":"item"}]},{"lvl":1,"label":"6.","text":"토지의 이동사유","blanks":[{"s":0,"e":8,"t":"item"}]},{"lvl":1,"label":"7.","text":"그 밖에 필요하다고 인정되는 사항","blanks":[]},{"lvl":0,"label":"②","text":"접수된 서류를 보완 또는 반려한 때에는 지적업무정리부의 비고란에 그 사유를 붉은색으로 기재한다.","blanks":[]},{"lvl":0,"label":"③","text":"지목변경 및 합병을 하여야 하는 토지가 있을 때와 등록전환에 따라 지목이 바뀔 때에는 다음 각 호의 사항을 확인ㆍ조사하여 별지 제6호 서식의 현지조사서를 작성해야 한다. 다만, 관계법령에 따라 준공검사 절차가 있는 인가ㆍ허가를 받아 준공검사가 완료된 경우로서 그 준공결과로 다음 각 호의 사항을 확인할 수 있는 경우에는 현지조사를 생략할 수 있다. 이 경우 토지이동결의서 하단에 다음과 같이 현지조사생략 사유를 기재해야 한다.","blanks":[{"s":28,"e":32,"t":"term"}]},{"lvl":1,"label":"1.","text":"토지의 이용현황","blanks":[{"s":0,"e":8,"t":"item"}]},{"lvl":1,"label":"2.","text":"관계법령의 저촉여부","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"3.","text":"조사자의 의견, 조사연월일 및 조사자 직ㆍ성명","blanks":[{"s":0,"e":7,"t":"item"},{"s":9,"e":25,"t":"item"}],"imgs":["155910037"]},{"lvl":0,"label":"④","text":"신규등록, 분할, 등록전환 및 지적확정측량에 따른 측량성과도가 발급된 지 1년이 경과한 후 지적공부정리 신청이 있는 때에는 지적소관청은 다음 각 호의 사항을 확인ㆍ조사해야 하고, 측량성과와 다음 각 호의 사항이 다를 경우에는 재측량을 실시하도록 조치할 수 있다.","blanks":[{"s":0,"e":4,"t":"term"},{"s":10,"e":14,"t":"term"},{"s":17,"e":23,"t":"term"},{"s":41,"e":42,"t":"num"},{"s":69,"e":74,"t":"org"}]},{"lvl":1,"label":"1.","text":"측량성과와 현지경계의 부합여부","blanks":[{"s":0,"e":16,"t":"item"}]},{"lvl":1,"label":"2.","text":"관계법령의 저촉여부","blanks":[{"s":0,"e":10,"t":"item"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-51","no":"제51조","title":"지적공부정리 접수 등","lines":[{"lvl":0,"label":"①","text":"지적소관청은 법 제77조부터 제82조까지, 법 제84조, 법 제86조 및 법 제87조에 따른 지적공부정리신청이 있는 때에는 지적업무정리부에 토지이동 종목별로 접수하여야 한다. 이 경우 부동산종합공부시스템에서 부여된 접수번호를 토지의 이동신청서에 기재하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"제1항에 따라 접수된 신청서는 다음 각 호 사항을 검토하여 정리하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"신청사항과 지적전산자료의 일치여부","blanks":[]},{"lvl":1,"label":"2.","text":"첨부된 서류의 적정여부","blanks":[]},{"lvl":1,"label":"3.","text":"지적측량성과자료의 적정여부","blanks":[]},{"lvl":1,"label":"4.","text":"그 밖에 지적공부정리를 하기 위하여 필요한 사항","blanks":[]},{"lvl":0,"label":"③","text":"제1항에 따라 접수된 지적공부정리신청서를 보완 또는 반려(취하 포함)할 때에는 종목별로 그 처리내용을 정리하여야 한다. 이 경우 반려 또는 취하된 지적공부정리신청서가 다시 접수되었을 때에는 새로 접수하여야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"제1항의 신청에 따라 지적공부가 정리 완료한 때에는 별지 제7호 서식에 따라 지적정리결과를 신청인에게 통지하여야 한다. 다만, 법 제87조에 따라 대위신청에 대한 지적정리결과통지는 달리할 수 있다.","blanks":[]},{"lvl":0,"label":"⑤","text":"법 제87조에 따라 지적공부정리가 완료된 때에는 사업시행자는 분할 목적 및 분할 결과를 토지소유자 등 이해관계인에게 통지하여야 한다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-52","no":"제52조","title":"임시파일 생성","lines":[{"lvl":0,"label":"①","text":"지적소관청이 지번변경, 행정구역변경, 구획정리, 경지정리, 축척변경, 토지개발사업을 하고자 하는 때에는 임시파일을 생성하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":33,"e":37,"t":"term"}]},{"lvl":0,"label":"②","text":"제1항에 따라 임시파일이 생성되면 지번별조서를 출력하여 임시파일이 정확하게 생성되었는지 여부를 확인하여야 한다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-53","no":"제53조","title":"지목변경","lines":[{"lvl":0,"label":"","text":"영 제64조제1항에 따라 등록전환을 하여야 할 토지 중 목장용지ㆍ과수원 등 일단의 면적이 크거나 토지대장등록지로부터 거리가 멀어서 등록 전환하는 것이 부적당하다고 인정되는 경우에는 임야대장등록지에서 지목변경을 할 수 있다.","blanks":[{"s":14,"e":18,"t":"term"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-53-2","no":"제53조의2","title":"합병","lines":[{"lvl":0,"label":"①","text":"영 제66조제3항제7호에 따라 합병하려는 경우로서 합병하려는 토지의 토지대장 및 임야대장 중 어느 하나에 등록번호가 기재되어 있지 않은 경우에는 등록번호를 기재한 후 합병신청을 하여야 한다. 이 때 등록번호는 등기필증, 등기완료통지서, 등기사항증명서 또는 등기관서에서 제공한 등기전산정보자료에 따라 기재한다.","blanks":[]},{"lvl":0,"label":"②","text":"영 제66조제3항제7호의 단서에 따라 지적소관청이 토지 소유자가 동일인임을 확인한 경우에 토지 소유자의 주소는 합병 후 지적공부에 등록되는 지번의 주소로 한다.","blanks":[{"s":21,"e":26,"t":"org"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-54","no":"제54조","title":"축척변경","lines":[{"lvl":0,"label":"","text":"축척변경업무처리에 관하여는 제58조를 준용한다. 다만, 법 제83조제3항제1호 및 제2호에 따른 축척변경은 그러하지 아니하다.","blanks":[{"s":0,"e":4,"t":"term"},{"s":54,"e":58,"t":"term"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-55","no":"제55조","title":"등록사항정정대상토지의 관리","lines":[{"lvl":0,"label":"①","text":"지적소관청은 등록사항정정대상 토지관리대장을 작성ㆍ비치하고, 토지의 표시에 잘못이 있음을 발견한 때에는 그 내용을 별지 제8호 서식의 등록사항정정대상 토지관리대장에 기재하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"지적소관청은 제20조제8항에 따라 지적측량수행자로부터 토지의 표시에 잘못이 있음을 통보받은 때에는 지체 없이 그 내용을 조사하여 규칙 제94조에 따라 처리하고, 그 결과를 지적측량수행자에게 통지하여야 한다. 다만, 해당토지가 소유권분쟁으로 소송계류 중 일 때는 소송이 확정 될 때까지 지적공부정리를 보류할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":19,"e":26,"t":"org"},{"s":96,"e":103,"t":"org"}]},{"lvl":0,"label":"③","text":"지적소관청이 지적측량성과를 제시할 수 없어 등록사항정정대상토지로 결정한 경우에는 그 정정할 사항이 정리되기 전까지는 지적측량을 할 수 없다는 뜻을 토지소유자에게 통지하고 일반인에게 공고하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-56","no":"제56조","title":"행정구역경계의 설정","lines":[{"lvl":0,"label":"①","text":"행정관할구역이 변경되거나 새로운 행정구역이 설치되는 경우의 행정관할구역 경계선은 다음 각 호에 따라 등록한다.","blanks":[]},{"lvl":1,"label":"1.","text":"도로, 구거, 하천은 그 중앙","blanks":[]},{"lvl":1,"label":"2.","text":"산악은 분수선(分水線)","blanks":[{"s":4,"e":12,"t":"term"}]},{"lvl":1,"label":"3.","text":"해안은 만조시에 있어서 해면과 육지의 분계선","blanks":[]},{"lvl":0,"label":"②","text":"행정관할구역 경계를 결정할 때 공공시설의 관리 등의 이유로 제1항 각 호를 경계선으로 등록하는 것이 불합리한 경우에는 해당 시ㆍ군ㆍ구와 합의하여 행정구역경계를 설정할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"행정구역경계를 등록하여야 하는 경우에는 직접측량방법에 따라 등록하여야 한다. 다만 하천의 중앙 등 직접측량이 곤란한 경우에는 항공정사영상 또는 1/1000 수치지형도 등을 이용한 간접측량방법에 따라 등록할 수 있다.","blanks":[{"s":80,"e":86,"t":"num"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-57","no":"제57조","title":"행정구역변경","lines":[{"lvl":0,"label":"①","text":"행정구역 변경은 다음 각 호의 어느 하나에 해당하는 경우에 할 수 있다.","blanks":[]},{"lvl":1,"label":"1.","text":"행정구역명칭변경","blanks":[]},{"lvl":1,"label":"2.","text":"행정관할구역변경","blanks":[]},{"lvl":1,"label":"3.","text":"지번변경을 수반한 행정관할구역변경","blanks":[]},{"lvl":0,"label":"②","text":"지적소관청은 제1항제3호에 따른 지번변경을 수반한 행정관할구역변경은 시행일 이전에 행정구역변경 임시자료를 생성하여 시행일 전일에 일일마감을 완료한 후 처리한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-58","no":"제58조","title":"도시개발사업 등의 신고","lines":[{"lvl":0,"label":"①","text":"법 제86조제1항, 영 제83조제1항 및 「지적확정측량 대상 요건 및 토지개발사업 고시」에 따른 도시개발사업 등을 추진하는 경우 사업시행자는 그 사업의 착수(시행)ㆍ변경 및 완료사실을 규칙 제95조에 따라 지적소관청에 신고하여야 한다.","blanks":[{"s":24,"e":30,"t":"term"},{"s":115,"e":120,"t":"org"}]},{"lvl":0,"label":"②","text":"지적소관청은 제1항에 따른 도시개발사업 등의 착수(시행) 또는 변경신고가 있는 때에는 다음 각 호에 따라 처리하고, 서류의 확인이 완료된 때에는 지체 없이 지적공부에 그 사유를 정리하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":1,"label":"1.","text":"지번별조서와 지적공부등록사항과의 부합여부","blanks":[]},{"lvl":1,"label":"2.","text":"지번별조서ㆍ지적(임야)도와 사업계획도와의 부합여부","blanks":[]},{"lvl":1,"label":"3.","text":"착수(시행) 전 지목별 면적집계, 편입 면적집계 등의 정확여부","blanks":[]},{"lvl":0,"label":"③","text":"지적소관청은 규칙 제95조제1항에 따른 도시개발사업 등의 착수(시행) 또는 변경신고서를 접수할 때에는 사업시행지별로 부동산종합공부시스템에 등록하고, 접수순으로 사업시행지 번호를 부여받아야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"④","text":"지적소관청은 제3항에 따라 사업시행지 번호를 부여받은 때에는 지체 없이 사업시행지 번호별로 도시개발사업 등의 임시파일을 생성한 후 지번별조서를 출력하여 임시파일이 정확하게 생성되었는지 여부를 확인해야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-59","no":"제59조","title":"도시개발사업 등의 정리","lines":[{"lvl":0,"label":"①","text":"지적소관청은 지구계분할을 하는 경우에는 부동산종합공부시스템에 시행지 번호와 지구계 구분코드(지구내 0, 지구외 1)를 입력하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":55,"e":56,"t":"num"},{"s":62,"e":63,"t":"num"}]},{"lvl":0,"label":"②","text":"지적소관청은 규칙 제95조제2항에 따라 도시개발사업 등의 완료신고가 있는 때에는 다음 각 호에 따라 처리한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":1,"label":"1.","text":"다음 각 목의 사항을 확인할 것","blanks":[]},{"lvl":2,"label":"가.","text":"확정될 토지의 지번별조서와 면적측정부 및 환지계획서의 부합여부","blanks":[]},{"lvl":2,"label":"나.","text":"종전토지의 지번별조서와 지적공부등록사항 및 환지계획서의 부합여부","blanks":[]},{"lvl":2,"label":"다.","text":"측량결과도 또는 경계점좌표와 새로이 작성된 지적도와의 부합여부","blanks":[]},{"lvl":2,"label":"라.","text":"종전토지 소유명의인 동일여부 및 종전토지 등기부에 소유권등기 이외의 다른 등기사항이 없는지 여부","blanks":[]},{"lvl":2,"label":"마.","text":"그 밖에 필요한 사항","blanks":[]},{"lvl":1,"label":"2.","text":"제1호에 따른 서류의 확인이 완료된 때에는 확정될 토지의 지번별조서에 따라 토지대장을, 측량성과에 따라 경계점좌표등록부 등을 작성할 것","blanks":[]},{"lvl":1,"label":"3.","text":"제2호에 따라 토지대장에 등록하는 소유자의 성명 또는 명칭과 등록번호 및 주소는 환지계획서에 따르되, 소유자의 변동일자와 변동원인은 다음 각 목에 따라 정리할 것","blanks":[]},{"lvl":2,"label":"가.","text":"소유자변동일자 : 환지처분 또는 사업준공 인가일자(환지처분을 아니할 경우에만 해당한다)","blanks":[]},{"lvl":2,"label":"나.","text":"소유자변동원인 : 환지 또는 지적확정(환지처분을 아니하는 경우에만 해당한다)","blanks":[]},{"lvl":1,"label":"4.","text":"지적공부의 작성이 완료된 때에는 새로 지적공부가 확정 시행됨을 7일 이상 시ㆍ군ㆍ구 게시판 또는 홈페이지 등에 게시할 것","blanks":[{"s":35,"e":37,"t":"per"}]},{"lvl":1,"label":"5.","text":"도시개발사업 등의 완료로 인하여 폐쇄되는 지적공부는 폐쇄사유를 그 지적공부에 정리하고 별도로 영구 보관할 것","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-60","no":"제60조","title":"소유자정리","lines":[{"lvl":0,"label":"①","text":"대장의 소유자변동일자는 등기필통지서, 등기필증, 등기부 등본ㆍ초본 또는 등기관서에서 제공한 등기전산정보자료의 경우에는 등기접수일자로, 법 제84조제4항 단서의 미등기토지 소유자에 관한 정정신청의 경우와 법 제88조제2항에 따른 소유자등록신청의 경우에는 소유자정리결의일자로, 공유수면 매립준공에 따른 신규 등록의 경우에는 매립준공일자로 정리한다.","blanks":[]},{"lvl":0,"label":"②","text":"주소ㆍ성명ㆍ명칭의 변경 또는 경정 및 소유권이전 등이 같은 날짜에 등기가 된 경우의 지적공부정리는 등기접수 순서에 따라 모두 정리하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"소유자의 주소가 토지소재지와 같은 경우에도 등기부와 일치하게 정리한다. 다만, 등기관서에서 제공한 등기전산정보자료에 따라 정리하는 경우에는 등기전산정보자료에 따른다.","blanks":[]},{"lvl":0,"label":"④","text":"법 제88조제4항에 따라 지적소관청이 소유자에 관한 사항이 대장과 부합되지 아니하는 토지소유자를 정리할 때에는 제1항부터 제3항까지와 제65조제2항을 준용하며, 토지소유자 등 이해관계인이 등기부 등본ㆍ초본 등에 따라 소유자정정을 신청하는 경우에는 별지 제9호 서식의 소유자정정 신청서를 제출하여야 한다.","blanks":[{"s":14,"e":19,"t":"org"}]},{"lvl":0,"label":"⑤","text":"국토교통부장관은 등기관서로부터 법인 또는 재외국민의 부동산등기용등록번호 정정통보가 있는 때에는 정정 전 등록번호에 따라 토지소재를 조사하여 시ㆍ도지사에게 그 내용을 통지하여야 한다. 이 경우 시ㆍ도지사는 지체 없이 그 내용을 해당 지적소관청에 통지하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":78,"e":83,"t":"org"},{"s":107,"e":112,"t":"org"},{"s":129,"e":134,"t":"org"}]},{"lvl":0,"label":"⑥","text":"소유자등록사항 중 토지이동과 함께 소유자가 결정되는 신규 등록, 도시개발사업 등의 환지 등록시에는 토지이동업무 처리와 동시에 소유자를 정리하여야 한다.","blanks":[]}],"chap":"
