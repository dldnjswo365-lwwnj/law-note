제5장 지적공부 등의 정리"},{"id":"jbc-61","no":"제61조","title":"미등기토지의 소유자정정 등","lines":[{"lvl":0,"label":"①","text":"법 제84조제4항 단서에 따른 적용대상 토지는 미등기토지로서 소유자의 정정에 관한 사항과 토지조사당시에 사정 또는 재결 등에 따라 대장에 소유자는 등록하였으나, 소유자의 주소가 등록되어 있지 아니한 토지와 종전 「지적법시행령」(대통령령 제497호 1951년4월1일 제정)제3조제4호에 따라 국유지를 매각ㆍ교환 또는 양여하여 취득한 토지(이하 \"국유지의 취득\"이라 한다)의 소유자주소가 대장에 등록되어 있지 아니한 미등기토지로 한다. 다만, 1950.12.1 법률 제165호로 제정된 「지적법」(1975.12.31 법률 제2801호로 전문 개정되기 이전의 법률을 말한다)이 시행된 시기에 복구, 소유권확인청구의 소에 따른 확정판결이 있었거나, 이에 관한 소송이 법원에 진행 중인 토지는 제외한다.","blanks":[]},{"lvl":0,"label":"②","text":"미등기토지의 소유자주소를 대장에 등록하고자 하는 때에는 사정ㆍ재결 또는 국유지의 취득 당시 최초 주소를 등록한다.","blanks":[]},{"lvl":0,"label":"③","text":"법 제84조제4항 단서의 미등기토지 소유자에 관한 정정신청은 별지 제10호 서식에 따르며, 지적소관청은 미등기토지의 소유자정정 등에 관한 신청이 있는 때에는 14일 이내에 다음 각 호의 사항을 확인하여 처리하여야 하며, 별지 제11호의 조사서를 작성하여야 한다.","blanks":[{"s":51,"e":56,"t":"org"},{"s":88,"e":91,"t":"per"}]},{"lvl":1,"label":"1.","text":"적용대상토지 여부","blanks":[{"s":0,"e":9,"t":"item"}]},{"lvl":1,"label":"2.","text":"대장상 소유자와 가족관계등록부ㆍ제적부에 등재된 자와의 동일인 여부","blanks":[{"s":0,"e":36,"t":"item"}]},{"lvl":1,"label":"3.","text":"적용대상토지에 대한 확정판결이나 소송의 진행여부","blanks":[{"s":0,"e":26,"t":"item"}]},{"lvl":1,"label":"4.","text":"첨부서류의 적합여부","blanks":[{"s":0,"e":10,"t":"item"}]},{"lvl":1,"label":"5.","text":"그 밖에 지적소관청이 필요하다고 인정되는 사항","blanks":[{"s":5,"e":10,"t":"org"}]},{"lvl":0,"label":"④","text":"지적소관청은 제3항에 따른 조사를 할 때에는 기간을 정하여 신청인에게 필요한 자료의 제출 또는 보완을 요구할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"⑤","text":"지적소관청은 대장에 소유자의 주소 등을 등록한 때에는 지체 없이 신청인에게 그 내용을 통지하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-62","no":"제62조","title":"토지표시변경 등기촉탁","lines":[{"lvl":0,"label":"","text":"다른 법령에서 토지표시변경 등기촉탁에 관한 규정이 있는 경우에는 법 제89조제1항에 따른 등기촉탁을 하지 아니할 수 있다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-63","no":"제63조","title":"지적공부 등의 정리","lines":[{"lvl":0,"label":"①","text":"지적공부 등의 정리에 사용하는 문자ㆍ기호 및 경계는 따로 규정을 둔 사항을 제외하고 정리사항은 검은색, 도곽선과 그 수치 및 말소는 붉은색으로 한다.","blanks":[]},{"lvl":0,"label":"②","text":"지적확정측량ㆍ축척변경 및 지번변경에 따른 토지이동의 경우를 제외하고는 폐쇄 또는 말소된 지번을 다시 사용할 수 없다.","blanks":[{"s":0,"e":6,"t":"term"},{"s":7,"e":11,"t":"term"}]},{"lvl":0,"label":"③","text":"토지의 이동에 따른 도면정리는 예시 2의 도면정리 예시에 따른다. 이 경우 법 제2조제19호의 지적공부를 이용하여 지적측량을 한 때에는 측량성과파일에 따라 지적공부를 정리할 수 있다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-64","no":"제64조","title":"지적업무정리부 등의 정리","lines":[{"lvl":0,"label":"①","text":"지적소관청은 토지의 이동 또는 소유자의 변경 등으로 지적공부를 정리하고자 하는 때에는 별지 제12호 서식의 지적업무정리부와 별지 제13호 서식의 소유자정리부에 그 처리내용을 기재하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"②","text":"제1항의 따른 지적업무정리부는 토지의 이동 종목별로, 소유자정리부는 소유권보존ㆍ이전 및 기타로 구분하여 기재한다. 다만, 부동산종합공부시스템을 통하여 정보를 확인 및 출력할 수 있으면 지적업무정리부와 소유자정리부의 별도 기재 없이 출력물로 대체할 수 있다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-65","no":"제65조","title":"토지이동정리결의서 및 소유자정리결의서 작성","lines":[{"lvl":0,"label":"①","text":"규칙 제98조제2항에 따른 토지이동정리결의서는 다음 각 호와 같이 작성한다. 이 경우 증감란의 면적과 지번수는 늘어난 경우에는 (+)로, 줄어든 경우에는 (-)로 기재한다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적공부정리종목은 토지이동종목별로 구분하여 기재한다.","blanks":[]},{"lvl":1,"label":"2.","text":"토지소재ㆍ이동 전ㆍ이동 후 및 증감란은 읍ㆍ면ㆍ동 단위로 지목별로 작성한다.","blanks":[]},{"lvl":1,"label":"3.","text":"신규 등록은 이동후란에 지목ㆍ면적 및 지번수를, 증감란에는 면적 및 지번수를 기재한다.","blanks":[]},{"lvl":1,"label":"4.","text":"등록전환은 이동전란에 임야대장에 등록된 지목ㆍ면적 및 지번수를, 이동후란에 토지대장에 등록될 지목ㆍ면적 및 지번수를, 증감란에는 면적을 기재한다. 이 경우 등록전환에 따른 임야대장 및 임야도의 말소정리는 등록전환결의서에 따른다.","blanks":[{"s":0,"e":4,"t":"term"},{"s":87,"e":91,"t":"term"},{"s":114,"e":118,"t":"term"}]},{"lvl":1,"label":"5.","text":"분할 및 합병은 이동전ㆍ후란에 지목 및 지번수를, 증감란에 지번수를 기재한다.","blanks":[]},{"lvl":1,"label":"6.","text":"지목변경은 이동전란에 변경전의 지목ㆍ면적 및 지번수를, 이동후란에 변경후의 지목ㆍ면적 및 지번수를 기재한다.","blanks":[]},{"lvl":1,"label":"7.","text":"지적공부등록말소는 이동전ㆍ증감란에 지목ㆍ면적 및 지번수를 기재한다.","blanks":[]},{"lvl":1,"label":"8.","text":"축척변경은 이동전란에 축척변경 시행 전 토지의 지목ㆍ면적 및 지번수를, 이동후란에 축척이 변경된 토지의 지목ㆍ면적 및 지번수를 기재한다. 이 경우 축척변경완료에 따른 종전 지적공부의 폐쇄정리는 축척변경결의서에 따른다.","blanks":[{"s":0,"e":4,"t":"term"},{"s":12,"e":16,"t":"term"},{"s":82,"e":86,"t":"term"},{"s":108,"e":112,"t":"term"}]},{"lvl":1,"label":"9.","text":"등록사항정정은 이동전란에 정정전의 지목ㆍ면적 및 지번수를, 이동후란에 정정후의 지목ㆍ면적 및 지번수를, 증감란에는 면적 및 지번수를 기재한다.","blanks":[]},{"lvl":1,"label":"10.","text":"도시개발사업 등은 이동전란에 사업 시행 전 토지의 지목ㆍ면적 및 지번수를, 이동후란에 확정된 토지의 지목ㆍ면적 및 지번수를 기재한다. 이 경우 도시개발사업 등의 완료에 따른 종전 지적공부의 폐쇄정리는 도시개발사업 등 결의서에 따른다.","blanks":[]},{"lvl":0,"label":"②","text":"규칙 제98조제2항에 따른 소유자정리결의서는 다음 각 호와 같이 작성한다. 다만, 등기전산정보자료에 따라 소유자를 정리하는 경우에는 생략할 수 있다.","blanks":[]},{"lvl":1,"label":"1.","text":"토지소재ㆍ소유권보존ㆍ소유권이전 및 기타란은 읍ㆍ면ㆍ동별로 기재한다.","blanks":[]},{"lvl":1,"label":"2.","text":"정리일자는 소유자정리결의일부터 정리완료일까지 기재한다.","blanks":[]},{"lvl":1,"label":"3.","text":"정리자는 업무담당자로 하고 확인자는 지적업무 담당으로 한다.","blanks":[]},{"lvl":1,"label":"4.","text":"소유자정리결과에 따라 접수ㆍ정리ㆍ기정리 및 불부합통지로 구분 기재한다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-66","no":"제66조","title":"오기정정","lines":[{"lvl":0,"label":"","text":"지적공부정리중에 잘못 정리하였음을 즉시 발견하여 정정할 때에는 오기정정할 지적전산자료를 출력하여 지적전산자료책임관의 확인을 받은 후 정정하여야 한다. 다만, 잘못 정리하였음을 즉시 발견하지 못한 경우의 정정은 등록사항정정의 방법으로 하여야 한다.","blanks":[]}],"chap":"제5장 지적공부 등의 정리"},{"id":"jbc-67","no":"제67조","title":"도면 및 측량결과도용지의 규격","lines":[{"lvl":0,"label":"①","text":"측량결과도용지의 규격은 별표 6에 따른다. 다만, 동등 이상의 품질인 합성수지제 등을 사용하고자 할 때에는 국토교통부장관의 승인을 받아 사용할 수 있다.","blanks":[{"s":60,"e":67,"t":"org"}]},{"lvl":0,"label":"②","text":"측량결과도 예시는 별표 7부터 9까지와 같다.","blanks":[]}],"chap":"제6장 보칙"},{"id":"jbc-68","no":"제68조","title":"측량기기의 검사","lines":[{"lvl":0,"label":"","text":"지적측량(지적측량검사를 포함한다)을 할 때에는 영 제97조에 따라 사용하는 측량기기의 성능을 검사하여 사용하고, 정기적으로 이상 유무를 확인하여야 한다.","blanks":[]}],"chap":"제6장 보칙"},{"id":"jbc-69","no":"제69조","title":"권한을 표시하는 증표의 발급","lines":[{"lvl":0,"label":"①","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"②","text":"증표를 발급받은 자가 퇴직 또는 전출하는 경우에는 증표를 발급권자에게 즉시 반납하여야 하며, 증표 및 허가증의 유효기간이 경과한 경우에는 즉시 폐기하여야 한다.","blanks":[]}],"chap":"제6장 보칙"},{"id":"jbc-70","no":"제70조","title":"문서의 서식 및 예시","lines":[{"lvl":0,"label":"","text":"이 규정에 따른 서식 및 예시는 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"기준점측량부 보관대장: 별지 제1호서식","blanks":[]},{"lvl":1,"label":"2.","text":"지적도근점성과 가감지역 관리대장: 별지 제2호서식","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":1,"label":"3.","text":"위임장: 별지 제3호서식","blanks":[]},{"lvl":1,"label":"4.","text":"지적측량성과 검사정리부: 별지 제4호서식","blanks":[]},{"lvl":1,"label":"5.","text":"지적측량자료부: 별지 제5호서식","blanks":[]},{"lvl":1,"label":"6.","text":"지목변경(합병) 현지조사서: 별지 제6호서식","blanks":[]},{"lvl":1,"label":"7.","text":"지적정리결과 통보: 별지 제7호서식","blanks":[]},{"lvl":1,"label":"8.","text":"등록사항 정정대상 토지 관리대장: 별지 제8호서식","blanks":[]},{"lvl":1,"label":"9.","text":"토지(임야)대장 소유자정정 신청서: 별지 제9호서식","blanks":[]},{"lvl":1,"label":"10.","text":"미등기토지 소유자 주소정정 신청서: 별지 제10호서식","blanks":[]},{"lvl":1,"label":"11.","text":"미등기토지 소유자주소정정 등에 관한 조사서: 별지 제11호서식","blanks":[]},{"lvl":1,"label":"12.","text":"지적업무정리부: 별지 제12호서식","blanks":[]},{"lvl":1,"label":"13.","text":"소유자정리부: 별지 제13호서식","blanks":[]},{"lvl":1,"label":"14.","text":"지적측량결과도 작성 예시 목록(지적업무처리규정 제25조제1항 관련): 별첨 1","blanks":[]},{"lvl":1,"label":"15.","text":"도면정리 예시 목록(지적업무처리규정): 별첨 2","blanks":[]}],"chap":"제6장 보칙"},{"id":"jbc-71","no":"제71조","title":"재검토기한","lines":[{"lvl":0,"label":"","text":"국토교통부장관은 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 훈령에 대하여 2025년 9월 1일 기준으로 매 3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":68,"e":69,"t":"num"},{"s":80,"e":81,"t":"num"}]}],"chap":"제6장 보칙"}]},"jhj":{"id":"jhj","name":"지적확정측량규정","kind":"국토교통부예규","effective":"2025-08-29","promulgated":"2025-08-29","url":"https://www.law.go.kr/행정규칙/지적확정측량규정","short":"지적확정측량규정","annex":["[별지 1] 지적확정측량 업무집행계획서","[별지 2] 단일기준국 실시간 이동측량(Single_RTK)/다중기준국 실시간 이동측량(Network-RTK) 관측 기록부","[별지 3] 단일기준국 실시간 이동측량(Single_RTK)/다중기준국 실시간 이동측량(Network-RTK) 결과부","[별지 4] 실시간 이동측량의 좌표계산","[별지 5] 지적확정측량부","[별지 6] 예정지적좌표결과부"],"rule":true,"articles":[{"id":"jhj-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규정은 「공간정보의 구축 및 관리 등에 관한 법률」 제86조, 같은 법 시행령 제83조, 같은 법 시행규칙 제95조 및 「지적측량 시행규칙」 제22조에 따라 실시하는 지적확정측량에 필요한 측량방법 및 절차 등 세부사항을 규정함을 목적으로 한다.","blanks":[{"s":95,"e":101,"t":"term"}]}],"chap":"제1장 총칙"},{"id":"jhj-2","no":"제2조","title":"정의","lines":[{"lvl":0,"label":"","text":"이 규정에서 사용하는 용어의 정의는 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"지구계점\"이란 「공간정보의 구축 및 관리 등에 관한 법률」 제86조에 따른 도시개발사업 등의 사업계획에서 정한 사업지구를 구획하는 외곽 경계점을 말한다.","blanks":[]},{"lvl":1,"label":"2.","text":"\"가로중심점\"이란 공사가 완료된 현황을 측정하고 사업계획선과 대조하여 중심선을 구하고 상호 교차하여 구하는 점을 말한다.","blanks":[]},{"lvl":1,"label":"3.","text":"\"가구점\"이란 사업계획 및 현황측량성과에 의하여 결정된 가로의 각 조건에 따라 도로모퉁이 등 가구 변장 및 가구의 면적을 확정한 경계점을 말한다.","blanks":[]},{"lvl":1,"label":"4.","text":"\"필계점\"이란 일필지를 구획하는 경계점을 말한다.","blanks":[]},{"lvl":1,"label":"5.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"6.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"7.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"8.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"9.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"10.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"11.","text":"\"지구계 측량\"이란 제1호에 따라 지구계점을 결정하기 위해 실시하는 측량을 말한다.","blanks":[]},{"lvl":1,"label":"12.","text":"\"예정지적좌표\"란 「공간정보의 구축 및 관리 등에 관한 법률」 제86조에 따른 도시개발사업 등의 사업시행 초기에 실시하여 확정될 지구계점, 가구점 등을 수치화하여 산출한 좌표를 말한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jhj-3","no":"제3조","title":"다른 규정과의 관계","lines":[{"lvl":0,"label":"①","text":"이 규정은「공간정보의 구축 및 관리 등에 관한 법률」에 따른 지적확정측량(이하 \"확정측량\"이라 한다) 업무를 처리하는 경우에 적용한다.","blanks":[{"s":34,"e":40,"t":"term"}]},{"lvl":0,"label":"②","text":"확정측량의 방법과 절차는 「공간정보의 구축 및 관리 등에 관한 법률」(이하 \"법\"이라 한다), 같은 법 시행령 (이하 \"영\"이라 한다), 같은 법 시행규칙 (이하 \"규칙\"이라 한다), 「지적측량 시행규칙」, 「지적업무처리규정」 및 「GNSS에 의한 지적측량규정」에서 규정한 것을 제외하고는 이 규정에 따른다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jhj-4","no":"제4조","title":"확정측량 의뢰","lines":[{"lvl":0,"label":"①","text":"확정측량 의뢰인은 업무처리에 필요한 다음 각 호의 자료를 지적측량수행자에게 제출하여야 하며, 확정측량 의뢰에 대하여는 규칙 제25조를 따른다.","blanks":[{"s":32,"e":39,"t":"org"}]},{"lvl":1,"label":"1.","text":"사업인가서(사업허가서 등 이에 준하는 서류를 포함한다. 이하 같다) 및 사업계획도","blanks":[{"s":0,"e":45,"t":"item"}]},{"lvl":1,"label":"2.","text":"확정될 토지의 지번별 조서 및 종전 토지의 지번별 조서","blanks":[{"s":0,"e":30,"t":"item"}]},{"lvl":1,"label":"3.","text":"사업시행자가 사용한 기준점성과표 및 관측부","blanks":[{"s":0,"e":23,"t":"item"}]},{"lvl":1,"label":"4.","text":"지구계점ㆍ가로중심점ㆍ가구점 계산부 및 망도","blanks":[{"s":0,"e":23,"t":"item"}]},{"lvl":1,"label":"5.","text":"행정구역 변경에 관한 사항","blanks":[{"s":0,"e":14,"t":"item"}]},{"lvl":1,"label":"6.","text":"그 밖의 업무처리에 필요한 서류","blanks":[]},{"lvl":0,"label":"②","text":"지적측량수행자는 제1항에 따른 확정측량을 의뢰받은 때에는 규칙 제25조제2항에 따른 지적측량 수행계획서를 작성하여 사업지구 해당 지적소관청에 제출하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":72,"e":77,"t":"org"}]},{"lvl":0,"label":"③","text":"지적소관청은 제24조제2항의 기준에 따라 시ㆍ도지사 및 대도시(「지방자치법」 제175조에 따라 서울특별시ㆍ광역시 및 특별자치시를 제외한 인구 50만 이상의 시의 시장을 말한다. 이하 같다) 시장이 확정측량 검사를 실시할 경우 지적측량수행자로부터 제출받은 지적측량 수행계획서를 지체없이 시ㆍ도지사 및 대도시 시장에게 송부하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":23,"e":28,"t":"org"},{"s":79,"e":82,"t":"num"},{"s":126,"e":133,"t":"org"},{"s":159,"e":164,"t":"org"},{"s":167,"e":173,"t":"org"}]},{"lvl":0,"label":"④","text":"지적측량수행자가 제2항에 따른 지적측량 수행계획서를 제출하는 때에는 별지 제1호서식의 업무집행계획서에 다음 각 호의 사항을 포함하여 함께 제출하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":1,"label":"1.","text":"측량의 목적과 대상지역 및 업무량","blanks":[{"s":0,"e":18,"t":"item"}]},{"lvl":1,"label":"2.","text":"측량소요 기간과 측량팀의 편성 및 인력투입 계획","blanks":[{"s":0,"e":26,"t":"item"}]},{"lvl":1,"label":"3.","text":"기초측량 및 세부측량 실시 방법","blanks":[{"s":0,"e":17,"t":"item"}]},{"lvl":1,"label":"4.","text":"그 밖의 필요한 사항","blanks":[]}],"chap":"제2장 확정측량 의뢰 및 계획수립"},{"id":"jhj-5","no":"제5조","title":"계획수립 및 준비","lines":[{"lvl":0,"label":"①","text":"지적측량수행자는 사업지역에 대하여 토지소재, 지구명, 면적, 업무량, 작업여건, 측량기간, 인원, 장비 등을 고려하여 업무계획을 수립하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"②","text":"지적측량수행자는 제1항에 따른 업무계획을 수립하는 경우에는 현지답사를 통하여 사업계획도, 지구계 현황, 가로망 상황, 기준점과의 시통 여부 등 확정측량에 필요한 사항을 조사한다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"③","text":"지적측량수행자는 업무처리과정에서 발생될 수 있는 다음 각 호의 사항을 시ㆍ도지사, 대도시시장 및 지적소관청(이하 검사기관이라 한다)과 협의하여 업무계획에 반영할 수 있다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":39,"e":44,"t":"org"},{"s":54,"e":59,"t":"org"}]},{"lvl":1,"label":"1.","text":"측량원점 등 기준에 관한 사항","blanks":[{"s":0,"e":16,"t":"item"}]},{"lvl":1,"label":"2.","text":"사용하여야 할 국가기준점 및 지적기준점에 관한 사항","blanks":[{"s":0,"e":28,"t":"item"}]},{"lvl":1,"label":"3.","text":"도면의 축척 결정","blanks":[{"s":0,"e":9,"t":"item"}]},{"lvl":1,"label":"4.","text":"국유지ㆍ공유지 관리에 따른 필지 구획에 관한 사항","blanks":[{"s":0,"e":27,"t":"item"}]},{"lvl":1,"label":"5.","text":"그 밖의 업무계획수립에 필요한 사항","blanks":[]}],"chap":"제2장 확정측량 의뢰 및 계획수립"},{"id":"jhj-6","no":"제6조","title":"지적기준점의 측량","lines":[{"lvl":0,"label":"①","text":"지적기준점의 측량계획은 「지적업무처리규정」 제9조에 따른다.","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":0,"label":"②","text":"지적기준점의 확인 및 선점 등에 관하여는 「지적업무처리규정」 제10조에 따른다.","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":0,"label":"③","text":"경위의측량방법에 의할 경우 사업계획도를 활용하여 지적기준점 설치 계획과 망구성을 하며 가능한 다각망도선법으로 망구성을 한다. 단, 다중기준국 실시간 이동측량으로 기준점측량을 실시하는 경우에는 망구성을 생략한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":27,"e":32,"t":"term"},{"s":52,"e":58,"t":"term"},{"s":83,"e":87,"t":"term"}]}],"chap":"제3장 지적기준점 측량"},{"id":"jhj-7","no":"제7조","title":"지적기준점 측량방법","lines":[{"lvl":0,"label":"①","text":"지적기준점의 좌표는 세계좌표(「GNSS에 의한 지적측량규정」 제3조제2호에 따른 좌표를 말한다. 이하 \"세계좌표\"라 한다)로 산출한다. 다만, 사업지구계 결정을 위하여 필요한 경우 지역좌표(「GNSS에 의한 지적측량규정」 제3조제4호에 따른 좌표를 말한다. 이하 \"지역좌표\"라 한다) 산출을 병행할 수 있다.","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":0,"label":"②","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"③","text":"지적기준점의 측량, 방법 및 계산은 「지적측량 시행규칙」 제8조부터 제15조, 「GNSS에 의한 지적측량규정」 제7조부터 제10조 및 제12조부터 제15조까지 따른다.","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":0,"label":"④","text":"지적기준점 및 지적공부상 좌표의 산출은 소수점 이하 셋째자리까지 하고 결정은 소수점 이하 둘째자리까지 한다.","blanks":[{"s":0,"e":5,"t":"term"}]}],"chap":"제3장 지적기준점 측량"},{"id":"jhj-8","no":"제8조","title":"지적도근점의 성과확인","lines":[{"lvl":0,"label":"","text":"지적도근점의 성과확인은 「지적업무처리규정」 제13조에 따른다.","blanks":[{"s":0,"e":5,"t":"term"}]}],"chap":"제3장 지적기준점 측량"},{"id":"jhj-9","no":"제9조","title":"경위의측량 기준","lines":[{"lvl":0,"label":"①","text":"경위의측량방법(전자평판측량방법을 포함한다)에 따른 세부측량의 기준과 관측 및 계산은 「지적측량 시행규칙」 제18조제9항 및 제10항에 따른다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":8,"e":14,"t":"term"}]},{"lvl":0,"label":"②","text":"삭제","deleted":true,"blanks":[]}],"chap":"제4장 세부측량"},{"id":"jhj-10","no":"제10조","title":"지적위성측량 기준","lines":[{"lvl":0,"label":"①","text":"단일기준국 실시간 이동측량(Single-RTK)에 의한 세부측량은 「GNSS에 의한 지적측량규정」 제11조제3항에 따른다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":14,"t":"term"}]},{"lvl":0,"label":"②","text":"다중기준국 실시간 이동측량(Network-RTK)에 의한 세부측량은 「GNSS에 의한 지적측량규정」 제11조제4항에 따른다.","blanks":[{"s":10,"e":14,"t":"term"}]},{"lvl":0,"label":"③","text":"단일기준국 실시간 이동측량(Single-RTK) 및 다중기준국 실시간 이동측량(Network-RTK)으로 세부측량을 할 경우의 기준은 「GNSS에 의한 지적측량규정」 제11조제2항에 따른다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":14,"t":"term"},{"s":39,"e":43,"t":"term"}]},{"lvl":0,"label":"④","text":"단일기준국 실시간 이동측량(Single-RTK) 및 다중기준국 실시간 이동측량(Network-RTK)에 의한 경우 제3항의 조건을 만족하지 못하거나 「GNSS에 의한 지적측량규정」 제11조제5항에 해당되는 경우에는 측량방법을 달리하여 세부측량을 실시하여야 한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":14,"t":"term"},{"s":39,"e":43,"t":"term"}]},{"lvl":1,"label":"1.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"2.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"3.","text":"삭제","deleted":true,"blanks":[]},{"lvl":1,"label":"4.","text":"삭제","deleted":true,"blanks":[]},{"lvl":0,"label":"⑤","text":"필계점의 좌표산출은 소수점 이하 셋째자리까지 하고 결정은 소수점 이하 둘째자리까지 한다.","blanks":[]},{"lvl":0,"label":"⑥","text":"단일기준국 실시간 이동측량(Single-RTK) 및 다중기준국 실시간 이동측량(Network-RTK)에 의한 좌표계산은 별지 제4호서식에 따라 계산한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":14,"t":"term"},{"s":39,"e":43,"t":"term"}]}],"chap":"제4장 세부측량"},{"id":"jhj-11","no":"제11조","title":"측량준비 파일의 작성","lines":[{"lvl":0,"label":"","text":"지구계 측량을 실시할 경우 지적전산파일을 이용하여 「지적측량 시행규칙」 제17조에 따라 측량준비도 또는 측량준비 파일을 작성한다.","blanks":[]}],"chap":"제5장 지구계 측량"},{"id":"jhj-12","no":"제12조","title":"지구계 측량","lines":[{"lvl":0,"label":"①","text":"사업시행자는 지구계점을 설치하기 위해 다음 각 호의 지구계 측량을 실시하여야 한다. 이 경우 세부측량방법은 「지적측량 시행규칙」 제18조에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"1필지의 일부가 사업지구에 포함되는 경우 분할측량","blanks":[]},{"lvl":1,"label":"2.","text":"분할측량을 수반하지 않고 1필지 토지의 경계가 지구계를 형성하는 경우 경계복원측량","blanks":[{"s":39,"e":45,"t":"term"}]},{"lvl":1,"label":"3.","text":"사업계획 인가ㆍ허가를 위하여 고시 전에 지구계 확인이 필요한 경우 경계복원측량 및 지적현황측량","blanks":[{"s":37,"e":43,"t":"term"},{"s":46,"e":52,"t":"term"}]},{"lvl":1,"label":"4.","text":"제1호에서부터 제3호의 측량을 수행하기 위해 필요한 지적기준점 측량","blanks":[{"s":29,"e":34,"t":"term"}]},{"lvl":0,"label":"②","text":"지구계 측량은 지적기준점을 사용하여 기지경계선과 지구계점을 측정하고 그 부합여부를 도해측량방법으로 결정한다. 단 기존 경계점좌표등록부 지역을 재확정 측량하는 경우에는 수치측량방법으로 결정한다.","blanks":[{"s":8,"e":13,"t":"term"}]},{"lvl":0,"label":"③","text":"예정지적좌표 작성은 사업승인 및 시공 등을 위하여 확정측량 이전에 실시하여야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"도시개발사업 등의 변경으로 사업지구 외곽경계가 변경되는 경우 변경되는 필지에 대하여 지구계 측량을 추가로 실시하여야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"지구계 측량의 성과검사 방법은 「지적측량 시행규칙」 제28조 및 「지적업무처리규정」 제27조를 따른다.","blanks":[]}],"chap":"제5장 지구계 측량"},{"id":"jhj-13","no":"제13조","title":"지구계점 설치","lines":[{"lvl":0,"label":"","text":"지구계 측량성과에 따라 사업시행자는 사업계획에 따른 사업지구 경계에 대하여 제12조 제1항 각 호에 따른 지적측량을 통하여 구조물 또는 영 제55조제3항에 따른 경계점표지를 설치하여야 하며, 지적측량수행자는 이를 확인하여 조정이 필요한 경우 사업시행자와 협의하여야 한다.","blanks":[{"s":107,"e":114,"t":"org"}]}],"chap":"제5장 지구계 측량"},{"id":"jhj-14","no":"제14조","title":"확정측량의 경계결정","lines":[{"lvl":0,"label":"①","text":"확정측량의 경계는 영 제55조제5항에 따른다.","blanks":[]},{"lvl":0,"label":"②","text":"영 제55조제5항에 따라 통지를 받은 사업시행자는 15일 이내에 사업변경 또는 재시공 계획 등을 수립하여 관련부서와 협의 등의 조치를 하고 지적측량수행자에게 회신하여야 한다.","blanks":[{"s":28,"e":31,"t":"per"},{"s":78,"e":85,"t":"org"}]},{"lvl":0,"label":"③","text":"사업지역내의 제척 토지 또는 존치 부지 등은 축척변경을 할 수 있다. 이 경우 결과부는 별지 제5호서식에 포함하여 작성하고, 결과도와 성과도는 축척변경과 확정측량으로 분리하여 작성하여야 한다.","blanks":[{"s":25,"e":29,"t":"term"},{"s":80,"e":84,"t":"term"}]}],"chap":"제6장 지적확정측량"},{"id":"jhj-15","no":"제15조","title":"가로중심점 계산","lines":[{"lvl":0,"label":"","text":"공사가 완료된 현황선과 사업계획도를 확인하고, 도로 등 공공용지 확보와 계획조건이 부합하도록 가로중심점을 결정한다.","blanks":[]}],"chap":"제6장 지적확정측량"},{"id":"jhj-16","no":"제16조","title":"가구점의 확정","lines":[{"lvl":0,"label":"①","text":"도로모퉁이의 길이 등에 관하여는 「도시ㆍ군계획시설의 결정ㆍ구조 및 설치기준에 관한 규칙」 제14조의 기준에 따르며, 지적측량수행자는 설계 및 시공의 적합 여부를 확인하여야 한다.","blanks":[{"s":65,"e":72,"t":"org"}]},{"lvl":0,"label":"②","text":"지적기준점을 기준으로 하여 측량한 시공 현황과 사업계획에 따라 가로중심점 좌표를 산출한 후 가구정점(직사각형 가구의 4개 모서리의 꼭짓점을 말한다)을 구하여 가구점을 확정한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":65,"e":67,"t":"num"}]},{"lvl":0,"label":"③","text":"가구의 경계가 곡선을 이루고 있을 때에는「지적측량 시행규칙」 제18조제9항제3호에도 불구하고 곡선 중앙 종거의 길이는 10㎝ 이내로 결정할 수 있다.","blanks":[{"s":66,"e":69,"t":"num"}]}],"chap":"제6장 지적확정측량"},{"id":"jhj-17","no":"제17조","title":"필계점 측량","lines":[{"lvl":0,"label":"①","text":"필계점에 대한 경계점 표지의 설치는 사업시행자가 사업계획에 따라 설치하여야 한다. 다만, 사업시행자가 경계점 표지를 직접 설치하기 어려울 경우에는 지적측량수행자에게 위탁할 수 있다.","blanks":[{"s":82,"e":89,"t":"org"}]},{"lvl":0,"label":"②","text":"확정된 가구별로 필계점을 계산하며, 현장에서의 공사 현황이 사업계획과 부합되지 않거나 구조물 또는 건물 등이 있을 경우에는 영 제55조의 지상 경계의 결정 기준에 따라 사업시행자와의 협의를 거쳐 경계선을 조정할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"확정 필지 경계점은 사업계획도와 공사 준공선의 부합여부를 확인하여 결정한다.","blanks":[]}],"chap":"제6장 지적확정측량"},{"id":"jhj-18","no":"제18조","title":"필계점 확정","lines":[{"lvl":0,"label":"①","text":"산출된 각 필계점은 가구선과의 교차계산을 한 후 결정한다.","blanks":[]},{"lvl":0,"label":"②","text":"경계점좌표등록부를 갖춰 두는 지역에서의 확정측량을 실시할 경우 경계점의 관측 및 산출방법은 「지적측량 시행규칙」 제18조제9항부터 제12항에 따라 실시한다.","blanks":[]}],"chap":"제6장 지적확정측량"},{"id":"jhj-19","no":"제19조","title":"지번부여 및 지목설정","lines":[{"lvl":0,"label":"①","text":"지번의 구성 및 부여방법에 대하여는 영 제56조에 따른다.","blanks":[]},{"lvl":0,"label":"②","text":"부번은 지번의 진행방향에 따라 부여하되 도곽이 다른 경우에도 같은 본번에 부번을 차례로 부여한다.","blanks":[]},{"lvl":0,"label":"③","text":"도시개발사업 등이 준공되기 전에 지번을 부여하는 경우에는 규칙 제61조에 따른다.","blanks":[]},{"lvl":0,"label":"④","text":"지목의 설정방법은 영 제59조를 준용하여 설정하되 토지의 이용이 일시적인 경우 사업계획에 따라 지목을 설정할 수 있다.","blanks":[]},{"lvl":0,"label":"⑤","text":"삭제","deleted":true,"blanks":[]}],"chap":"제6장 지적확정측량"},{"id":"jhj-20","no":"제20조","title":"면적산출 및 결정","lines":[{"lvl":0,"label":"","text":"지구계 및 필지면적은 세계좌표를 기준으로 좌표면적 계산법으로 계산하며, 「지적측량 시행규칙」 제20조제1항제2호에 따라 결정한다.","blanks":[]}],"chap":"제6장 지적확정측량"},{"id":"jhj-21","no":"제21조","title":"지적확정측량부","lines":[{"lvl":0,"label":"①","text":"지적측량수행자가 작성하여야 할 지적확정측량부는 별지 제5호서식과 같다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":17,"e":23,"t":"term"}]},{"lvl":0,"label":"②","text":"지적확정측량부는 세계좌표를 기준으로 작성한다. 다만, 종전 토지 관련사항은 지역좌표를 기준으로 작성할 수 있다.","blanks":[{"s":0,"e":6,"t":"term"}]}],"chap":"제7장 측량성과 작성"},{"id":"jhj-22","no":"제22조","title":"확정측량 성과도 작성","lines":[{"lvl":0,"label":"","text":"확정측량 성과도는 명칭 앞에 \"(좌표)\"라 기재하고, 경계점간 계산거리를 기재하여야 한다.","blanks":[]}],"chap":"제7장 측량성과 작성"},{"id":"jhj-23","no":"제23조","title":"확정측량 결과도 작성","lines":[{"lvl":0,"label":"①","text":"확정측량 결과도에는 다음 각 호의 사항이 포함되어야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"측량결과도의 제명ㆍ축척 및 색인도","blanks":[{"s":0,"e":18,"t":"item"}]},{"lvl":1,"label":"2.","text":"확정된 필지의 경계(경계점좌표를 전개하여 연결한 선)ㆍ지번 및 지목","blanks":[{"s":0,"e":37,"t":"item"}]},{"lvl":1,"label":"3.","text":"경계점 간 계산거리 및 실측거리. 다만, 경지정리지역에서는 실측거리 기재를 생략 할 수 있다.","blanks":[],"imgs":["155973083"]},{"lvl":1,"label":"4.","text":"지적기준점 및 그 번호와 지적기준점 간 방위각 및 거리","blanks":[{"s":0,"e":30,"t":"item"}]},{"lvl":1,"label":"5.","text":"행정구역선과 그 명칭","blanks":[{"s":0,"e":11,"t":"item"}]},{"lvl":1,"label":"6.","text":"도곽선과 그 수치","blanks":[{"s":0,"e":9,"t":"item"}]},{"lvl":1,"label":"7.","text":"확정 경계선에 지상구조물 등이 걸리는 경우에는 그 위치현황","blanks":[]},{"lvl":1,"label":"8.","text":"측량 및 검사연월일, 측량자 및 검사자의 성명ㆍ소속ㆍ자격등급","blanks":[{"s":0,"e":10,"t":"item"},{"s":12,"e":33,"t":"item"}]},{"lvl":0,"label":"②","text":"제1항에 따라 확정측량 결과도를 작성하는 때에는 제1항제1호ㆍ제2호, 제4호중 지적기준점 및 그 번호ㆍ제5호와 제8호는 검은색으로, 제1항제4호중 지적기준점 간 방위각 및 거리와 제6호는 붉은색으로, 그 밖의 사항은 검은색으로 표시한다.","blanks":[{"s":44,"e":49,"t":"term"},{"s":82,"e":87,"t":"term"}]},{"lvl":0,"label":"③","text":"제1항 및 제2항 이외의 측량결과도 및 측량계산부의 작성은 「지적측량 시행규칙」 제26조에 따라 작성한다.","blanks":[]}],"chap":"제7장 측량성과 작성"},{"id":"jhj-24","no":"제24조","title":"성과검사","lines":[{"lvl":0,"label":"①","text":"지적측량수행자는 지적기준점측량을 완료하면 지적기준점성과, 기지경계선의 부합여부 등을 확인한 측량결과도, 지적삼각점측량부 등 관련서류를 첨부하여 「지적측량 시행규칙」 제3조에 따른 지적기준점 성과 관리기관에 측량성과검사를 요청한다. 다만, 사전 협의가 있는 경우에는 기준점성과와 세부측량성과를 동시에 검사요청 할 수 있다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":9,"e":14,"t":"term"},{"s":23,"e":28,"t":"term"},{"s":58,"e":66,"t":"term"},{"s":100,"e":105,"t":"term"}]},{"lvl":0,"label":"②","text":"확정측량 성과 검사기관은 지역 및 확정측량 사업지구 면적에 따라 다음의 표와 같이 구분하며, 지적측량수행자가 다음의 표에 따라 확정측량 성과 검사를 요청할 때에 제출할 서류는 다음 각 호와 같다. 다만, 도로, 철도 등 2개 이상 지자체에 걸친 확정측량 사업지구는 시ㆍ도지사가 일괄 검사한다.","blanks":[{"s":52,"e":59,"t":"org"},{"s":123,"e":125,"t":"num"},{"s":148,"e":153,"t":"org"}],"patch":"img","patchSrc":["원문 이미지를 보고 글자로 옮겼어요(두 번 판독해 일치). 숫자는 아래 ‘원문 이미지’와 대조해 주세요."],"imgs":["155973085"],"table":[[{"text":"지역 구분","blanks":[],"rs":2,"th":true},{"text":"검사 기관 구분","blanks":[],"cs":2,"th":true}],[{"text":"지적소관청","blanks":[],"th":true},{"text":"시·도지사, 대도시시장","blanks":[],"th":true}],[{"text":"시·구 지역","blanks":[]},{"text":"20,000㎡ 이하","blanks":[{"s":0,"e":7,"t":"num"}]},{"text":"20,000㎡ 초과","blanks":[{"s":0,"e":7,"t":"num"}]}],[{"text":"군 지역","blanks":[]},{"text":"30,000㎡ 이하","blanks":[{"s":0,"e":7,"t":"num"}]},{"text":"30,000㎡ 초과","blanks":[{"s":0,"e":7,"t":"num"}]}]]},{"lvl":1,"label":"1.","text":"사업인가서 및 사업계획서","blanks":[]},{"lvl":1,"label":"2.","text":"환지처분과 같은 효력이 있는 고시된 환지계획서 다만, 환지를 수반하지 아니하는 사업인 경우에는 사업의 완료를 증명하는 서류","blanks":[]},{"lvl":1,"label":"3.","text":"토지이동정리파일","blanks":[]},{"lvl":1,"label":"4.","text":"별지 제5호서식의 지적확정측량부 등","blanks":[{"s":10,"e":16,"t":"term"}]},{"lvl":0,"label":"③","text":"검사요청을 받은 검사기관은 지적측량성과검사정리부에 그 내용을 기재한 후 확정측량 성과검사를 실시한다.","blanks":[]},{"lvl":0,"label":"④","text":"확정측량 성과의 검사방법 및 절차는 「지적측량 시행규칙」 제28조, 「지적업무처리규정」 제30조 및 제31조에 따르며, 다음 각 호의 사항을 확인하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"가구계점 및 각 필계점 계산의 적정 여부","blanks":[{"s":0,"e":22,"t":"item"}]},{"lvl":1,"label":"2.","text":"좌표면적 계산의 적정 여부","blanks":[{"s":0,"e":14,"t":"item"}]},{"lvl":1,"label":"3.","text":"지번 및 지목설정의 적정 여부","blanks":[{"s":0,"e":16,"t":"item"}]},{"lvl":0,"label":"⑤","text":"확정측량 기간이 240일 이상일 경우에는 규칙 제25조제4항에도 불구하고 측량검사 기간을 60일 이내로 한다.","blanks":[{"s":9,"e":13,"t":"per"},{"s":50,"e":53,"t":"per"}]}],"chap":"제8장 측량성과 검사"},{"id":"jhj-25","no":"제25조","title":"확정측량 성과검사 기준","lines":[{"lvl":0,"label":"①","text":"측량성과 검사대상은 지적기준점, 지구계점 및 필계점으로 한다.","blanks":[{"s":11,"e":16,"t":"term"}]},{"lvl":0,"label":"②","text":"확정측량 성과검사는 측량에 사용한 기지점과 신설점, 신설점 상호간의 실측거리에 의하여 비교하여야 하며 검사성과의 연결교차 허용기준은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적삼각점 : ±20㎝ 이내","blanks":[{"s":0,"e":5,"t":"term"},{"s":8,"e":12,"t":"num"}]},{"lvl":1,"label":"2.","text":"지적삼각보조점 : ±25㎝ 이내","blanks":[{"s":0,"e":7,"t":"term"},{"s":10,"e":14,"t":"num"}]},{"lvl":1,"label":"3.","text":"지적도근점 (도선을 달리하여 검사) : ±15㎝ 이내","blanks":[{"s":0,"e":5,"t":"term"},{"s":22,"e":26,"t":"num"}]},{"lvl":1,"label":"4.","text":"경계점 : ±10㎝ 이내","blanks":[{"s":6,"e":10,"t":"num"}]}],"chap":"제8장 측량성과 검사"},{"id":"jhj-26","no":"제26조","title":"현지 측량성과 검사 방법","lines":[{"lvl":0,"label":"①","text":"확정측량에 의한 세계좌표의 성과검사는 현지측량 검사를 원칙으로 하며, 검사방법은 경위의측량방법 또는 위성측량방법으로 한다.","blanks":[{"s":45,"e":50,"t":"term"},{"s":56,"e":60,"t":"term"}]},{"lvl":0,"label":"②","text":"검사기관은 현지측량 검사 시 다음 각 호의 사항을 확인하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"영 제55조에 따른 지상경계결정 기준과의 부합 여부","blanks":[{"s":0,"e":28,"t":"item"}]},{"lvl":1,"label":"2.","text":"필계점의 각, 거리, 좌표 등 측정의 적정성 여부","blanks":[{"s":0,"e":6,"t":"item"},{"s":8,"e":10,"t":"item"},{"s":12,"e":27,"t":"item"}]},{"lvl":1,"label":"3.","text":"건축물 등 구조물의 지구계 저촉여부","blanks":[{"s":0,"e":19,"t":"item"}]},{"lvl":1,"label":"4.","text":"확정측량 결과도의 지구계선과 지상 경계의 부합여부","blanks":[{"s":0,"e":27,"t":"item"}]},{"lvl":1,"label":"5.","text":"지상경계의 위치표시 등에 관하여 법 제65조제1항의 기준과의 부합여부","blanks":[{"s":0,"e":38,"t":"item"}]}],"chap":"제8장 측량성과 검사"},{"id":"jhj-27","no":"제27조","title":"확정측량 성과도 발급 등","lines":[{"lvl":0,"label":"①","text":"시ㆍ도지사 및 대도시시장이 확정측량 성과검사를 완료하였을 때에는 그 결과를 지적소관청에게 통지하여야 하며, 확정측량 성과도 발급은 「지적측량 시행규칙」 제28조제2항에 따른다. 다만 확정측량 성과도를 발급함에 있어 성과검사결과 보완사항이 있는 때에는 보완조치 후 확정측량 성과도를 발급하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":42,"e":47,"t":"org"}]},{"lvl":0,"label":"②","text":"지적측량수행자는 지적소관청으로부터 예정지적좌표 결과부 또는 확정측량 성과도를 발급받은 경우 지체없이 측량의뢰인에게 교부한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":9,"e":14,"t":"org"},{"s":56,"e":61,"t":"org"}]}],"chap":"제8장 측량성과 검사"},{"id":"jhj-28","no":"제28조","title":"지적공부 정리","lines":[{"lvl":0,"label":"","text":"지적공부정리는 영 제84조와 「지적업무처리규정」 제58조 및 제59조를 따른다.","blanks":[]}],"chap":"제8장 측량성과 검사"},{"id":"jhj-29","no":"제29조","title":"재검토기한","lines":[{"lvl":0,"label":"","text":"국토교통부장관은 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2025년 9월 1일 기준으로 매 3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":68,"e":69,"t":"num"},{"s":80,"e":81,"t":"num"}]}],"chap":"제8장 측량성과 검사"}]},"jjs":{"id":"jjs","name":"지적재조사 측량규정","kind":"국토교통부고시","effective":"2025-08-29","promulgated":"2025-08-29","url":"https://www.law.go.kr/행정규칙/지적재조사 측량규정","short":"지적재조사 측량규정","annex":["[별표 1] 정지측량(staic)의 기선해석 및 점검","[별표 2] 경계설정 예시","[별표 3] 경계점표지의 규격과 재질","[별표 4] 성과작성 목록","[별표 5] 측량성과파일 코드 일람표","[별지 1] 지적재조사측량 수행계획서","[별지 2] 지적위성측량부","[별지 3] 지적재조사측량부"],"rule":true,"articles":[{"id":"jjs-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규정은 「지적재조사에 관한 특별법」 제11조 및 같은 법 시행규칙 제5조에서 국토교통부장관에게 위임한 사항과 그 시행에 필요한 세부적인 절차를 정함을 목적으로 한다.","blanks":[{"s":45,"e":52,"t":"org"}]}],"chap":"제1장 총칙"},{"id":"jjs-2","no":"제2조","title":"정의","lines":[{"lvl":0,"label":"","text":"이 규정에서 사용하는 용어의 정의는 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"지적위성측량\"이란 GNSS(Global Navigation Satellite System)측량기를 사용하여 실시하는 지적측량을 말한다.","blanks":[{"s":3,"e":7,"t":"term"}]},{"lvl":1,"label":"2.","text":"\"다중기준국실시간이동측량(Network-RTK)\"이란 3점 이상의 위성기준점을 이용하여 산출한 보정정보와 이동국이 수신한 GNSS 반송파 위상 신호를 실시간 기선해석을 통해 이동국의 위치를 결정하는 측량을 말한다.","blanks":[{"s":6,"e":13,"t":"term"},{"s":30,"e":32,"t":"num"},{"s":37,"e":42,"t":"term"}]},{"lvl":1,"label":"3.","text":"\"단일기준국실시간이동측량(Single-RTK)\"이란 기지점(통합기준점 및 지적기준점)에 설치한 GNSS 측량기로부터 수신된 보정정보와 이동국이 수신한 GNSS 반송파 위상 신호를 실시간 기선해석을 통해 이동국의 위치를 결정하는 측량을 말한다.","blanks":[{"s":1,"e":6,"t":"term"},{"s":6,"e":13,"t":"term"},{"s":33,"e":38,"t":"term"},{"s":41,"e":46,"t":"term"}]},{"lvl":1,"label":"4.","text":"\"정지측량(Static)\"이란 위성수신기를 관측지점에 일정시간동안 고정하여 연속적으로 위성데이터를 취득한 후 기선해석 및 조정계산을 수행하는 측량방법을 말한다.","blanks":[{"s":1,"e":5,"t":"term"}]},{"lvl":1,"label":"5.","text":"\"토털스테이션측량\"이란 기지점(통합기준점 및 지적기준점)에 설치한 토털스테이션에 의하여 기지점과 경계점간의 수평각, 연직각 및 거리를 측정하여 소구점의 위치를 결정하는 측량을 말한다.","blanks":[{"s":17,"e":22,"t":"term"},{"s":25,"e":30,"t":"term"}]},{"lvl":1,"label":"6.","text":"\"세션\"이란 당해 측량을 위하여 일정한 관측간격을 두고 GNSS측량기를 동시에 설치하여 지적위성측량을 실시하는 작업 단위를 말한다.","blanks":[{"s":51,"e":55,"t":"term"}]},{"lvl":1,"label":"7.","text":"\"기선해석\"이란 2대 이상의 고정된 측량기 사이의 3차원 기선벡터(△X, △Y,△Z)를 결정하는 것을 말한다.","blanks":[{"s":9,"e":10,"t":"num"}]},{"lvl":1,"label":"8.","text":"\"라이넥스(RINEX)\"란 GNSS관측데이터의 저장과 교환에 사용되는 세계 표준의 GNSS데이터 자료형식을 말한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jjs-3","no":"제3조","title":"다른 규정과의 관계","lines":[{"lvl":0,"label":"","text":"이 규정은 지적재조사측량에 관하여 다른 규정에 우선하여 적용한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"jjs-4","no":"제4조","title":"측량방법","lines":[{"lvl":0,"label":"①","text":"「지적재조사에 관한 특별법 시행규칙」(이하 \"규칙\"이라 한다) 제5조에 따라 지적기준점 및 경계점을 측량하는 경우 다음 각 호의 방법에 의한다.","blanks":[{"s":43,"e":48,"t":"term"}]},{"lvl":1,"label":"1.","text":"정지측량","blanks":[{"s":0,"e":4,"t":"term"}]},{"lvl":1,"label":"2.","text":"다중기준국실시간이동측량","blanks":[{"s":5,"e":12,"t":"term"}]},{"lvl":1,"label":"3.","text":"단일기준국실시간이동측량","blanks":[{"s":0,"e":5,"t":"term"},{"s":5,"e":12,"t":"term"}]},{"lvl":1,"label":"4.","text":"토털스테이션측량","blanks":[]},{"lvl":1,"label":"5.","text":"항공(「드론 활용 촉진 및 기반조성에 관한 법률」제2조제1항제1호에 따른 드론을 포함한다)사진측량","blanks":[{"s":50,"e":54,"t":"term"}]},{"lvl":0,"label":"②","text":"책임수행기관은 제1항에 따라 측량하는 경우 사전에 특별시장ㆍ광역시장ㆍ도지사ㆍ특별자치도지사ㆍ특별자치시장 및 「지방자치법」 제175조에 따른 대도시로서 구를 둔 시의 시장(이하 \"시ㆍ도지사\"라 한다) 또는 지적소관청과 협의하여야 한다.","blanks":[{"s":113,"e":118,"t":"org"}]}],"chap":"제2장 지적재조사 한다.","blanks":[]}],"chap":"제2장 지적재조사 측량"},{"id":"jjs-11","no":"제11조","title":"임시경계점표지의 설치","lines":[{"lvl":0,"label":"","text":"임시경계점표지는 법 제14조의 경계설정의 기준 및 다음 각 호의 세부기준에 따라 설치하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"지상경계에 대하여 다툼이 없는 경우에는 담장ㆍ구조물 등 지형지물을 경계로 한다. 이 경우 세부적인 경계설정은 「공간정보의 구축 및 관리 등에 관한 법률 시행령」 제55조제1항 각 호를 따르며 경계설정 예시는 별표 2와 같다.","blanks":[]},{"lvl":1,"label":"2.","text":"지상경계에 대하여 다툼이 있는 경우에는 다음 각 목의 절차에 따라 경계를 결정한다.","blanks":[]},{"lvl":2,"label":"가.","text":"지적공부ㆍ토지이동결의서ㆍ측량결과도 및 측량이력과 지적전산 파일 등을 조사ㆍ분석한다.","blanks":[]},{"lvl":2,"label":"나.","text":"축척이 서로 다른 지역의 경계가 접하는 부분은 등록 선ㆍ후와 등록 축척을 조사ㆍ분석한다.","blanks":[]},{"lvl":2,"label":"다.","text":"가목과 나목에서 조사ㆍ분석한 결과를 토대로 등록할 때의 측량기록과 동일한 측량방법으로 인근 필지의 경계를 확인한 후 경계를 지상에 표시하여 설정한다.","blanks":[]},{"lvl":1,"label":"3.","text":"경계가 서로 연접해 있는 토지소유자들이 경계에 합의한 경우에는 그 경계에 경계점표지를 설치한다.","blanks":[]}],"chap":"제3장 경계점표지의 설치"},{"id":"jjs-12","no":"제12조","title":"경계점표지의 설치","lines":[{"lvl":0,"label":"①","text":"제11조제1항제1호에 따라 담장ㆍ구조물 등 뚜렷한 지형지물에 경계점 위치를 표시하여 사용할 수 있다.","blanks":[]},{"lvl":0,"label":"②","text":"제11조에 따라 설치한 임시경계점의 위치와 법 제18조에 의해 최종 확정된 경계점의 위치가 다른 경우에는 토지소유자 등을 참관시켜 새로운 경계점표지를 설치하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"경계점표지의 규격과 재질은 별표 3과 같다.","blanks":[]},{"lvl":0,"label":"④","text":"제3항에도 불구하고 지적소관청은 시ㆍ군ㆍ구지적재조사위원회의 의결을 거쳐 경계점표지의 규격과 재질을 별표 3과 다르게 제작ㆍ설치할 수 있다.","blanks":[{"s":11,"e":16,"t":"org"}]},{"lvl":0,"label":"⑤","text":"토지소유자는 별표 3의 표석인 경계점표지 또는 제4항에 따라 별표 3과 다른 경계점표지로 제작ㆍ설치하여 줄 것을 지적소관청에 요구할 수 있다. 이 경우 비용은 신청자가 부담한다.","blanks":[{"s":63,"e":68,"t":"org"}]}],"chap":"제3장 경계점표지의 설치"},{"id":"jjs-13","no":"제13조","title":"측량성과 계산 및 결정","lines":[{"lvl":0,"label":"①","text":"측량성과의 계산 및 결정은 다음 각 호에 따르며 측량성과가 규칙 제7조의 연결교차를 초과할 때에는 다시 측정하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"경위도의 단위는 도ㆍ분ㆍ초이며 계산 및 결정은 소수점 이하 넷째자리까지로 한다.","blanks":[]},{"lvl":1,"label":"2.","text":"각의 관측 및 결정은 초단위로 한다.","blanks":[]},{"lvl":1,"label":"3.","text":"타원체고ㆍ안테나고ㆍ표고의 측정 및 결정은 0.001m로 한다.","blanks":[{"s":23,"e":29,"t":"num"}]},{"lvl":1,"label":"4.","text":"거리와 평면직각 좌표는 0.001m까지 계산하여 0.01m로 결정한다.","blanks":[{"s":13,"e":19,"t":"num"},{"s":27,"e":32,"t":"num"}]},{"lvl":0,"label":"②","text":"측량성과는 위성수신기에 부속된 소프트웨어(국토교통부장관이 사용승인 한 것에 한정한다)에서 계산된 성과를 사용한다.","blanks":[{"s":23,"e":30,"t":"org"}]}],"chap":"제4장 측량성과의 계산 및 성과물 등"},{"id":"jjs-14","no":"제14조","title":"측량성과 작성 및 제출","lines":[{"lvl":0,"label":"①","text":"책임수행기관은 별표 4의 기준에 따라 측량성과물을 작성하여 지적소관청에 제출한다. 이 경우 측량파일(GDB 또는 SDB, DXF, SHP, DAT)의 레이어코드 및 속성코드는 별표 5에 따른다.","blanks":[{"s":33,"e":38,"t":"org"}]},{"lvl":0,"label":"②","text":"제1항에 따른 측량성과물을 제출 후 경계가 변동된 경우에는 변동된 경계에 따른 측량성과물을 지적소관청에 제출하여야 한다.","blanks":[{"s":51,"e":56,"t":"org"}]}],"chap":"제4장 측량성과의 계산 및 성과물 등"},{"id":"jjs-15","no":"제15조","title":"측량성과 검사기준","lines":[{"lvl":0,"label":"①","text":"측량성과 검사대상은 지적기준점, 지적재조사지구의 내ㆍ외 경계점, 경계점으로 한다.","blanks":[{"s":11,"e":16,"t":"term"}]},{"lvl":0,"label":"②","text":"지적재조사측량 성과검사는 측량에 사용한 기지점과 신설점, 신설점 상호간의 실측거리에 의하여 비교한다. 이 경우 검사성과와의 연결교차 허용기준은 규칙 제7조에 의한다.","blanks":[]},{"lvl":0,"label":"③","text":"지적기준점측량 성과검사는 시ㆍ도지사가 하며 경계점측량 성과검사는 지적소관청이 지적재조사지구 특성에 맞는 표본을 추출하여 검사한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":14,"e":19,"t":"org"},{"s":36,"e":41,"t":"org"}]},{"lvl":0,"label":"④","text":"지적재조사측량을 지적소관청이 시행한 경우의 측량성과 검사는 시ㆍ도지사가 하여야 한다.","blanks":[{"s":9,"e":14,"t":"org"},{"s":33,"e":38,"t":"org"}]}],"chap":"제5장 측량성과의 검사방법 등"},{"id":"jjs-16","no":"제16조","title":"측량성과 검사방법","lines":[{"lvl":0,"label":"①","text":"측량성과검사는 현지측량 검사를 원칙으로 하며 지적재조사지구 특성에 맞게 다음 표의 측량방법에 따라 검사할 수 있다.","blanks":[],"patch":"img","patchSrc":["원문 이미지를 보고 글자로 옮겼어요(두 번 판독해 일치). 숫자는 아래 ‘원문 이미지’와 대조해 주세요."],"imgs":["155836515"],"table":[[{"text":"구 분","blanks":[],"th":true},{"text":"데이터 수신간격","blanks":[],"th":true},{"text":"측정시간","blanks":[],"th":true}],[{"text":"정지측량","blanks":[]},{"text":"30초 이하","blanks":[{"s":0,"e":3,"t":"num"}]},{"text":"10분 이상","blanks":[{"s":0,"e":3,"t":"num"}]}],[{"text":"이동측량","blanks":[]},{"text":"1초","blanks":[{"s":0,"e":2,"t":"num"}]},{"text":"고정해를 유지한 상태로 10초 이상","blanks":[{"s":13,"e":16,"t":"num"}]}],[{"text":"※ 토털스테이션측량을 하는 경우 수평각은 방향관측법으로 하며 수평거리는 1회 이상","blanks":[{"s":23,"e":28,"t":"term"},{"s":40,"e":42,"t":"num"}],"cs":3}]]},{"lvl":0,"label":"②","text":"측량성과 검사자는 관측데이터 파일(RINEX 포함)과 측량장비의 원시데이터 파일을 비교하여 다음 각 호의 사항을 분석하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"위성의 배치 및 동시 수신 위성수의 적정성","blanks":[{"s":0,"e":23,"t":"item"}]},{"lvl":1,"label":"2.","text":"위성수신기 제원과 안테나 높이 입력의 적정성","blanks":[{"s":0,"e":24,"t":"item"}]},{"lvl":1,"label":"3.","text":"PDOP 및 수평ㆍ수직정밀도 허용범위 초과 여부","blanks":[{"s":0,"e":26,"t":"item"}]},{"lvl":1,"label":"4.","text":"측량장비별 관측환경 설정 및 측정시간의 적정성","blanks":[{"s":0,"e":25,"t":"item"}]}],"chap":"제5장 측량성과의 검사방법 등"},{"id":"jjs-17","no":"제17조","title":"측량성과 검사항목","lines":[{"lvl":0,"label":"","text":"지적재조사측량성과의 검사항목은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"상공장애도 조사의 적정성","blanks":[]},{"lvl":1,"label":"2.","text":"측량방법의 적정성","blanks":[]},{"lvl":1,"label":"3.","text":"지적기준점설치망 구성의 적정성","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":1,"label":"4.","text":"지적기준점 선점 및 표지설치의 적정성","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":1,"label":"5.","text":"지적재조사지구의 내ㆍ외 경계의 적정성","blanks":[]},{"lvl":1,"label":"6.","text":"임시경계점표지 및 경계점표지 설치의 적정성","blanks":[]},{"lvl":1,"label":"7.","text":"측량성과 계산 및 점검의 적정성","blanks":[]},{"lvl":1,"label":"8.","text":"측량성과 작성의 적정성","blanks":[]},{"lvl":1,"label":"9.","text":"면적산정의 적정성","blanks":[]}],"chap":"제5장 측량성과의 검사방법 등"},{"id":"jjs-18","no":"제18조","title":"측량성과 검사기간","lines":[{"lvl":0,"label":"","text":"시ㆍ도지사 또는 지적소관청은 규칙 제6조에 따라 지적재조사측량성과의 검사에 필요한 자료를 제출받은 때에는 제출받은 날로부터 20일 이내에 성과검사를 하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":9,"e":14,"t":"org"},{"s":69,"e":72,"t":"per"}]}],"chap":"제5장 측량성과의 검사방법 등"},{"id":"jjs-19","no":"제19조","title":"안전조치","lines":[{"lvl":0,"label":"","text":"책임수행기관 및 지적재조사대행자는 지적재조사측량과정에서 안전사고가 발생하지 않도록 예방에 필요한 조치를 하여야 한다.","blanks":[]}],"chap":"제5장 측량성과의 검사방법 등"},{"id":"jjs-20","no":"제20조","title":"재검토기한","lines":[{"lvl":0,"label":"","text":"국토교통부장관은 이 고시에 대하여 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 2025년 9월 1일 기준으로 매 3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":68,"e":69,"t":"num"},{"s":80,"e":81,"t":"num"}]}],"chap":"제5장 측량성과의 검사방법 등"}]},"gnss":{"id":"gnss","name":"GNSS에 의한 지적측량규정","kind":"국토교통부예규","effective":"2025-08-29","promulgated":"2025-08-29","url":"https://www.law.go.kr/행정규칙/GNSS에 의한 지적측량규정","short":"GNSS 지적측량규정","annex":["[별지 1] GNSS측량기 점검기록부","[별지 2] 지적위성측량부","[별지 3] 지적위성측량부","[별지 4] 이동측량 결과부(세부측량)","[별지 5] 지적위성측량 성과검사부"],"rule":true,"articles":[{"id":"gnss-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규정은 「지적측량 시행규칙」 제5조 및 제7조제2항에 따라 GNSS(Global Navigation Satellite System)측량기를 사용하여 실시하는 지적측량에 필요한 측량방법 및 절차 등 세부사항을 규정함을 목적으로 한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"gnss-2","no":"제2조","title":"적용범위","lines":[{"lvl":0,"label":"","text":"지적위성측량으로 지적측량을 실시하는 경우에는 「공간정보의 구축 및 관리 등에 관한 법률」, 같은 법 시행령, 같은 법 시행규칙 및 「지적측량 시행규칙」, 「지적업무처리규정」에서 정하는 것을 제외하고는 이 규정에 따른다.","blanks":[{"s":2,"e":6,"t":"term"}]}],"chap":"제1장 총칙"},{"id":"gnss-3","no":"제3조","title":"정의","lines":[{"lvl":0,"label":"","text":"이 규정에서 사용하는 용어의 정의는 다음과 같으며, 여기서 정하지 아니한 기타 용어는 일반적인 해석에 따른다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"지적위성측량\"이라 함은 GNSS측량기를 사용하여 실시하는 지적측량을 말한다.","blanks":[{"s":3,"e":7,"t":"term"}]},{"lvl":1,"label":"2.","text":"\"세계좌표\"란 세계측지계를 기준으로 한 경도, 위도, 타원체고 또는 T.M(Transverse Mercator) 투영법에 의한 평면직각좌표와 표고를 말한다.","blanks":[]},{"lvl":1,"label":"3.","text":"\"세계측지계\"란 「공간정보의 구축 및 관리 등에 관한 법률 시행령」 제7조제1항에 따른 위치측정의 기준을 말한다.","blanks":[]},{"lvl":1,"label":"4.","text":"\"지역좌표\"란 베셀타원체를 기준으로 한 경도, 위도, 높이 또는 가우스상사이중투영에 의한 평면직각좌표와 구소삼각원점 등을 기준으로 한 평면좌표를 말한다.","blanks":[]},{"lvl":1,"label":"5.","text":"\"평면직각좌표\"란 기준 타원체상의 경위도 좌표를 T.M(Transverse Mercator)투영법에 따라 계산된 좌표를 말하며 투영원점의 가산수치는 종선(N)에 60만 미터, 횡선(E)에 20만 미터로 하여 사용한다.","blanks":[{"s":90,"e":96,"t":"num"},{"s":105,"e":111,"t":"num"}]},{"lvl":1,"label":"6.","text":"\"고정점\"이란 조정계산 시 이용하는 경위도와 높이 또는 평면직각종횡선좌표 와 높이의 성과가 고시된 기지점을 말한다.","blanks":[]},{"lvl":1,"label":"7.","text":"\"표고점\"이란 수준점으로부터 직접 또는 간접수준측량에 의하여 표고를 결정하여 지적위성측량시 표고의 기지점으로 사용할 수 있는 점을 말한다.","blanks":[{"s":45,"e":49,"t":"term"}]},{"lvl":1,"label":"8.","text":"\"정지측량(Static Survey)\"이란 GNSS측량기를 관측지점에 일정시간 동안 고정하여 연속적으로 위성데이터를 취득한 후 기선해석 및 조정계산을 수행하는 측량방법을 말한다.","blanks":[{"s":1,"e":5,"t":"term"}]},{"lvl":1,"label":"9.","text":"\"단일기준국 실시간 이동측량(Single-RTK 측량(Real Time Kinematic Survey))\"이란 기지점(통합기준점 및 지적기준점)에 설치한 GNSS측량기로부터 수신된 보정정보와 이동국이 수신한 GNSS 반송파 위상 신호를 실시간 기선해석을 통해 이동국의 위치를 결정하는 측량을 말한다.","blanks":[{"s":1,"e":6,"t":"term"},{"s":11,"e":15,"t":"term"},{"s":66,"e":71,"t":"term"},{"s":74,"e":79,"t":"term"}]},{"lvl":1,"label":"10.","text":"\"다중기준국 실시간 이동측량(Network- RTK 측량)\"이란 3점 이상의 위성기준점을 이용하여 산출한 보정정보와 이동국이 수신한 GNSS 반송파 위상 신호를 실시간 기선해석을 통해 이동국의 위치를 결정하는 측량을 말한다.","blanks":[{"s":11,"e":15,"t":"term"},{"s":36,"e":38,"t":"num"},{"s":43,"e":48,"t":"term"}]},{"lvl":1,"label":"11.","text":"\"세션(Session)\"이란 당해 측량을 위하여 일정한 관측간격을 두고 GNSS측량기를 동시에 설치하여 지적위성측량을 실시하는 작업 단위를 말한다.","blanks":[{"s":60,"e":64,"t":"term"}]},{"lvl":1,"label":"12.","text":"\"기선해석\"이란 2대 이상의 고정된 GNSS측량기 사이의 3차원 기선벡터(ΔX, ΔY, ΔZ)를 결정하는 것을 말한다.","blanks":[{"s":9,"e":10,"t":"num"}]},{"lvl":1,"label":"13.","text":"\"망조정\"이란 기선해석이 완료된 GNSS 관측데이터의 최종 성과를 산정하기 위하여 기지점을 고정하여 통합 조정하는 것을 말한다.","blanks":[]},{"lvl":1,"label":"14.","text":"\"라이넥스(RINEX(Receiver Independent Exchange Format))\"란 GNSS 관측데이터의 저장과 교환에 사용되는 세계 표준의 GNSS 데이터 자료형식을 말한다.","blanks":[]},{"lvl":1,"label":"15.","text":"\"고정밀 자료처리 소프트웨어\"란 GNSS 기반 고정밀 위치결정, 위성 궤도 추정, 시간측정 등의 목적으로 개발된 과학기술용 자료처리 소프트웨어를 말한다.","blanks":[]},{"lvl":1,"label":"16.","text":"\"궤도력\" 이란 GNSS 위성의 위치 계산에 사용되는 정밀력, 신속력, 초신속력, 방송력, 개략력을 말한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"gnss-4","no":"제4조","title":"관측준비 및 관측","lines":[{"lvl":0,"label":"①","text":"지적위성측량 작업 착수 전에 GNSS 관측을 위하여 다음 각 호를 고려하여야 한다.","blanks":[{"s":2,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"GNSS 측량기 대수, 투입인력, 위성기준점 및 기지점 분포현황 조사","blanks":[{"s":19,"e":24,"t":"term"}]},{"lvl":1,"label":"2.","text":"GNSS 개략 궤도력 정보를 이용하여 위성배치상태가 최적의 시간대 선정","blanks":[]},{"lvl":1,"label":"3.","text":"관측점은 기지점 및 소구점으로 구성","blanks":[]},{"lvl":1,"label":"4.","text":"관측망은 기지점과 소구점을 결합한 폐합다각형이 되도록 구성하고 지적위성측량 관측계획 망도 작성","blanks":[{"s":37,"e":41,"t":"term"}]},{"lvl":1,"label":"5.","text":"세션구성은 삼각형, 사각형 또는 혼합형으로 2세션 이상일 경우 인접세션과 최소 1변 이상이 중복되도록 구성","blanks":[{"s":24,"e":25,"t":"num"},{"s":44,"e":46,"t":"num"}]},{"lvl":0,"label":"②","text":"지적위성측량 관측 시 위성의 조건은 다음 각 호의 기준에 의한다.","blanks":[{"s":2,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"관측점으로부터 위성에 대한 고도각이 15°이상에 위치할 것","blanks":[{"s":20,"e":23,"t":"num"}]},{"lvl":1,"label":"2.","text":"위성의 작동상태가 정상일 것","blanks":[]},{"lvl":1,"label":"3.","text":"관측점에서 동시에 수신 가능한 위성 수는 정지측량에 의하는 경우에는 4개 이상, 이동측량에 의하는 경우에는 5개 이상일 것","blanks":[{"s":23,"e":27,"t":"term"},{"s":38,"e":40,"t":"num"},{"s":45,"e":49,"t":"term"},{"s":60,"e":62,"t":"num"}]},{"lvl":0,"label":"③","text":"지적위성측량 관측 시 주의사항은 다음 각 호와 같다.","blanks":[{"s":2,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"안테나 주위의 10미터이내에는 자동차 등의 접근을 피할 것","blanks":[{"s":8,"e":12,"t":"num"}]},{"lvl":1,"label":"2.","text":"관측 중에는 무전기 등 전파발신기의 사용을 금한다. 다만, 부득이한 경우에는 안테나로부터 100미터이상의 거리에서 사용할 것","blanks":[{"s":50,"e":55,"t":"num"}]},{"lvl":1,"label":"3.","text":"발전기를 사용하는 경우에는 안테나로부터 20미터 이상 떨어진 곳에서 사용할 것","blanks":[{"s":22,"e":26,"t":"num"}]},{"lvl":1,"label":"4.","text":"관측 중에는 수신기 표시장치 등을 통하여 관측상태를 수시로 확인하고 이상 발생시에는 재관측을 실시할 것","blanks":[]},{"lvl":0,"label":"④","text":"GNSS측량기에 입력하는 안테나의 높이 등에 관하여는 GNSS측량기에서 정해진 방법에 따라 측정하고, 관측 후 확인한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"관측 완료 후 점검결과 제1항 내지 제3항의 관측조건에 맞지 아니한 경우에는 다시 관측을 하여야 한다.","blanks":[]}],"chap":"제2장 선점 및 측량준비"},{"id":"gnss-5","no":"제5조","title":"GNSS측량기","lines":[{"lvl":0,"label":"","text":"지적위성측량에 사용하는 GNSS측량기는 수신기, 안테나, 소프트웨어 및 부대장비로 구성되며, 다음 각 호의 기준에 의한다.","blanks":[{"s":2,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"측량방법에 따른 GNSS측량기의 성능은 다음 표의 기준에 의할 것","blanks":[]},{"lvl":1,"label":"2.","text":"안테나는 위성의 전파를 수신하여 수신기에 전달할 수 있어야 하며, 측점에 정확하게 정치할 수 있는 구심 기능과 수평조정 기능을 갖는 장치가 있을 것","blanks":[]},{"lvl":1,"label":"3.","text":"소프트웨어는 지적위성측량의 사전 계획수립을 위한 위성에 관련된 정보획득과 관측데이터의 점검, 기선해석, 조정계산 및 좌표변환 등의 기능을 가질 것","blanks":[{"s":9,"e":13,"t":"term"}]}],"chap":"제2장 선점 및 측량준비"},{"id":"gnss-6","no":"제6조","title":"GNSS측량기의 점검","lines":[{"lvl":0,"label":"①","text":"지적위성측량(측량검사를 포함한다)을 하는 때에는 GNSS측량기에 대한 기능점검을 하여 사용하고 측량 중에도 이상 유무를 확인하여야 한다.","blanks":[{"s":2,"e":6,"t":"term"}]},{"lvl":0,"label":"②","text":"기능점검은 다음 각 호의 기준에 의한다.","blanks":[]},{"lvl":1,"label":"1.","text":"안테나 장착을 위한 광학구심장치, 각종 케이블 및 접속부분, 전원장치 등이 정상일 것","blanks":[]},{"lvl":1,"label":"2.","text":"안테나 및 수신기가 정상적으로 작동할 것","blanks":[]},{"lvl":0,"label":"③","text":"제1항에 의한 점검을 한 때에는 별지 제1호서식의 GNSS측량기점검기록부를 작성하여야 한다.","blanks":[]}],"chap":"제2장 선점 및 측량준비"},{"id":"gnss-7","no":"제7조","title":"소구점의 선점","lines":[{"lvl":0,"label":"①","text":"소구점은 인위적인 전파장애, 지형ㆍ지물 등의 영향을 받지 않도록 다음 각 호의 장소를 피하여 선점하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"건물내부, 산림속, 고층건물이 밀집한 시가지, 교량아래 등 상공시계 확보가 어려운 곳","blanks":[]},{"lvl":1,"label":"2.","text":"초고압송전선, 고속철도 등의 전차경로 등 전기불꽃의 영향을 받는 곳","blanks":[]},{"lvl":1,"label":"3.","text":"레이더안테나, TV중계탑, 방송국, 우주통신국 등 강력한 전파의 영향을 받는 곳","blanks":[]},{"lvl":0,"label":"②","text":"후속작업으로 토털스테이션 이용 등을 고려하여 1방향 이상의 기지점 또는 소구점 시통이 가능하도록 선점하여야 한다.","blanks":[{"s":25,"e":28,"t":"num"}]}],"chap":"제2장 선점 및 측량준비"},{"id":"gnss-8","no":"제8조","title":"기초측량","lines":[{"lvl":0,"label":"①","text":"GNSS측량기를 사용한 기초측량을 하려는 경우에는 정지측량방법 또는 이동측량방법에 의한다.","blanks":[{"s":28,"e":32,"t":"term"},{"s":38,"e":42,"t":"term"}]},{"lvl":0,"label":"②","text":"기초측량의 절차는 「지적측량 시행규칙」 제7조제3항을 따른다.","blanks":[]}],"chap":"제3장 GNSS측량"},{"id":"gnss-9","no":"제9조","title":"기초 정지측량","lines":[{"lvl":0,"label":"","text":"GNSS측량기를 사용한 정지측량방법으로 기초측량을 하려는 때에는 다음 각 호의 기준에 의한다.","blanks":[{"s":13,"e":17,"t":"term"}]},{"lvl":1,"label":"1.","text":"기지점과 소구점에 GNSS측량기를 동시에 설치하여 세션단위로 실시할 것","blanks":[]},{"lvl":1,"label":"2.","text":"관측성과의 기선벡터 점검을 위하여 다른 세션에 속하는 관측망과 1변 이상이 중복되게 관측할 것","blanks":[{"s":35,"e":37,"t":"num"}]},{"lvl":1,"label":"3.","text":"관측시간과 데이터 수신간격은 다음 표에 의할 것","blanks":[],"patch":"img","patchSrc":["원문 이미지를 보고 글자로 옮겼어요(두 번 판독해 일치). 숫자는 아래 ‘원문 이미지’와 대조해 주세요."],"imgs":["155839033"],"table":[[{"text":"기지점과의 거리","blanks":[],"th":true},{"text":"측정시간","blanks":[],"th":true},{"text":"데이터 수신간격","blanks":[],"th":true}],[{"text":"5㎞ 이상","blanks":[{"s":0,"e":2,"t":"num"}]},{"text":"60분 이상","blanks":[{"s":0,"e":3,"t":"num"}]},{"text":"30초 이하","blanks":[{"s":0,"e":3,"t":"num"}],"rs":2}],[{"text":"5㎞ 미만","blanks":[{"s":0,"e":2,"t":"num"}]},{"text":"30분 이상","blanks":[{"s":0,"e":3,"t":"num"}]}]]}],"chap":"제3장 GNSS측량"},{"id":"gnss-10","no":"제10조","title":"기초 이동측량","lines":[{"lvl":0,"label":"①","text":"GNSS측량기를 사용한 이동측량방법으로 기초측량을 하려는 경우에는 단일기준국 실시간 이동측량(Single-RTK 측량) 또는 다중기준국 실시간 이동측량(Network-RTK 측량)에 따른다.","blanks":[{"s":13,"e":17,"t":"term"},{"s":37,"e":42,"t":"term"},{"s":47,"e":51,"t":"term"},{"s":80,"e":84,"t":"term"}]},{"lvl":0,"label":"②","text":"단일기준국 실시간 이동측량 및 다중기준국 실시간 이동측량으로 기초측량을 실시할 경우 기준은 다음 각 호와 같다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":14,"t":"term"},{"s":27,"e":31,"t":"term"}]},{"lvl":1,"label":"1.","text":"관측전 이동국 GNSS측량기의 초기화 작업을 완료할 것","blanks":[]},{"lvl":1,"label":"2.","text":"관측 중 위성신호의 단절 또는 통신장치의 이상으로 보정정보를 안정적으로 수신할 수 없는 경우 이동국 GNSS측량기를 재초기화 할 것","blanks":[]},{"lvl":1,"label":"3.","text":"GNSS측량기 안테나를 기준으로 고도각 15°이상에 정상 작동중인 GNSS위성이 5개 이상일 것","blanks":[{"s":22,"e":25,"t":"num"},{"s":45,"e":47,"t":"num"}]},{"lvl":1,"label":"4.","text":"GNSS측량기에 표시하는 PDOP이 3이상이거나 위치정밀도가 수평 ±3㎝ 이상 또는 수직 ±5㎝ 이상인 경우 관측을 중지할 것","blanks":[{"s":20,"e":21,"t":"num"},{"s":37,"e":40,"t":"num"},{"s":50,"e":53,"t":"num"}]},{"lvl":1,"label":"5.","text":"1, 2회의 관측치가 제5항제4호의 오차 이내일 경우에는 1회 관측치를 기준으로 결과부를 작성","blanks":[{"s":0,"e":1,"t":"num"},{"s":3,"e":5,"t":"num"},{"s":32,"e":34,"t":"num"}]},{"lvl":1,"label":"6.","text":"지역좌표를 구하고자 할  이동측량으로 세부측량을 하는 경우에 제10조제2항제1호부터 제4호와 제10조제5항제1호부터 제4호의 조건을 만족하지 못한 경우에는 측량방법을 달리하여 실시한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":14,"t":"term"},{"s":26,"e":30,"t":"term"}]},{"lvl":0,"label":"⑥","text":"세부측량에 표고가 필요한 경우 제18조에 따른다.","blanks":[]},{"lvl":0,"label":"⑦","text":"세부측량의 절차는 「지적측량 시행규칙」 제16조부터 제26조를 따른다.","blanks":[]}],"chap":"제3장 GNSS측량"},{"id":"gnss-12","no":"제12조","title":"GNSS데이터 관리","lines":[{"lvl":0,"label":"①","text":"제9조에 따를 경우 관측데이터 관리 방법은 다음 각 호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"GNSS측량기로부터 수신된 원시데이터는 GNSS 공통 포맷인 라이넥스(Rinex) 파일로 변환하여 원시데이터와 함께 관리할 것","blanks":[]},{"lvl":1,"label":"2.","text":"라이넥스(Rinex) 변환은 GNSS측량기 제조사에서 제공하는 소프트웨어 또는 공통변환 소프트웨어를 사용하여야 하며 후속작업에 활용할 수 있도록 관리할 것","blanks":[]},{"lvl":1,"label":"3.","text":"라이넥스(Rinex) 변환시에는 GNSS측량기 장비사의 안테나 모델, 안테나 기준위치로부터 위상중심변동 보정값, 안테나고 등의 변수를 안테나 모델에 적합하게 설정할 것","blanks":[]},{"lvl":0,"label":"②","text":"제10조 및 제11조에 따를 경우 GNSS측량기 및 부속된 소프트웨어 보정정보를 이용하여 처리한 원시데이터를 관리하여야 한다.","blanks":[]}],"chap":"제4장 성과계산"},{"id":"gnss-13","no":"제13조","title":"기선해석","lines":[{"lvl":0,"label":"","text":"지적위성측량에 의한 기선해석은 다음 각 호의 기준에 의한다.","blanks":[{"s":2,"e":6,"t":"term"}]},{"lvl":1,"label":"1.","text":"당해 관측지역의 가장 가까운 위성기준점(최소 2점이상) 또는 세계좌표를 이미 알고 있는 측량기준점을 기점으로 하여 인접하는 기지점 또는 소구점을 순차적으로 각 성분의 교차(ΔX, ΔY, ΔZ)를 해석할 것","blanks":[{"s":16,"e":21,"t":"term"},{"s":25,"e":27,"t":"num"}]},{"lvl":1,"label":"2.","text":"기지점과 소구점간의 거리가 50킬로미터를 초과하는 경우에는 정밀궤도력에 의하고 기타는 방송궤도력을 이용할 수 있음","blanks":[{"s":15,"e":21,"t":"num"}]},{"lvl":1,"label":"3.","text":"제2호의 기준에도 불구하고 고정밀 자료처리 소프트웨어를 사용할 경우에는 초신속 또는 신속궤도력을 이용할 수 있음","blanks":[]},{"lvl":1,"label":"4.","text":"기선해석의 방법은 세션별로 실시하되 단일기선해석방법에 의할 것","blanks":[]},{"lvl":1,"label":"5.","text":"기선해석시에 사용되는 단위는 미터단위로 하고 계산은 소수점이하 셋째자리까지 할 것","blanks":[]},{"lvl":1,"label":"6.","text":"2주파 이상의 관측데이터를 이용하여 처리할 경우에는 전리층 보정을 할 것","blanks":[{"s":0,"e":1,"t":"num"}]},{"lvl":1,"label":"7.","text":"기선해석의 결과는 고정해에 의하며, 그 결과를 기초로 소프트웨어에서 제공하는 형식으로 기선해석계산부를 작성할 것","blanks":[]}],"chap":"제4장 성과계산"},{"id":"gnss-14","no":"제14조","title":"기선해석의 점검","lines":[{"lvl":0,"label":"①","text":"서로 다른 세션에 속하는 중복기선으로 최소변수의 폐합다각형을 구성하여 기선벡터 각 성분(ΔX, ΔY, ΔZ)의 폐합차를 계산한다.","blanks":[]},{"lvl":0,"label":"②","text":"제1항에 의한 폐합차의 허용범위는 다음 표에 의하며, 그 기준을 초과하는 경우에는 다시 관측을 하여야 한다.","blanks":[],"patch":"img","patchSrc":["원문 이미지를 보고 글자로 옮겼어요(두 번 판독해 일치). 숫자는 아래 ‘원문 이미지’와 대조해 주세요."],"imgs":["155839069"],"table":[[{"text":"폐합기선장의 총합","blanks":[],"th":true},{"text":"ΔX, ΔY, ΔZ의 폐합차","blanks":[],"th":true},{"text":"비 고","blanks":[],"th":true}],[{"text":"10㎞ 미만","blanks":[{"s":0,"e":3,"t":"num"}]},{"text":"3㎝ 이내","blanks":[{"s":0,"e":2,"t":"num"}]},{"text":"","blanks":[]}],[{"text":"10㎞ 이상","blanks":[{"s":0,"e":3,"t":"num"}]},{"text":"2㎝+1ppm×D 이내","blanks":[{"s":0,"e":2,"t":"num"},{"s":3,"e":7,"t":"num"}]},{"text":"D : 기선장(㎞)","blanks":[]}]]}],"chap":"제4장 성과계산"},{"id":"gnss-15","no":"제15조","title":"망조정","lines":[{"lvl":0,"label":"","text":"GNSS 데이터의 망조정은 자유망조정으로 처리하여 기지점들의 성과를 점검 후 다점고정망으로 모든 기지점을 고정하여 처리하며 다음 각 호의 기준에 의한다.","blanks":[]},{"lvl":1,"label":"1.","text":"자유망조정은 기지점 중 한점을 고정하고 기지점들을 처리하며, 기지점들간의 성과부합여부를 확인할 것","blanks":[]},{"lvl":1,"label":"2.","text":"자유망조정 결과 기지점들에 이상이 없을 때 모든 기지점을 고정하여 다점고정망조정으로 처리할 것","blanks":[]},{"lvl":1,"label":"3.","text":"고정밀 자료처리 소프트웨어를 사용할 경우에는 기지점 및 소구점을 동시에 조정하여 처리할 수 있음","blanks":[]}],"chap":"제4장 성과계산"},{"id":"gnss-16","no":"제16조","title":"세계좌표의 계산","lines":[{"lvl":0,"label":"①","text":"제9조에 따를 경우 관측점의 세계좌표는 제13조의 규정에 의한 기선해석성과를 기준으로 조정계산에 의해 결정하되, 조정계산은 다음 각 호의 기준에 의한다.","blanks":[]},{"lvl":1,"label":"1.","text":"고정점은 위성기준점, 통합기준점 또는 정확한 세계좌표를 알고 있는 지적기준점으로 할 것","blanks":[{"s":5,"e":10,"t":"term"},{"s":12,"e":17,"t":"term"},{"s":37,"e":42,"t":"term"}]},{"lvl":1,"label":"2.","text":"계산방법은 기선해석에 사용하는 소프트웨어에서 정한 방법에 의할 것","blanks":[]},{"lvl":0,"label":"②","text":"제10조 및 제11조에 따를 경우 GNSS측량기에서 제공하는 정밀도를 이용하여 가중평균한 결과를 이용한다.","blanks":[]}],"chap":"제4장 성과계산"},{"id":"gnss-17","no":"제17조","title":"지역좌표의 계산","lines":[{"lvl":0,"label":"①" rue,"articles":[{"id":"drone-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규정은 「지적측량 시행규칙」 제5조제2항 및 「지적재조사에 관한 특별법 시행규칙」 제5조제4항에 따라 드론을 활용하여 지적측량 및 지적재조사측량을 시행하는데 필요한 사항을 규정함을 목적으로 한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"drone-2","no":"제2조","title":"용어의 정의","lines":[{"lvl":0,"label":"","text":"이 규정에서 사용하는 용어의 정의는 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"드론\"이란 조종자가 탑승하지 아니한 상태로 항행할 수 있는 비행체로서 「드론 활용의 촉진 및 기반조성에 관한 법률」 제2조제1호 각목에 해당하는 기기를 말한다.","blanks":[]},{"lvl":1,"label":"2.","text":"\"드론조종자\"란 「무인비행장치 조종자의 자격 및 전문교육기관 지정기준」 제4조 및 제5조에 따라 한국교통안전공단이사장이 발급한 1종부터 4종까지 무인비행장치 조종자 증명을 소지한 자를 말한다.","blanks":[{"s":71,"e":72,"t":"num"},{"s":76,"e":77,"t":"num"}]},{"lvl":1,"label":"3.","text":"\"드론영상\"이란 드론에 설치된 카메라로 촬영한 영상 또는 사진을 말한다.","blanks":[]},{"lvl":1,"label":"4.","text":"\"대공표지\"란 지상기준점측량 작업에 필요한 지점의 위치를 항공사진상에 나타나게 하도록 그 점에 설치하는 표지를 말한다.","blanks":[]},{"lvl":1,"label":"5.","text":"\"지상기준점(GCP, Ground Control Point)\"이란 영상좌표계와 지도좌표계 사이의 좌표변환식을 구하기 위해 지상에 설치한 기준점을 말한다.","blanks":[]},{"lvl":1,"label":"6.","text":"\"검사점\"이란 드론영상의 정확도 검증을 위해 지상에 설치한 표식점을 말한다.","blanks":[]},{"lvl":1,"label":"7.","text":"\"정사영상\"이란 중심투영에 의하여 취득된 영상의 지형ㆍ지물 등에 대한 정사편위수정을 실시한 영상을 말한다.","blanks":[]},{"lvl":1,"label":"8.","text":"\"입체영상\"이란 지표면의 표고를 표현하기 위한 일정 간격의 격자점마다 수치로 기록한 모형을 통해 3차원으로 지형ㆍ지물을 확인할 수 있도록 제작한 영상을 말한다.","blanks":[]},{"lvl":1,"label":"9.","text":"\"지상경계 및 현황 추출\"이란 정사영상 또는 입체영상을 지적측량에 활용하기 위하여 지상경계, 지형ㆍ지물에 대한 형상 및 위치 정보인 현황을 표현하는 작업을 말한다.","blanks":[]},{"lvl":1,"label":"10.","text":"\"지상표본거리(GSD, Ground Sample Distance)\"라 함은 각 화소(Pixel)가 나타내는 X, Y 지상거리를 말한다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"drone-3","no":"제3조","title":"적용","lines":[{"lvl":0,"label":"","text":"드론을 활용한 지적측량 및 지적재조사측량은 별도의 특별한 규정이 있는 경우를 제외하고는 이 규정에서 정하는 바에 따른다.","blanks":[]}],"chap":"제1장 총칙"},{"id":"drone-4","no":"제4조","title":"작업순서","lines":[{"lvl":0,"label":"","text":"드론을 활용한 지적측량의 작업순서는 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"작업계획수립 및 현장답사","blanks":[]}, ,"t":"item"},{"s":8,"e":10,"t":"item"},{"s":12,"e":14,"t":"item"},{"s":16,"e":22,"t":"item"}]},{"lvl":1,"label":"2.","text":"조종자 및 부조종자의 소속, 직위(직급), 자격, 성명","blanks":[{"s":0,"e":14,"t":"item"},{"s":16,"e":18,"t":"item"},{"s":24,"e":26,"t":"item"},{"s":28,"e":30,"t":"item"}]},{"lvl":1,"label":"3.","text":"비행기체 및 카메라의 제원","blanks":[{"s":0,"e":14,"t":"item"}]},{"lvl":1,"label":"4.","text":"비행기체의 속도","blanks":[{"s":0,"e":8,"t":"item"}]},{"lvl":1,"label":"5.","text":"영상촬영의 고도 및 횟수, 중복도","blanks":[{"s":0,"e":13,"t":"item"},{"s":15,"e":18,"t":"item"}]},{"lvl":1,"label":"6.","text":"지상기준점, 검사점의 배치 등","blanks":[{"s":0,"e":5,"t":"item"},{"s":7,"e":16,"t":"item"}]}],"chap":"제2장 작업계획 수립"},{"id":"drone-6","no":"제6조","title":"비행승인 및 촬영신청","lines":[{"lvl":0,"label":"","text":"드론조종자는 「항공안전법」 제127조 및「군사기지 및 군사시설 보호법」 제10조에 따라 관할 지방항공청장과 관할부대장 등에게 비행승인 및 촬영허가를 받아야 한다. 다만, 비행제한 구역이 아닌 개활지 등 촬영금지 시설이 명백하게 없는 곳의 촬영일 경우는 제외한다.","blanks":[]}],"chap":"제2장 작업계획 수립"},{"id":"drone-7","no":"제7조","title":"안전관리","lines":[{"lvl":0,"label":"①","text":"지적측량 및 지적재조사측량에 활용하는 드론은 다음 각 호에 따라 관리하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"드론 및 배터리의 보관, 충전, 사용 등 제조사의 주의사항 준수","blanks":[]},{"lvl":1,"label":"2.","text":"드론의 위성신호와 지상제어장치에 관여하는 기기 및 소프트웨어, 인증, 통신, 비행, 암호, 자료보호 등 외부 보안 위협에 관한 대응 및 조치","blanks":[]},{"lvl":1,"label":"3.","text":"드론 기체를 정비하였을 경우 별지 제2호서식에 따른 드론 기체 정비일지 작성","blanks":[]},{"lvl":0,"label":"②","text":"드론조종자는「항공안전법」 제129조에 따른 초경량비행장치 조종자 등의 준수사항을 지켜야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"드론 비행 중 기체이상, 기상악화 등 돌발 및 비상 상황이 발생할 경우 즉시 비상 착륙하여야 한다.","blanks":[]},{"lvl":0,"label":"④","text":"드론 운영 중에 사고가 발생하였을 때는 인명구호 및 사고수습 등을 위한 조치를 신속히 하고, 「항공안전법」 제129조제3항에 따라 관할 지방항공청장에게 사고 내용을 지체없이 통보하여야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"드론조종자는 드론 비행에 따른 안전을 위해 별지 제3호서식 드론 안전점검 체크리스트에 따라 점검을 실시하여야 한다.","blanks":[]},{"lvl":0,"label":"⑥","text":"드론 지적측량 및 지적재조사측량에 사용되는 기체가 「항공안전법 시행규칙」 제305조에 해당 할 경우 「항공안전법」 제124조 및 초경량 비행장치 안전성 인증 업무 운영세칙에 따라 기체의 안전성 정기 인증을 받아야 한다.","blanks":[]}],"chap":"제2장 작업계획 수립"},{"id":"drone-8","no":"제8조","title":"대공표지 설치","lines":[{"lvl":0,"label":"①","text":"대공표지는 지상기준점, 검사점 및 임시경계점표지 등에 설치하여야 한다. 다만 현지 여건상 필요한 경우 임의의 점에 대공표지를 설치할 수 있다.","blanks":[]},{"lvl":0,"label":"②","text":"제1항에도 불구하고 드론영상에서 식별이 가능한 고정된 인공지물을 지상기준점이나 검사점으로 사용하는 경우 대공표지 설치를 생략할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"제1항에 따라 설치하는 대공표지의 규격은 별표 3과 같으며 지형의 배색 등을 고려하여 형상, 크기, 색을 변경할 수 있다.","blanks":[]}],"chap":"제3장 대공표지 설치 및 지상기준점 측량"},{"id":"drone-9","no":"제9조","title":"지상기준점 및 검사점 설치","lines":[{"lvl":0,"label":"①","text":"지상기준점은 작업구역의 형태, 촬영방향 등을 고려하여 별표 4와 같이 사업지구를 포괄하도록 작업구역 내ㆍ외에 고르게 설치하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"제1항에 따른 지상기준점은 작업구역 1제곱킬로미터 당 9점 이상을 설치하여야 한다. 단, 1제곱킬로미터 미만인 작업구역의 경우 최소 3점 이상, 1제곱킬로미터 당 9점을 기준으로 면적에 비례하도록 설치하여야 한다.","blanks":[{"s":20,"e":27,"t":"num"},{"s":30,"e":32,"t":"num"},{"s":50,"e":57,"t":"num"},{"s":74,"e":76,"t":"num"},{"s":81,"e":88,"t":"num"},{"s":91,"e":93,"t":"num"}]},{"lvl":0,"label":"③","text":"제2항에도 불구하고 제12조제4항에 따른 PPK(Post-Processed Kinematic), RTK(Real-Time Kinematic) 등 방식의 정확도 확보가 가능한 드론장비를 사용하는 경우에는 1제곱킬로미터 당 최소 3점 이상 지상기준점을 설치할 수 있다.","blanks":[{"s":113,"e":120,"t":"num"},{"s":126,"e":128,"t":"num"}]},{"lvl":0,"label":"④","text":"검사점은 작업구역 내에 고르게 설치하되, 지상기준점과 중복되지 않게 설치하여야 한다.","blanks":[]},{"lvl":0,"label":"⑤","text":"검사점은 최소 1점 이상으로 지상기준점 수량의 3분의 1 이상이 되도록 설치하여야 한다.","blanks":[{"s":8,"e":10,"t":"num"},{"s":26,"e":31,"t":"num"}]},{"lvl":0,"label":"⑥","text":"제1항 및 제4항에도 불구하고 작업구역에 명확히 식별되는 고정된 인공지물이 있는 경우 이를 지상기준점 또는 검사점으로 사용할 수 있다.","blanks":[]},{"lvl":0,"label":"⑦","text":"제6항에 따라 고정된 인공지물을 지상기준점 또는 검사점으로 사용하는 경우에는 이를 제2항 및 제5항에 따른 지상기준점 또는 검사점 수에 포함한다.","blanks":[]}],"chap":"제3장 대공표지 설치 및 지상기준점 측량"},{"id":"drone-10","no":"제10조","title":"지상기준점 및 검사점 측량","lines":[{"lvl":0,"label":"①","text":"지상기준점 및 검사점에 대한 측량은 「지적측량 시행규칙」 제7조, 「GNSS에 의한 지적측량규정」 제7조부터 제8조까지,「지적재조사 측량규정」 제4조 및 제7조의 규정을 준용하여 실시하여야 한다. 다만, 현지 여건 등의 사유로 측량이 불가한 경우 지적소관청 또는 지적재조사 책임수행기관과 협의하여 측량방법을 변경할 수 있다.","blanks":[{"s":138,"e":143,"t":"org"}]},{"lvl":0,"label":"②","text":"지상기준점 및 검사점 측량을 완료하여 지적기준점으로 등록하여 사용할 경우와 지적재조사측량의 경우 측량성과 검사 요청 시 다음 각호의 결과물을 작성하여 지적소관청에 제출하여야 한다.","blanks":[{"s":21,"e":26,"t":"term"},{"s":84,"e":89,"t":"org"}]},{"lvl":1,"label":"1.","text":"별지 제4호서식 지상기준점 및 검사점 배치도","blanks":[]},{"lvl":1,"label":"2.","text":"별지 제5호서식 지상기준점 및 검사점 조서","blanks":[]},{"lvl":1,"label":"3.","text":"별지 제6호서식 단일/다중 기준국실시간이동측량 관측기록부","blanks":[{"s":18,"e":25,"t":"term"}]},{"lvl":1,"label":"4.","text":"별지 제7호서식 단일/다중 기준국실시간이동측량 결과부","blanks":[{"s":18,"e":25,"t":"term"}]},{"lvl":0,"label":"③","text":"지상기준점 및 검사점의 좌표는 0.001미터 단위로 계산하고 0.01미터 단위로 결정한다.","blanks":[{"s":17,"e":24,"t":"num"},{"s":34,"e":40,"t":"num"}]}],"chap":"제3장 대공표지 설치 및 지상기준점 측량"},{"id":"drone-11","no":"제11조","title":"드론영상 촬영","lines":[{"lvl":0,"label":"①","text":"드론조종자는 드론영상 전용 프로그램의 지상표본거리를 지적재조사측량의 경우 0.03미터, 그 외 지적측량의 경우 0.05미터 이내로 설정하고, 촬영 소요시간, 사진 매수 등의 정보를 사전에 확인하여야 한다.","blanks":[{"s":41,"e":47,"t":"num"},{"s":62,"e":68,"t":"num"}]},{"lvl":0,"label":"②","text":"정사영상의 중복도는「무인비행장치 측량 작업규정」 제13조제1항 및 제2항에 따른다.","blanks":[]},{"lvl":0,"label":"③","text":"드론영상 촬영시에는 드론조종자 자격과 조종 경험이 있는 2인 이상의 전문인력을 현장에 배치해야 하며, 주요 역할은 다음 각호와 같다.","blanks":[{"s":31,"e":32,"t":"num"}]},{"lvl":1,"label":"1.","text":"드론조종 및 제어시스템 운영 등 1명","blanks":[{"s":18,"e":19,"t":"num"}]},{"lvl":1,"label":"2.","text":"비행상황 모니터링 및 현장 안전조치 등 1명","blanks":[{"s":22,"e":23,"t":"num"}]},{"lvl":0,"label":"④","text":"드론영상 촬영이 끝나면 별지 제8호서식 드론 촬영 기록부에 따라 그 촬영기록을 작성하여야 한다.","blanks":[]}],"chap":"제4장 영상 촬영 및 성과검증"},{"id":"drone-12","no":"제12조","title":"입체영상 및 정사영상의 제작","lines":[{"lvl":0,"label":"①","text":"입체영상은 최신 지오이드(Geoid) 모델을 기준으로 내ㆍ외부 표정요소 등을 기반으로 영상매칭방법을 이용한 격자형태로 제작하여야 한다.","blanks":[]},{"lvl":0,"label":"②","text":"정사영상 제작 소프트웨어 기능은 「무인비행장치 측량 작업규정」 제17조 제1항에 따른다.","blanks":[]},{"lvl":0,"label":"③","text":"정사영상의 제작방법 등은 「무인비행장치 측량 작업규정」 제25조 및 제27조에 따른다.","blanks":[]},{"lvl":0,"label":"④","text":"정사영상의 기준점과 지상기준점의 위치 차이는 평면 ±0.05미터 이내이어야 하며, 정사영상 제작프로그램 결과보고서에서 확인할 수 있어야 한다.","blanks":[{"s":28,"e":35,"t":"num"}]}],"chap":"제4장 영상 촬영 및 성과검증"},{"id":"drone-13","no":"제13조","title":"정사영상의 검증","lines":[{"lvl":0,"label":"①","text":"드론조종자는 토지이동이 수반되는 지적측량 및 지적재조사측량의 경우 측량성과 검사 요청 시 다음 각호의 정사영상 자료를 지적소관청 또는 지적재조사 책임수행기관에 제출하여야 한다. 다만, 제6조 단서에 해당하는 경우에는 제1호 및 제2호의 서류제출을 생략할 수 있다.","blanks":[{"s":66,"e":71,"t":"org"}]},{"lvl":1,"label":"1.","text":"「항공안전법 시행규칙」 별지 제122호서식으로 신청한 비행승인서","blanks":[]},{"lvl":1,"label":"2.","text":"국방부 항공촬영 지침서 붙임 2호서식에 의해 신청한 촬영허가서","blanks":[]},{"lvl":1,"label":"3.","text":"별지 제8호서식 드론촬영 기록부","blanks":[]},{"lvl":1,"label":"4.","text":"별지 제9호서식 정사영상 검사표","blanks":[]},{"lvl":1,"label":"5.","text":"정사영상 제작 프로그램 결과보고서","blanks":[]},{"lvl":1,"label":"6.","text":"정사영상 원본","blanks":[]},{"lvl":0,"label":"②","text":"정사영상 또는 입체영상을 제작한 자는 별지 제9호서식 정사영상 검사표에 따라 결과값을 분석하여 다음 각호의 기준에 적합한지 검증하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"평면 위치 정확도가 제12조제4항의 기준에 적합할 것","blanks":[]},{"lvl":1,"label":"2.","text":"검사점 평면위치의 연결교차 ±0.1미터 이내일 것(단, 지적재조사측량 지역인 경우에는 ±0.07미터 이내)","blanks":[{"s":15,"e":21,"t":"num"},{"s":48,"e":55,"t":"num"}]},{"lvl":1,"label":"3.","text":"지상기준점 및 검사점의 배치의 적정성","blanks":[]},{"lvl":0,"label":"③","text":"제1항에 따른 기준에 적합하지 않은 정사영상은 지상경계 및 현황을 추출하는데 사용할 수 없다.","blanks":[]}],"chap":"제4장 영상 촬영 및 성과검증"},{"id":"drone-14","no":"제14조","title":"재촬영","lines":[{"lvl":0,"label":"","text":"정사영상이 다음 각호의 어느 하나에 해당하는 경우에는 다시 촬영하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"제11조제2항의 중복도 미만으로 영상이 촬영된 경우","blanks":[]},{"lvl":1,"label":"2.","text":"제13조제1항의 검증기준에 적합하지 않은 경우","blanks":[]},{"lvl":1,"label":"3.","text":"구름 및 안개, 태양각 등으로 인한 그림자, 카메라 노출의 과소, 흐림(Blurring) 등으로 영상판독이 불가능한 경우","blanks":[]},{"lvl":1,"label":"4.","text":"적설 또는 홍수 등 자연재해로 인하여 지형을 구별할 수 없는 경우","blanks":[]},{"lvl":1,"label":"5.","text":"기타 영상의 정확도가 떨어지거나 지형ㆍ지물의 식별이 불가능하여 다시 촬영하는 것이 타당한 경우","blanks":[]}],"chap":"제4장 영상 촬영 및 성과검증"},{"id":"drone-15","no":"제15조","title":"추출기준 등","lines":[{"lvl":0,"label":"①","text":"정사영상 또는 입체영상에서 지상경계, 지상구조물, 토지이용현황 등이 명확히 식별되는 경우 경계 및 현황을 추출할 수 있다.","blanks":[]},{"lvl":0,"label":"②","text":"제1항에 따른 경계 및 현황의 추출 종류는 다음 각호와 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"도로, 철도, 항만, 공항, 주차장, 하천, 유수지, 학교, 공공청사 등 도시ㆍ군계획시설의 경계 및 현황","blanks":[]},{"lvl":1,"label":"2.","text":"담장, 옹벽, 석축, 펜스 등 토지의 경계 및 현황","blanks":[]},{"lvl":1,"label":"3.","text":"전ㆍ답ㆍ과수원 등 농지의 경작구분이 가능한 경계 및 현황","blanks":[]},{"lvl":1,"label":"4.","text":"시설물, 구조물 등의 현황","blanks":[]},{"lvl":1,"label":"5.","text":"임야와 토지의 경계 및 능선 또는 계곡","blanks":[]},{"lvl":1,"label":"6.","text":"건물(건물의 외벽, 다만 경계설정 목적의 추출인 경우 건물의 처마)","blanks":[]},{"lvl":1,"label":"7.","text":"그 밖에 정사영상에서 명확히 식별되는 현황","blanks":[]}],"chap":"제5장 경계 추출 및 성과검증"},{"id":"drone-16","no":"제16조","title":"추출방법","lines":[{"lvl":0,"label":"①","text":"경계 및 현황은 도면 편집 소프트웨어를 활용하여 수동 또는 자동방식으로 추출한다.","blanks":[]},{"lvl":0,"label":"②","text":"정사영상 또는 입체영상에 지적도, 도시ㆍ군 관리계획선 및 측량자료, 수치지형도 등을 중첩하거나 임시 경계점표지를 설치하여 지상경계 및 현황 추출대상을 선정할 수 있다.","blanks":[]},{"lvl":0,"label":"③","text":"수동방식에 의하여 경계 및 현황을 추출하는 경우 정사영상 또는 입체영상을 확대한 후 상하좌우 및 고저를 확인하는 방법으로 경계 및 현황을 추출하며, 예시는 별표 5와 같다.","blanks":[]},{"lvl":0,"label":"④","text":"제1항에 따라 추출한 경계 및 현황은 「지적업무 처리규정」 별표 3에 따른 코드를 적용하여 점과 선 또는 면의 형태로 추출하며, 드론측량 방법임을 알 수 있도록 색상을 다르게 구분하여 표시할 수 있다. 다만, 지적재조사측량의 경우 「지적재조사 측량규정」 별표 5를 적용한다.","blanks":[{"s":72,"e":76,"t":"term"}]},{"lvl":0,"label":"⑤","text":"제15조제2항제6호에 따라 정사영상에서 건물의 외벽을 추출할 수 없어 건물의 처마를 추출하는 경우에는 선의 색상을 달리하여 표시할 수 있다.","blanks":[]}],"chap":"제5장 경계 추출 및 성과검증"},{"id":"drone-17","no":"제17조","title":"추출성과 작성","lines":[{"lvl":0,"label":"①","text":"추출성과는 측량성과파일 형태로 작성하고, 평면직각종횡선 좌표의 0.01미터 단위로 작성한다.","blanks":[{"s":35,"e":41,"t":"num"}]},{"lvl":0,"label":"②","text":"정사영상 또는 입체영상에서 별표 6과 같이 경계 및 현황 식별이 불가능한 경우에는 현지측량을 실시하여 추출성과를 보완 작성할 수 있다.","blanks":[]}],"chap":"제5장 경계 추출 및 성과검증"},{"id":"drone-18","no":"제18조","title":"추출성과 검증","lines":[{"lvl":0,"label":"①","text":"정사영상 또는 입체영상에서 경계 및 현황을 추출한 자는 추출성과의 정확성에 관한 검증을 제19조제1항에 따라 자체적으로 실시하여야 하며 토지이동을 수반하는 지적측량은 측량성과 검사 요청 시 지적소관청에 검증결과를 제출하여야 한다. 지적재조사측량의 경우에는 「지적재조사에 관한 특별법」 제5조의2에 따른 책임수행기관(이하 \"책임수행기관\"이라 한다)에게 검증결과를 제출해야 하며, 책임수행기관이 경계 및 현황을 추출하였을 때는 지적소관청에 검증결과를 제출하여야 한다.","blanks":[{"s":106,"e":111,"t":"org"},{"s":237,"e":242,"t":"org"}]},{"lvl":0,"label":"②","text":"정사영상 또는 입체영상에서 경계 및 현황을 추출하여 토지이동을 수반하는 지적측량 또는 지적재조사측량을 수행한 자는 다음 각호의 성과물을 지적소관청 및 책임수행기관에 제출하여야 한다.","blanks":[{"s":76,"e":81,"t":"org"}]},{"lvl":1,"label":"1.","text":"별지 제10호서식 경계점 관측 및 좌표계산부(지적재조사측량에 한함)","blanks":[]},{"lvl":1,"label":"2.","text":"별지 제11호서식 경계 및 현황 추출성과 검증도","blanks":[]},{"lvl":1,"label":"3.","text":"별지 제12호서식 경계 및 현황 추출성과 검증표","blanks":[]},{"lvl":0,"label":"③","text":"제1항에 따라 검증을 요청받은 지적소관청 및 책임수행기관은 추출성과를 제출받은 날부터 10일 이내에 검증하여야 한다. 다만 기상여건 등으로 기간 내에 검증이 어려운 경우 10일 이내의 범위에서 기간을 연장할 수 있다.","blanks":[{"s":17,"e":22,"t":"org"},{"s":48,"e":51,"t":"per"},{"s":95,"e":98,"t":"per"}]},{"lvl":0,"label":"④","text":"지적소관청 및 책임수행기관은 추출성과에 대한 검증이 끝나면 검증을 요청한 자에게 그 결과를 통지하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제5장 경계 추출 및 성과검증"},{"id":"drone-19","no":"제19조","title":"검증방법","lines":[{"lvl":0,"label":"①","text":"지적소관청 및 책임수행기관은 추출성과에 대해 도시계획시설, 고정된 지형ㆍ지물, 토지의 경계 및 현황 등을 대상으로 동, 서, 남, 북, 중앙 등 구역별 표본을 지적재조사측량 지역은 5점 이상, 그 외의 지역은 3점 이상 선정하여 검증해야 하며, 세부측량시 「지적업무처리규정」 제20조제14항에 따라 지상경계선과의 부합여부를 확인하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":101,"e":103,"t":"num"},{"s":117,"e":119,"t":"num"}]},{"lvl":0,"label":"②","text":"제1항에 따른 검증을 위한 현지측량은 「지적측량 시행규칙」 제5조제2항의 지적측량 방법에 따른다. 다만 다음 각호의 경우에는 경계 및 현황추출에 사용된 정사영상 또는 입체영상으로 검증할 수 있다.","blanks":[]},{"lvl":1,"label":"1.","text":"사람의 접근이 불가능하거나 위험한 경우","blanks":[]},{"lvl":1,"label":"2.","text":"보안 또는 안전상의 이유로 출입이 제한되는 경우","blanks":[]},{"lvl":0,"label":"③","text":"지적측량에 사용할 수 있는 검증성과는 다음 각호와 같으며 이를 초과하는 경우에는 다시 추출하거나 현지측량을 통해 보완하여야 한다.","blanks":[]},{"lvl":1,"label":"1.","text":"지적재조사측량 지역: ±0.07미터 이내","blanks":[{"s":12,"e":19,"t":"num"}]},{"lvl":1,"label":"2.","text":"그 밖의 측량지역: 「지적측량 시행규칙」 제27조제1항제4호에 따를 것","blanks":[]}],"chap":"제5장 경계 추출 및 성과검증"},{"id":"drone-20","no":"제20조","title":"영상 및 성과의 활용","lines":[{"lvl":0,"label":"①","text":"지적측량수행자는 제12조제4항 및 제19조제3항에 따라 검증이 완료된 영상 및 성과 등을 지적측량 및 지적재조사측량에 활용할 수 있다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"②","text":"지적재조사측량 지역 이외의 경우에는 세부측량시 「지적업무 처리규정」제20조제14항에 따라 지상경계선과의 부합여부를 확인 후 성과결정을 하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"지적소관청은 제12조제4항 및 제19조제3항의 기준에 적합한 영상 및 성과를 지적측량 및 지적재조사측량 성과검사에 활용할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"}]}],"chap":"제6장 영상 활용 및 성과 관리"},{"id":"drone-21","no":"제21조","title":"영상 및 성과관리 등","lines":[{"lvl":0,"label":"①","text":"지적측량수행자는 제12조제4항 및 제19조제3항에 따른 검증기준에 적합한 정사영상과 성과물을 지적측량파일로 보관하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"}]},{"lvl":0,"label":"②","text":"제13조에 따라 지적측량 및 지적재조사측량의 성과물을 제출받은 지적소관청은 다음 각호의 방법에 의하여 정사영상 자료 등을 관리하여야 한다.","blanks":[{"s":35,"e":40,"t":"org"}]},{"lvl":1,"label":"1.","text":"지적측량을 수행한 경우, 별지 제13호서식 드론영상 관리대장에 따라 작성하고 관리하여야 한다.","blanks":[]},{"lvl":1,"label":"2.","text":"지적재조사측량을 수행한 경우, 영상 및 성과물을 지적재조사행정시스템에 등록하고 별지 제13호서식 드론영상 관리대장에 따라 작성하고 관리하여야 한다.","blanks":[]},{"lvl":0,"label":"③","text":"지적소관청과 지적재조사 책임수행기관은 지적재조사측량을 위해 필요한 경우 영상 및 성과 등을 지적측량수행자 또는 지적재조사대행자에게 제공할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":51,"e":58,"t":"org"}]},{"lvl":0,"label":"④","text":"제3항에 따른 영상 및 성과 등은 지적재조사사업 이외의 용도로 사용할 수 없으며, 사용을 완료한 영상 및 성과는 지체없이 파기하는 등「국토교통부 국가공간정보 보안관리규정」을 준수하여 관리하여야 한다.","blanks":[]}],"chap":"제6장 영상 활용 및 성과 관리"},{"id":"drone-22","no":"제22조","title":"재검토기한","lines":[{"lvl":0,"label":"","text":"국토교통부장관은 이 규정에 대하여「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 2023년 8월 25일 기준으로 매 3년이 되는 시점(매 3년째의 8월 24일까지를 말한다.)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","blanks":[{"s":0,"e":7,"t":"org"},{"s":68,"e":69,"t":"num"},{"s":80,"e":81,"t":"num"}]}],"chap":"제6장 영상 활용 및 성과 관리"}]},"wgs":{"id":"wgs","name":"지적공부 세계측지계 변환규정","kind":"국토교통부훈령","effective":"2021-04-19","promulgated":"2021-04-19","url":"https://www.law.go.kr/행정규칙/지적공부 세계측지계 변환규정","short":"세계측지계 변환규정","annex":["[별지 1] 변환구역 결과부","[별지 2] 공통점 배치도","[별지 3] 변환계수 산출부","[별지 4] 공통점측량 관측표(정지측량)","[별지 5] 공통점측량 관측부(정지측량)","[별지 6] 공통점측량 관측부","[별지 7] 위치검증 계산부","[별지 8] 면적검증 계산부","[별지 9] 파기확인서"],"rule":true,"articles":[{"id":"wgs-1","no":"제1조","title":"목적","lines":[{"lvl":0,"label":"","text":"이 규정은 「공간정보의 구축 및 관리 등에 관한 법률」제6조에 따른 부칙(법률 제9774호, 2009.6.9.) 제5조제2항 및「지적재조사에 관한 특별법」제4조에 따라 수립하여 고시된 기본계획에 의하여 세계측지계 기준으로 지적공부를 변환하기 위한 방법과 절차를 정함을 목적으로 한다.","blanks":[]}],"chap":"제1장 총 칙"},{"id":"wgs-2","no":"제2조","title":"정의","lines":[{"lvl":0,"label":"","text":"이 규정에서 사용하는 용어의 정의는 다음과 같다.","blanks":[]},{"lvl":1,"label":"1.","text":"\"세계측지계 변환\"이란 지역측지계 기준으로 등록된 지적공부를 세계측지계 기준으로 변환하는 것을 말한다.","blanks":[]},{"lvl":1,"label":"2.","text":"\"사업지구\"란 세계측지계 기준으로 지적공부에 등록된 지역을 제외한 모든 지역을 말한다.","blanks":[]},{"lvl":1,"label":"3.","text":"\"변환구역\"이란 세계측지계 변환을 위하여 동일한 변환계수 및 이동량을 사용하는 구역을 말한다.","blanks":[]},{"lvl":1,"label":"4.","text":"\"공통점\"이란 지역측지계와 세계측지계 성과를 모두 가지고 있는 지적기준점 중 세계측지계 변환에 이용되는 지적기준점을 말한다.","blanks":[{"s":35,"e":40,"t":"term"},{"s":58,"e":63,"t":"term"}]},{"lvl":1,"label":"5.","text":"\"변환계수\"란 2차원 헬머트(Helmert) 변환모델에 적용하기 위하여 산출한 계수를 말한다.","blanks":[]},{"lvl":1,"label":"6.","text":"\"공통점변환\"이란 세계측지계 변환을 위해 공통점을 이용하여 변환하는 방법을 말한다.","blanks":[]},{"lvl":1,"label":"7.","text":"\"2차원 헬머트(Helmert) 변환\"이란 2차원 평면상에서 이동ㆍ축척ㆍ회전을 이용하여 도형의 좌표를 변환하는 모델을 말한다.","blanks":[]},{"lvl":1,"label":"8.","text":"\"편차량\"이란 변환계수를 이용하여 세계측지계로 변환한 성과와 세계측지계 기준의 계산성과 또는 실측성과와의 차이를 말한다.","blanks":[]}],"chap":"제1장 총 칙"},{"id":"wgs-3","no":"제3조","title":"적용범위","lines":[{"lvl":0,"label":"①","text":"이 규정은 지적공부의 세계측지계 변환에 관하여 다른 규정에 우선하여 적용한다.","blanks":[]},{"lvl":0,"label":"②","text":"지적공부의 세계측지계 변환 절차와 방법에 대하여 규정하지 아니한 사항은 「공간정보의 구축 및 관리 등에 관한 법률」(이하 \"법\"이라 한다),「지적재조사에 관한 특별법」,「지적측량시행규칙」,「지적재조사측량규정」에서 규정한 것을 준용한다.","blanks":[]}],"chap":"제1장 총 칙"},{"id":"wgs-4","no":"제4조","title":"세계측지계 변환 시행자","lines":[{"lvl":0,"label":"①","text":"세계측지계 변환은 지적소관청이 시행한다.","blanks":[{"s":10,"e":15,"t":"org"}]},{"lvl":0,"label":"②","text":"지적소관청은 세계측지계 변환을 위한 지적기준점 조사 및 공통점 측량, 지적도ㆍ임야도(이하 \"도면\"이라 한다) 정비 등을「국가공간정보 기본법」제12조에 따라 설립된 기관에게 대행하게 할 수 있다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":20,"e":25,"t":"term"}]}],"chap":"제2장 계획 및 준비"},{"id":"wgs-5","no":"제5조","title":"실시계획 수립","lines":[{"lvl":0,"label":"①","text":"지적소관청은 공통점 확보 및 변환구역 선정을 위해 다음 각 호의 사항을 검토하여 실시계획을 수립하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":1,"label":"1.","text":"사업 추진일정에 관한 사항","blanks":[{"s":0,"e":14,"t":"item"}]},{"lvl":1,"label":"2.","text":"인력, 장비, 예산 운영에 관한 사항","blanks":[{"s":0,"e":2,"t":"item"},{"s":4,"e":6,"t":"item"},{"s":8,"e":20,"t":"item"}]},{"lvl":1,"label":"3.","text":"공통점 확보를 위한 기준점 측량 및 분석에 관한 사항","blanks":[{"s":0,"e":29,"t":"item"}]},{"lvl":1,"label":"4.","text":"변환성과의 검증 및 관리 등에 관한 사항","blanks":[{"s":0,"e":22,"t":"item"}]},{"lvl":0,"label":"②","text":"지적소관청은 수립된 실시계획을 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사ㆍ특별자치도지사 및「지방자치법」제175조에 따른 인구 50만 이상 대도시의 시장(자치구가 아닌 구를 두지 않은 시장은 제외한다. 이하 \"시ㆍ도지사\"라 한다)에게 제출하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":67,"e":70,"t":"num"},{"s":113,"e":118,"t":"org"}]},{"lvl":0,"label":"③","text":"시ㆍ도지사는 제2항에 따른 실시계획을 검토하여 결과를 15일 이내에 지적소관청에 통보하여야 하며, 변경사항이 있는 경우 지적소관청은 정당한 사유가 없으면 실시계획을 수정하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":30,"e":33,"t":"per"},{"s":38,"e":43,"t":"org"},{"s":67,"e":72,"t":"org"}]}],"chap":"제2장 계획 및 준비"},{"id":"wgs-6","no":"제6조","title":"자료제공","lines":[{"lvl":0,"label":"①","text":"지적소관청은 제4조제2항에 의하여 대행하게 할 경우 필요한 지적기준점 자료 및 지적전산자료 등을 대행자에게 제공하여야 하며, 대행자는 지적소관청에 자료 제공을 요청할 때에는 다음 각 호의 서식을 작성하여 제출하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"},{"s":33,"e":38,"t":"term"},{"s":75,"e":80,"t":"org"}]},{"lvl":1,"label":"1.","text":"보안각서(「부동산종합공부시스템 운영 및 관리규정」별지 제4호 서식)","blanks":[]},{"lvl":1,"label":"2.","text":"부동산종합공부 전산자료 수령증(「부동산종합공부시스템 운영 및 관리규정」별지 제5호 서식)","blanks":[]},{"lvl":0,"label":"②","text":"지적소관청은 제1항에 따른 자료를 제공할 때에는 소유자 등 개인정보와 관련된 사항은 제외하여야 한다.","blanks":[{"s":0,"e":5,"t":"org"}]},{"lvl":0,"label":"③","text":"대행자는 지적소관청으로부터 제공받은 자료를 해당 사업에만 사용하여야 하며, 사업이 완료되는 즉시 파기하고 별지 제9호서식의 파기확인서를 지적소관청에 제출하여야 한다.","blanks":[{"s":5,"e":10,"t":"org"},{"s":76,"e":81,"t":"org"}]}],"chap":"제2장 계획 및 준비"},{"id":"wgs-7","no":"제7조","title":"지적기준점 조사","lines":[{"lvl":0,"label":"①","text":"시행자는 원활한 사업추진을 위하여 공통점 측량을 실시하기 전에 지적기준점 조사를 실시한다.","blanks":[{"s":35,"e":40,"t":"term"}]},{"lvl":0,"label":"②","text":"지적기준점 조사는 지적기준점의 분포, 망실여부, 계산부의 보존유무, 위성측량 가능여부 등을 확인한다.","blanks":[{"s":0,"e":5,"t":"term"},{"s":10,"e":15,"t":"term"},{"s":38,"e":42,"t":"term"}]},{"lvl":0,"label":"③","text":"공통점은 지적기준점 조사 결과를 반영하여 선정한다.","blanks":[{"s":5,"e":10,"t":"term"}]}],"chap":"제2장 계획 및 준비"},{"id":"wgs-8","no":"제8조","title":"공통점 선정기준","lines":[{"lvl":0,"label":"①","text":"공통점은 제11조의 변환구역 선정 및 제13조의 변환구역 변환을 위해 다음 각 호에 해당되는 지적기준점으로 선정한다.","blanks":[{"s":52,"e":57,"t":"term"}]},{"lvl":1,"label":"1.","text":"전국 지적측량기준점 정비 및 측량성과 산출사업(2009년)으로 정비된 지적삼각점, 지적삼각보조점","blanks":[{"s":26,"e":31,"t":"per"},{"s":39,"e":44,"t":"term"},{"s":46,"e":53,"t":"term"}]},{"lvl":1,"label":"2.","text":"시ㆍ도지사 및 지적소관청이 지적기준점 정비사업을 별도로 수행하여 관리하고 있는 지적기준점","blanks":[{"s":0,"e":5,"t":"org"},{"s":8,"e":13,"t":"org"},{"s":15,"e":20,"t":"term"},{"s":44,"e":49,"t":"term"}]},{"lvl":1,"label":"3.","text":"지적확정측량이 완료되어 세계측지계 성과를 보유하고 있는 지적기준점","blanks":[{"s":0,"e":6,"t":"term"},{"s":31,"e":36,"t":"term"}]},{"lvl":1,"label":"4.","text":"성과가 상호 부합한다고 판단되어 지적소관청에서 자체적으로 활용하고 있는 지적기준점","blanks":[{"s":18,"e":23,"t":"org"},{"s":40,"e":45,"t":"term"}]},{"lvl":0,"label":"②","text":"공통점은 변환구역별 성과가 양호한 지적기준점으로 선정한다. 다만, 원점을 달리하는 경우에는 원점별로 선정하여야 한다.","blanks":[{"s":19,"e":24,"t":"term"}]},{"lvl":0,"label":"③","text":"지적기준점이 다음 각 호에 해당하는 경우에는 공통점 선정에서 제외할 수 있다.","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":1,"label":"1.","text":"위성측량 실시지역에서 건물이나 위성신호 왜곡 등으로 양호한 세계측지계 성과 취득이 어려운 경우","blanks":[{"s":0,"e":4,"t":"term"}]},{"lvl":1,"label":"2.","text":"토털스테이션 측량방법을 통해 양호한 세계측지계 성과 취득이 어려운 경우","blanks":[]},{"lvl":1,"label":"3.","text":"지적기준점의 지역측지계 성과가 주위 성과와 부합되지 않는 경우","blanks":[{"s":0,"e":5,"t":"term"}]},{"lvl":1,"label":"4.","text":"지적소관청에서 공통점으로 사용하는데 불필요하다고
